name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build @meso/types
        run: pnpm --filter @meso/types run build

      - name: Build @meso/ui
        run: pnpm --filter @meso/ui run build

      - name: Test @meso/types
        run: pnpm --filter @meso/types run test

      - name: Test @meso/ui
        run: pnpm --filter @meso/ui run test

      - name: Smoke test (pack + install + vite build)
        run: |
          cd packages/meso-types && pnpm pack --out-dir /tmp/tarballs
          cd packages/meso-ui    && pnpm pack --out-dir /tmp/tarballs
          ls /tmp/tarballs/
          # Install into a minimal vite project and verify it builds
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cat > package.json << 'EOF'
          {
            "name": "smoke",
            "private": true,
            "type": "module",
            "dependencies": {
              "@meso/types": "/tmp/tarballs/meso-types-1.0.0.tgz",
              "@meso/ui": "/tmp/tarballs/meso-ui-2.0.0.tgz",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "vite": "^5.0.0",
              "@vitejs/plugin-react": "^4.0.0"
            }
          }
          EOF
          cat > vite.config.js << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          export default defineConfig({ plugins: [react()] })
          EOF
          mkdir src
          cat > src/main.jsx << 'EOF'
          import '@meso/ui/tokens.css'
          import '@meso/ui/style.css'
          import { createInitialStreamState, isCompatibleVersion, stagePayloadToStage } from '@meso/ui'
          const s = createInitialStreamState()
          console.log(s.status, typeof isCompatibleVersion, typeof stagePayloadToStage)
          EOF
          cat > index.html << 'EOF'
          <!doctype html><html><body><script type="module" src="/src/main.jsx"></script></body></html>
          EOF
          npm install --legacy-peer-deps
          npx vite build --outDir /tmp/smoke-dist
