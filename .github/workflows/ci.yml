name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build @meso.ai/types
        run: pnpm --filter @meso.ai/types run build

      - name: Build @meso.ai/ui
        run: pnpm --filter @meso.ai/ui run build

      - name: Build @meso.ai/client
        run: pnpm --filter @meso.ai/client run build

      - name: Test @meso.ai/types
        run: pnpm --filter @meso.ai/types run test

      - name: Test @meso.ai/ui
        run: pnpm --filter @meso.ai/ui run test

      - name: Test @meso.ai/client
        run: pnpm --filter @meso.ai/client run test

      - name: Smoke test (pack + install + vite build)
        run: |
          mkdir -p /tmp/tarballs
          pnpm --filter @meso.ai/types pack --pack-destination /tmp/tarballs
          pnpm --filter @meso.ai/ui    pack --pack-destination /tmp/tarballs
          pnpm --filter @meso.ai/client pack --pack-destination /tmp/tarballs
          ls /tmp/tarballs/

          # Fail CI if any publishable dependency still uses workspace protocol
          node <<'NODE'
          const { execSync } = require('child_process')
          const fs = require('fs')
          const tarballs = fs.readdirSync('/tmp/tarballs').filter((f) => f.endsWith('.tgz'))
          for (const tgz of tarballs) {
            const path = `/tmp/tarballs/${tgz}`
            const pkg = JSON.parse(execSync(`tar -xOf "${path}" package/package.json`, { encoding: 'utf8' }))
            const sections = ['dependencies', 'optionalDependencies', 'peerDependencies']
            const bad = []
            for (const section of sections) {
              const deps = pkg[section] || {}
              for (const [name, range] of Object.entries(deps)) {
                if (String(range).startsWith('workspace:')) {
                  bad.push(`${section}.${name}=${range}`)
                }
              }
            }
            if (bad.length) {
              console.error(`FAIL ${pkg.name}@${pkg.version}: workspace protocol leaked:`)
              for (const item of bad) console.error('  - ' + item)
              process.exit(1)
            }
            console.log(`OK ${pkg.name}@${pkg.version}`)
          }
          NODE

          # Install into a minimal vite project and verify it builds
          mkdir -p /tmp/smoke && cd /tmp/smoke
          TYPES_TGZ=$(ls /tmp/tarballs/meso.ai-types-*.tgz | head -1)
          UI_TGZ=$(ls /tmp/tarballs/meso.ai-ui-*.tgz | head -1)
          CLIENT_TGZ=$(ls /tmp/tarballs/meso.ai-client-*.tgz | head -1)
          cat > package.json << EOF
          {
            "name": "smoke",
            "private": true,
            "type": "module",
            "dependencies": {
              "@meso.ai/types": "$TYPES_TGZ",
              "@meso.ai/ui": "$UI_TGZ",
              "@meso.ai/client": "$CLIENT_TGZ",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "vite": "^5.0.0",
              "@vitejs/plugin-react": "^4.0.0"
            }
          }
          EOF
          cat > vite.config.js << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          export default defineConfig({ plugins: [react()] })
          EOF
          mkdir src
          cat > src/main.jsx << 'EOF'
          import '@meso.ai/ui/tokens.css'
          import '@meso.ai/ui/style.css'
          import { createInitialStreamState, isCompatibleVersion, phaseRecordToStage } from '@meso.ai/ui'
          import { createMesoSession } from '@meso.ai/client'
          const s = createInitialStreamState()
          console.log(s.status, typeof isCompatibleVersion, typeof phaseRecordToStage, typeof createMesoSession)
          EOF
          cat > index.html << 'EOF'
          <!doctype html><html><body><script type="module" src="/src/main.jsx"></script></body></html>
          EOF
          npm install --legacy-peer-deps
          npx vite build --outDir /tmp/smoke-dist
