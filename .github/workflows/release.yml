name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating GitHub Release
      id-token: write  # for OIDC Trusted Publishing to npm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @meso.ai/types run build
          pnpm --filter @meso.ai/ui run build

      - name: Test packages
        run: |
          pnpm --filter @meso.ai/types run test
          pnpm --filter @meso.ai/ui run test

      - name: Pack tarballs
        run: |
          mkdir -p dist-tarballs
          pnpm --filter @meso.ai/types pack --pack-destination dist-tarballs
          pnpm --filter @meso.ai/ui    pack --pack-destination dist-tarballs
          ls dist-tarballs/

      - name: Publish to npm (OIDC Trusted Publishing)
        run: |
          publish_pkg() {
            local pkg_dir=$1
            cd "$pkg_dir"
            local name=$(node -p "require('./package.json').name")
            local version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version &>/dev/null 2>&1; then
              echo "⏭ $name@$version already published, skipping"
            else
              npm publish --access public --provenance
            fi
            cd -
          }
          publish_pkg packages/meso-types
          publish_pkg packages/meso-ui

      - name: Create GitHub Release with tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-tarballs/*.tgz
          generate_release_notes: true
