name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for creating GitHub Release
      id-token: write  # for OIDC Trusted Publishing to npm
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @meso.ai/types run build
          pnpm --filter @meso.ai/ui run build

      - name: Test packages
        run: |
          pnpm --filter @meso.ai/types run test
          pnpm --filter @meso.ai/ui run test

      - name: Pack tarballs
        run: |
          mkdir -p dist-tarballs
          pnpm --filter @meso.ai/types pack --pack-destination dist-tarballs
          pnpm --filter @meso.ai/ui    pack --pack-destination dist-tarballs
          ls dist-tarballs/

      - name: Publish to npm (OIDC Trusted Publishing)
        run: |
          cd packages/meso-types && npm publish --access public --provenance
          cd ../../packages/meso-ui && npm publish --access public --provenance

      - name: Create GitHub Release with tarballs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-tarballs/*.tgz
          generate_release_notes: true
