<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流式会话演示</title>
  <style>
    :root {
      --color-bg:             #ecefe9;
      --color-bg-elevated:    #f4f6f2;
      --color-bg-white:       #ffffff;
      --color-text:           #2f3a32;
      --color-text-secondary: rgba(47,58,50,0.6);
      --color-text-muted:     rgba(47,58,50,0.4);
      --color-accent:         #527c5e;
      --color-accent-dark:    #2f7d4a;
      --color-border:         #d9dfd7;
      --color-border-light:   rgba(47,58,50,0.1);
      --color-error:          #c0392b;
      --color-success:        #2f7d4a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Demo selector tabs ── */
    .demo-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-white);
      padding: 0 16px;
      flex-shrink: 0;
    }
    .demo-tab {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--color-text-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .demo-tab:hover { color: var(--color-text); }
    .demo-tab.active { color: var(--color-accent-dark); border-bottom-color: var(--color-accent); font-weight: 600; }

    /* ── Main split area ── */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Chat pane ── */
    .chat-pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      transition: flex 0.2s ease;
    }

    .chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
    }

    .message-row {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px 16px;
    }

    /* User bubble */
    .bubble-user {
      display: flex;
      justify-content: flex-end;
    }
    .bubble-user-content {
      max-width: 75%;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: 14px 14px 4px 14px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* AI reply */
    .bubble-ai { display: flex; flex-direction: column; gap: 8px; }

    /* Stage bar */
    .stage-bar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.4s ease;
      max-height: 200px;
    }
    .stage-bar.collapsed { max-height: 0; opacity: 0; }

    .stage-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 2px 0;
    }
    .stage-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stage-dot.done    { background: var(--color-success); }
    .stage-dot.active  { background: var(--color-accent); animation: pulse 0.8s ease-in-out infinite alternate; }
    .stage-dot.pending { background: transparent; border: 1.5px solid var(--color-border); }
    @keyframes pulse { from { opacity: 1; transform: scale(1); } to { opacity: 0.5; transform: scale(0.8); } }
    .stage-item.done   .stage-label { color: var(--color-text-muted); }
    .stage-item.active .stage-label { color: var(--color-accent-dark); font-weight: 600; }
    .stage-item.pending .stage-label { color: var(--color-text-muted); }
    .stage-check { color: var(--color-success); font-size: 10px; }

    /* Memory chips */
    .memory-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.4s ease;
      max-height: 80px;
    }
    .memory-chips.collapsed { max-height: 0; opacity: 0; }
    .memory-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      background: rgba(82,124,94,0.08);
      border: 1px solid rgba(82,124,94,0.2);
      border-radius: 20px;
      font-size: 11px;
      color: var(--color-accent-dark);
      cursor: default;
    }
    .memory-chip-cat {
      font-weight: 600;
      opacity: 0.7;
    }

    /* Think block */
    .think-block {
      background: rgba(82,124,94,0.05);
      border-left: 2px solid var(--color-border);
      border-radius: 0 6px 6px 0;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .think-block.done { border-left-color: var(--color-border-light); }
    .think-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12px;
      color: var(--color-text-secondary);
      user-select: none;
    }
    .think-header:hover { color: var(--color-text); }
    .think-chevron {
      font-size: 10px;
      transition: transform 0.25s ease;
      display: inline-block;
    }
    .think-block.open .think-chevron { transform: rotate(90deg); }
    .think-body {
      max-height: 300px;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 12px 10px;
      font-size: 13px;
      line-height: 1.65;
      color: var(--color-text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .think-block:not(.open) .think-body { max-height: 0; padding-bottom: 0; }

    /* AI text content */
    .ai-content {
      font-size: 14px;
      line-height: 1.65;
      max-width: 100%;
      word-break: break-word;
    }
    .ai-content p { margin-bottom: 8px; }
    .ai-content p:last-child { margin-bottom: 0; }
    .ai-content code {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border-light);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 13px;
      font-family: "SF Mono", "Fira Code", monospace;
      color: var(--color-accent-dark);
    }
    .ai-content strong { font-weight: 650; }

    /* Streaming cursor */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--color-accent);
      margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 0.6s ease-in-out infinite alternate;
    }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.15; } }

    /* Action bar */
    .action-bar {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .action-bar.visible { opacity: 1; }
    .action-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-bg-white);
      font-size: 12px;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: background 0.12s;
    }
    .action-btn:hover { background: var(--color-bg-elevated); color: var(--color-text); }

    /* Splitter */
    .splitter {
      width: 4px;
      background: var(--color-border);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .splitter:hover { background: #9cb8a8; }

    /* Artifact pane */
    .artifact-pane {
      background: var(--color-bg-elevated);
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 0;
      transition: width 0.22s ease;
    }
    .artifact-pane.visible { width: 40%; }

    .artifact-tabs {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
      padding: 0 12px;
      background: var(--color-bg-white);
      min-height: 40px;
      flex-shrink: 0;
      gap: 2px;
    }
    .artifact-tab {
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      color: var(--color-text-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .artifact-tab.active {
      color: var(--color-accent-dark);
      border-bottom-color: var(--color-accent);
      font-weight: 600;
    }

    .artifact-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    .artifact-code {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 13px;
      line-height: 1.6;
      color: var(--color-text);
      white-space: pre;
      background: transparent;
    }
    .artifact-footer {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--color-border-light);
      flex-shrink: 0;
    }
    .artifact-action {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-bg-white);
      font-size: 12px;
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    .artifact-action:hover { background: var(--color-bg-elevated); }

    /* Composer */
    .composer-wrap {
      padding: 12px 24px 20px;
      flex-shrink: 0;
    }
    .composer {
      max-width: 820px;
      margin: 0 auto;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: var(--color-bg-white);
      overflow: hidden;
    }
    .composer textarea {
      width: 100%;
      border: none;
      padding: 12px 14px 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--color-text);
      resize: none;
      outline: none;
      background: transparent;
      line-height: 1.5;
      min-height: 44px;
    }
    .composer-toolbar {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-top: 1px solid var(--color-border-light);
      gap: 6px;
    }
    .composer-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: transparent;
      font-size: 12px;
      color: var(--color-text-secondary);
      cursor: pointer;
      font-family: inherit;
    }
    .composer-btn:hover { background: var(--color-bg-elevated); }
    .composer-spacer { flex: 1; }
    .send-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: var(--color-accent);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: filter 0.15s;
    }
    .send-btn:hover { filter: brightness(0.92); }
    .send-btn.stop { background: var(--color-text-secondary); }

    /* Controls */
    .demo-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--color-bg-elevated);
      border-bottom: 1px solid var(--color-border);
      font-size: 12px;
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }
    .ctrl-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-bg-white);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      color: var(--color-text);
      transition: background 0.12s;
    }
    .ctrl-btn:hover { background: rgba(82,124,94,0.08); }
    .ctrl-btn.primary { background: var(--color-accent); color: #fff; border-color: transparent; }
    .ctrl-btn.primary:hover { filter: brightness(0.92); }
    .speed-label { margin-left: 8px; }
    .speed-select {
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      font-size: 12px;
      font-family: inherit;
      color: var(--color-text);
      background: var(--color-bg-white);
    }
  </style>
</head>
<body>

<!-- Demo type tabs -->
<div class="demo-tabs">
  <div class="demo-tab active" onclick="selectDemo('basic', this)">基础流式输出</div>
  <div class="demo-tab" onclick="selectDemo('think', this)">Think Block</div>
  <div class="demo-tab" onclick="selectDemo('artifact', this)">Artifact 渲染</div>
  <div class="demo-tab" onclick="selectDemo('full', this)">完整一次对话</div>
</div>

<!-- Controls -->
<div class="demo-controls">
  <button class="ctrl-btn primary" id="play-btn" onclick="playDemo()">▶ 播放</button>
  <button class="ctrl-btn" onclick="resetDemo()">↺ 重置</button>
  <span class="speed-label">速度：</span>
  <select class="speed-select" id="speed-select">
    <option value="1">1×</option>
    <option value="2" selected>2×</option>
    <option value="4">4×</option>
  </select>
  <span id="status-text" style="margin-left:8px; color: var(--color-accent)"></span>
</div>

<!-- Workspace -->
<div class="workspace">
  <!-- Chat pane -->
  <div class="chat-pane" id="chat-pane">
    <div class="chat-thread" id="chat-thread"></div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea rows="2" id="composer-input" placeholder="向 Meso 发送消息…" readonly></textarea>
        <div class="composer-toolbar">
          <button class="composer-btn">知识库</button>
          <button class="composer-btn">Tools ▾</button>
          <div class="composer-spacer"></div>
          <button class="send-btn" id="send-btn">发送 ↵</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Splitter (hidden until artifact appears) -->
  <div class="splitter" id="splitter" style="display:none"></div>

  <!-- Artifact pane -->
  <div class="artifact-pane" id="artifact-pane">
    <div class="artifact-tabs" id="artifact-tabs"></div>
    <div class="artifact-body">
      <pre class="artifact-code" id="artifact-code"></pre>
    </div>
    <div class="artifact-footer">
      <button class="artifact-action">复制</button>
      <button class="artifact-action">下载</button>
      <button class="artifact-action">存入记忆</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   Demo scenarios
════════════════════════════════════════════════════════ */

const DEMOS = {
  basic: {
    userMsg: '用 Python 写一个快速排序函数',
    events: [
      { type: 'text', delta: '好的，下面是快速排序的 Python 实现：\n\n' },
      { type: 'text', delta: '快速排序的核心思路是**分治**：选取一个基准元素，' },
      { type: 'text', delta: '将数组分为小于基准和大于基准两部分，' },
      { type: 'text', delta: '然后递归地对两部分分别排序。\n\n' },
      { type: 'text', delta: '时间复杂度平均为 `O(n log n)`，最坏情况 `O(n²)`（已排序数组 + 固定基准）。' },
      { type: 'done' },
    ]
  },
  think: {
    userMsg: '分析一下：为什么说流式对话是 Meso 的灵魂？',
    events: [
      { type: 'think', delta: '用户问的是平台设计理念层面的问题。\n', done: false },
      { type: 'think', delta: '需要从用户体验和架构两个角度来回答。\n', done: false },
      { type: 'think', delta: '用户体验上：流式消除等待感，进度可见，思考过程透明。\n', done: false },
      { type: 'think', delta: '架构上：记忆、知识、Artifact 都是流式事件的输入或输出，不是独立模块。\n', done: false },
      { type: 'think', delta: '所以流式不是"功能之一"，而是所有能力的传递介质。', done: true },
      { type: 'text', delta: '从两个维度来看：\n\n' },
      { type: 'text', delta: '**用户体验层面**：传统 AI 应用让用户等待一个完整结果，' },
      { type: 'text', delta: 'Meso 让用户从第一个字节开始就看到系统在做什么 —— ' },
      { type: 'text', delta: '阶段进度、推理过程、Artifact 生成，全程可见。' },
      { type: 'text', delta: '\n\n**架构层面**：记忆召回是流的前置输入，' },
      { type: 'text', delta: 'Artifact 是流的解析输出，阶段进度是流的中间事件。' },
      { type: 'text', delta: '流式对话是所有能力的传递介质，而不是功能之一。' },
      { type: 'done' },
    ]
  },
  artifact: {
    userMsg: '用 Python 实现快速排序，并生成一个调用示例',
    events: [
      { type: 'text', delta: '以下是快速排序实现：\n\n' },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: 'def quicksort(arr):\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '    if len(arr) <= 1:\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '        return arr\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '    pivot = arr[len(arr) // 2]\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '    left  = [x for x in arr if x < pivot]\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '    mid   = [x for x in arr if x == pivot]\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '    right = [x for x in arr if x > pivot]\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '    return quicksort(left) + mid + quicksort(right)\n\n', done: false },
      { type: 'artifact', id: 'a1', lang: 'Python', delta: '\n# 示例\nnums = [3, 6, 8, 10, 1, 2, 1]\nprint(quicksort(nums))  # [1, 1, 2, 3, 6, 8, 10]\n', done: true },
      { type: 'text', delta: '代码已生成到右侧面板。时间复杂度平均 `O(n log n)`。' },
      { type: 'done' },
    ]
  },
  full: {
    userMsg: '帮我分析上次讨论的数据库优化方案，给出具体实施步骤',
    events: [
      { type: 'stage', name: '召回记忆', state: 'active' },
      { type: 'stage', name: '召回记忆', state: 'done' },
      { type: 'memory', snippets: [
        { cat: '上次讨论', text: '2026-05 讨论了 orders 表慢查询优化' },
        { cat: '项目背景', text: 'PostgreSQL 15，数据量约 300 万行' },
        { cat: '用户偏好', text: '偏好简洁方案，附代码示例' },
      ]},
      { type: 'stage', name: '检索知识', state: 'active' },
      { type: 'stage', name: '检索知识', state: 'done' },
      { type: 'stage', name: '生成回复', state: 'active' },
      { type: 'think', delta: '用户的 orders 表有 300 万行，慢查询在 user_id + 时间范围过滤。\n', done: false },
      { type: 'think', delta: '上次讨论决定用复合索引，暂缓分区表。\n', done: false },
      { type: 'think', delta: '现在要给出具体实施步骤，需要包含 SQL、风险提示和回滚方案。', done: true },
      { type: 'text', delta: '根据上次的讨论记录，整理了以下实施步骤：\n\n' },
      { type: 'text', delta: '**第一步：创建复合索引**（预计耗时 2-5 分钟，不锁表）\n\n' },
      { type: 'artifact', id: 'sql1', lang: 'SQL', delta: '-- 使用 CONCURRENTLY 避免锁表\n', done: false },
      { type: 'artifact', id: 'sql1', lang: 'SQL', delta: 'CREATE INDEX CONCURRENTLY idx_orders_user_time\n', done: false },
      { type: 'artifact', id: 'sql1', lang: 'SQL', delta: '  ON orders (user_id, created_at DESC)\n', done: false },
      { type: 'artifact', id: 'sql1', lang: 'SQL', delta: '  WHERE status != \'deleted\';\n\n', done: false },
      { type: 'artifact', id: 'sql1', lang: 'SQL', delta: '-- 验证索引已生效\nEXPLAIN ANALYZE\n  SELECT * FROM orders\n  WHERE user_id = $1\n    AND created_at > NOW() - INTERVAL \'30 days\';\n', done: true },
      { type: 'text', delta: '\n**第二步：观察慢查询日志**，确认索引命中率 > 95%。\n\n' },
      { type: 'text', delta: '**回滚方案**：`DROP INDEX CONCURRENTLY idx_orders_user_time;`\n\n' },
      { type: 'text', delta: '根据用户偏好背景（300 万行数据量），暂不需要考虑分区表。' },
      { type: 'stage', name: '生成回复', state: 'done' },
      { type: 'done' },
    ]
  }
}

/* ════════════════════════════════════════════════════════
   State
════════════════════════════════════════════════════════ */
let currentDemo = 'basic'
let playing = false
let timer = null

// DOM references (built dynamically)
let stageBar, memoryChips, thinkBlock, thinkBody, aiContentEl, actionBar, cursorEl
let stageItems = []
let artifactTabs = {}

/* ════════════════════════════════════════════════════════
   Demo selection
════════════════════════════════════════════════════════ */
function selectDemo(name, el) {
  document.querySelectorAll('.demo-tab').forEach(t => t.classList.remove('active'))
  el.classList.add('active')
  currentDemo = name
  resetDemo()
}

/* ════════════════════════════════════════════════════════
   Reset
════════════════════════════════════════════════════════ */
function resetDemo() {
  if (timer) clearTimeout(timer)
  playing = false
  document.getElementById('play-btn').textContent = '▶ 播放'
  document.getElementById('status-text').textContent = ''

  // Reset thread
  const thread = document.getElementById('chat-thread')
  thread.innerHTML = ''

  // Reset artifact pane
  document.getElementById('artifact-pane').classList.remove('visible')
  document.getElementById('splitter').style.display = 'none'
  document.getElementById('artifact-tabs').innerHTML = ''
  document.getElementById('artifact-code').textContent = ''
  artifactTabs = {}

  // Reset composer
  const demo = DEMOS[currentDemo]
  document.getElementById('composer-input').value = demo.userMsg

  stageBar = null; memoryChips = null; thinkBlock = null
  thinkBody = null; aiContentEl = null; actionBar = null; cursorEl = null
  stageItems = []
}

/* ════════════════════════════════════════════════════════
   Play
════════════════════════════════════════════════════════ */
function playDemo() {
  if (playing) { resetDemo(); return; }
  resetDemo()
  playing = true
  document.getElementById('play-btn').textContent = '↺ 重置'
  document.getElementById('status-text').textContent = '模拟流式输出中…'

  const demo = DEMOS[currentDemo]

  // 1. Show user message
  appendUserBubble(demo.userMsg)
  document.getElementById('composer-input').value = ''

  // 2. Create AI reply container
  appendAIBubble()

  // 3. Start event sequence
  const events = demo.events
  const speed = parseInt(document.getElementById('speed-select').value)
  let i = 0

  function next() {
    if (!playing || i >= events.length) {
      document.getElementById('status-text').textContent = ''
      return
    }
    const ev = events[i++]
    processEvent(ev)
    // Delay to next
    const delay = getDelay(ev, speed)
    timer = setTimeout(next, delay)
  }
  timer = setTimeout(next, 400 / speed)
}

function getDelay(ev, speed) {
  if (ev.type === 'text') {
    return Math.max(20, (ev.delta.length * 28) / speed)
  }
  if (ev.type === 'think') return Math.max(25, (ev.delta.length * 22) / speed)
  if (ev.type === 'artifact') return Math.max(20, (ev.delta.length * 18) / speed)
  if (ev.type === 'stage' && ev.state === 'active') return 300 / speed
  if (ev.type === 'stage' && ev.state === 'done') return 200 / speed
  if (ev.type === 'memory') return 100 / speed
  if (ev.type === 'done') return 0
  return 200 / speed
}

/* ════════════════════════════════════════════════════════
   DOM builders
════════════════════════════════════════════════════════ */
function appendUserBubble(text) {
  const thread = document.getElementById('chat-thread')
  const row = document.createElement('div')
  row.className = 'message-row'
  row.innerHTML = `<div class="bubble-user"><div class="bubble-user-content">${escHtml(text)}</div></div>`
  thread.appendChild(row)
  scrollThread()
}

function appendAIBubble() {
  const thread = document.getElementById('chat-thread')
  const row = document.createElement('div')
  row.className = 'message-row'

  // Stage bar
  const sbEl = document.createElement('div')
  sbEl.className = 'stage-bar'
  stageBar = sbEl

  // Memory chips
  const mcEl = document.createElement('div')
  mcEl.className = 'memory-chips'
  memoryChips = mcEl

  // Think block
  const tbEl = document.createElement('div')
  tbEl.className = 'think-block'
  tbEl.style.display = 'none'
  tbEl.innerHTML = `
    <div class="think-header" onclick="toggleThink(this.parentElement)">
      <span class="think-chevron">▶</span>
      <span class="think-title">思考中…</span>
    </div>
    <div class="think-body"></div>
  `
  thinkBlock = tbEl
  thinkBody = tbEl.querySelector('.think-body')

  // AI text
  const acEl = document.createElement('div')
  acEl.className = 'ai-content bubble-ai'
  aiContentEl = acEl

  // Cursor
  cursorEl = document.createElement('span')
  cursorEl.className = 'cursor'
  aiContentEl.appendChild(cursorEl)

  // Action bar
  const abEl = document.createElement('div')
  abEl.className = 'action-bar'
  abEl.innerHTML = `
    <button class="action-btn">复制</button>
    <button class="action-btn">👍</button>
    <button class="action-btn">👎</button>
  `
  actionBar = abEl

  const bubble = document.createElement('div')
  bubble.className = 'bubble-ai'
  bubble.append(sbEl, mcEl, tbEl, acEl, abEl)
  row.appendChild(bubble)
  thread.appendChild(row)
  scrollThread()
}

/* ════════════════════════════════════════════════════════
   Event processors
════════════════════════════════════════════════════════ */
function processEvent(ev) {
  switch (ev.type) {
    case 'stage':   handleStage(ev); break
    case 'memory':  handleMemory(ev); break
    case 'think':   handleThink(ev); break
    case 'text':    handleText(ev); break
    case 'artifact':handleArtifact(ev); break
    case 'done':    handleDone(); break
  }
}

function handleStage(ev) {
  if (ev.state === 'active') {
    const item = document.createElement('div')
    item.className = 'stage-item active'
    item.dataset.name = ev.name
    item.innerHTML = `<span class="stage-dot active"></span><span class="stage-label">${escHtml(ev.name)}</span>`
    stageBar.appendChild(item)
    stageItems.push(item)
  } else if (ev.state === 'done') {
    const item = stageItems.find(i => i.dataset.name === ev.name)
    if (item) {
      item.className = 'stage-item done'
      item.querySelector('.stage-dot').className = 'stage-dot done'
      item.querySelector('.stage-label').insertAdjacentHTML('beforeend', ' <span class="stage-check">✓</span>')
    }
  }
  scrollThread()
}

function handleMemory(ev) {
  ev.snippets.forEach(s => {
    const chip = document.createElement('div')
    chip.className = 'memory-chip'
    chip.innerHTML = `<span class="memory-chip-cat">${escHtml(s.cat)}</span>${escHtml(s.text)}`
    memoryChips.appendChild(chip)
  })
  scrollThread()
}

function handleThink(ev) {
  if (thinkBlock.style.display === 'none') {
    thinkBlock.style.display = ''
    thinkBlock.classList.add('open')
  }
  if (!ev.done) {
    thinkBody.textContent += ev.delta
    scrollThread()
  } else {
    // Auto-collapse after brief delay
    setTimeout(() => {
      thinkBlock.querySelector('.think-title').textContent = '已思考（点击展开）'
      thinkBlock.classList.remove('open')
      thinkBlock.classList.add('done')
    }, 400)
  }
}

let textBuffer = ''
function handleText(ev) {
  textBuffer += ev.delta
  // Remove cursor, update text, re-add cursor
  if (cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl)
  renderText(textBuffer)
  aiContentEl.appendChild(cursorEl)
  scrollThread()
}

function renderText(text) {
  // Simple inline rendering: bold, code, newlines
  const html = escHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>')
  aiContentEl.innerHTML = html
  aiContentEl.appendChild(cursorEl)
}

function handleArtifact(ev) {
  // Show artifact pane
  const pane = document.getElementById('artifact-pane')
  if (!pane.classList.contains('visible')) {
    pane.classList.add('visible')
    document.getElementById('splitter').style.display = ''
  }

  // Tab management
  const tabsEl = document.getElementById('artifact-tabs')
  if (!artifactTabs[ev.id]) {
    const tab = document.createElement('div')
    tab.className = 'artifact-tab active'
    tab.textContent = ev.lang
    tabsEl.querySelectorAll('.artifact-tab').forEach(t => t.classList.remove('active'))
    tabsEl.appendChild(tab)
    artifactTabs[ev.id] = { tab, content: '' }
    document.getElementById('artifact-code').textContent = ''
  }

  if (!ev.done) {
    artifactTabs[ev.id].content += ev.delta
    document.getElementById('artifact-code').textContent = artifactTabs[ev.id].content
  }
}

function handleDone() {
  playing = false
  // Remove cursor
  if (cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl)
  // Show action bar
  actionBar.classList.add('visible')
  // Collapse stage after delay
  setTimeout(() => {
    stageBar.classList.add('collapsed')
    memoryChips.classList.add('collapsed')
  }, 1500)
  document.getElementById('status-text').textContent = '✓ 流式完成'
  document.getElementById('play-btn').textContent = '▶ 重播'
}

/* ════════════════════════════════════════════════════════
   Helpers
════════════════════════════════════════════════════════ */
function toggleThink(block) {
  block.classList.toggle('open')
}

function scrollThread() {
  const t = document.getElementById('chat-thread')
  t.scrollTop = t.scrollHeight
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

// Handle hash-based auto-select from parent
const hash = location.hash.replace('#','')
if (hash && DEMOS[hash]) {
  currentDemo = hash
  const tabs = document.querySelectorAll('.demo-tab')
  const demoOrder = ['basic','think','artifact','full']
  const idx = demoOrder.indexOf(hash)
  if (idx >= 0) {
    tabs.forEach(t => t.classList.remove('active'))
    tabs[idx].classList.add('active')
  }
}

// Init
resetDemo()
</script>
</body>
</html>
