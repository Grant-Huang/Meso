<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流式会话</title>
  <style>
    :root {
      --color-bg:             #ecefe9;
      --color-bg-elevated:    #f4f6f2;
      --color-bg-white:       #ffffff;
      --color-text:           #2f3a32;
      --color-text-secondary: rgba(47,58,50,0.6);
      --color-text-muted:     rgba(47,58,50,0.4);
      --color-accent:         #527c5e;
      --color-accent-dark:    #2f7d4a;
      --color-border:         #d9dfd7;
      --color-border-light:   rgba(47,58,50,0.1);
      --color-error:          #c0392b;
      --color-success:        #2f7d4a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.6;
      background: var(--color-bg); color: var(--color-text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Controls bar ── */
    .ctrl-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--color-bg-elevated);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 6px;
      border: 1px solid var(--color-border); background: var(--color-bg-white);
      cursor: pointer; color: var(--color-text-secondary);
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: rgba(82,124,94,0.08); color: var(--color-text); }
    .icon-btn.primary { background: var(--color-accent); border-color: transparent; color: #fff; }
    .icon-btn.primary:hover { filter: brightness(0.92); }
    .speed-select {
      padding: 4px 6px; border-radius: 6px;
      border: 1px solid var(--color-border); font-size: 12px;
      font-family: inherit; color: var(--color-text); background: var(--color-bg-white);
    }
    .ctrl-status { font-size: 12px; color: var(--color-accent); margin-left: 4px; }
    .ctrl-sep { flex: 1; }

    /* ── Workspace ── */
    .workspace { flex: 1; display: flex; overflow: hidden; }

    /* ── Chat pane ── */
    .chat-pane { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .chat-thread { flex: 1; overflow-y: auto; padding: 24px 0; }
    .message-row { max-width: 820px; margin: 0 auto; padding: 0 24px 16px; }

    /* User bubble */
    .bubble-user { display: flex; justify-content: flex-end; }
    .bubble-user-content {
      max-width: 75%; background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: 14px 14px 4px 14px;
      padding: 10px 14px; font-size: 14px; line-height: 1.6;
    }

    /* AI reply */
    .bubble-ai { display: flex; flex-direction: column; gap: 8px; }

    /* Stage bar */
    .stage-bar {
      display: flex; flex-direction: column; gap: 2px;
      overflow: hidden; transition: max-height 0.4s ease, opacity 0.4s ease;
      max-height: 200px;
    }
    .stage-bar.collapsed { max-height: 0; opacity: 0; }
    .stage-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
    .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stage-dot.done   { background: var(--color-success); }
    .stage-dot.active { background: var(--color-accent); animation: pulse 0.8s ease-in-out infinite alternate; }
    .stage-dot.pending { background: transparent; border: 1.5px solid var(--color-border); }
    @keyframes pulse { from { opacity:1; transform:scale(1); } to { opacity:.4; transform:scale(.75); } }
    .stage-item.done   .stage-label { color: var(--color-text-muted); }
    .stage-item.active .stage-label { color: var(--color-accent-dark); font-weight: 600; }
    .stage-item.pending .stage-label { color: var(--color-text-muted); }

    /* Memory chips */
    .memory-chips {
      display: flex; flex-wrap: wrap; gap: 6px;
      overflow: hidden; transition: max-height 0.4s ease, opacity 0.4s ease; max-height: 80px;
    }
    .memory-chips.collapsed { max-height: 0; opacity: 0; }
    .memory-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; background: rgba(82,124,94,0.08);
      border: 1px solid rgba(82,124,94,0.2); border-radius: 20px;
      font-size: 11px; color: var(--color-accent-dark);
    }
    .memory-chip-cat { font-weight: 600; opacity: .7; }

    /* Think block */
    .think-block {
      background: rgba(82,124,94,0.05); border-left: 2px solid var(--color-border);
      border-radius: 0 6px 6px 0; overflow: hidden; transition: border-color 0.2s;
    }
    .think-block.done { border-left-color: var(--color-border-light); }
    .think-header {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; cursor: pointer; font-size: 12px;
      color: var(--color-text-secondary); user-select: none;
    }
    .think-header:hover { color: var(--color-text); }
    .think-chevron { font-size: 10px; transition: transform 0.25s ease; display: inline-block; }
    .think-block.open .think-chevron { transform: rotate(90deg); }
    .think-body {
      max-height: 300px; overflow: hidden; transition: max-height 0.3s ease;
      padding: 0 12px 10px; font-size: 13px; line-height: 1.65;
      color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word;
    }
    .think-block:not(.open) .think-body { max-height: 0; padding-bottom: 0; }

    /* AI text */
    .ai-content { font-size: 14px; line-height: 1.65; word-break: break-word; }
    .ai-content code {
      background: var(--color-bg-elevated); border: 1px solid var(--color-border-light);
      border-radius: 4px; padding: 1px 5px; font-size: 13px;
      font-family: "SF Mono","Fira Code",monospace; color: var(--color-accent-dark);
    }

    /* Cursor */
    .cursor {
      display: inline-block; width: 2px; height: 1em;
      background: var(--color-accent); margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 0.6s ease-in-out infinite alternate;
    }
    @keyframes blink { from { opacity:1; } to { opacity:.15; } }

    /* Action bar */
    .action-bar { display: flex; gap: 4px; opacity: 0; transition: opacity 0.25s ease; margin-top: 4px; }
    .action-bar.visible { opacity: 1; }
    .action-icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid var(--color-border); background: var(--color-bg-white);
      cursor: pointer; color: var(--color-text-muted);
      transition: background 0.12s, color 0.12s;
    }
    .action-icon-btn:hover { background: var(--color-bg-elevated); color: var(--color-text); }

    /* Splitter */
    .splitter { width: 4px; background: var(--color-border); cursor: col-resize; flex-shrink: 0; transition: background 0.15s; }
    .splitter:hover { background: #9cb8a8; }

    /* Artifact pane */
    .artifact-pane {
      background: var(--color-bg-elevated); border-left: 1px solid var(--color-border);
      display: flex; flex-direction: column; overflow: hidden;
      width: 0; transition: width 0.22s ease;
    }
    .artifact-pane.visible { width: 40%; }
    .artifact-tabs {
      display: flex; align-items: center; border-bottom: 1px solid var(--color-border);
      padding: 0 12px; background: var(--color-bg-white); min-height: 40px; flex-shrink: 0; gap: 2px;
    }
    .artifact-tab {
      padding: 6px 12px; font-size: 12px; cursor: pointer;
      color: var(--color-text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .artifact-tab.active { color: var(--color-accent-dark); border-bottom-color: var(--color-accent); font-weight: 600; }
    .artifact-body { flex: 1; overflow: auto; padding: 16px; }
    .artifact-code {
      font-family: "SF Mono","Fira Code",monospace; font-size: 13px;
      line-height: 1.6; color: var(--color-text); white-space: pre;
    }
    .artifact-footer {
      display: flex; gap: 6px; padding: 10px 14px;
      border-top: 1px solid var(--color-border-light); flex-shrink: 0;
    }

    /* Composer */
    .composer-wrap { padding: 10px 24px 18px; flex-shrink: 0; }
    .composer {
      max-width: 820px; margin: 0 auto;
      border: 1px solid var(--color-border); border-radius: 10px;
      background: var(--color-bg-white); overflow: hidden;
    }
    .composer textarea {
      width: 100%; border: none; padding: 10px 14px 6px;
      font-size: 15px; font-family: inherit; color: var(--color-text);
      resize: none; outline: none; background: transparent; min-height: 42px;
    }
    .composer-toolbar {
      display: flex; align-items: center; padding: 5px 10px;
      border-top: 1px solid var(--color-border-light); gap: 6px;
    }
    .composer-tool-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 6px;
      border: 1px solid var(--color-border); background: transparent;
      font-size: 12px; color: var(--color-text-secondary); cursor: pointer; font-family: inherit;
    }
    .composer-tool-btn:hover { background: var(--color-bg-elevated); }
    .composer-sep { flex: 1; }
    .send-icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      border: none; background: var(--color-accent); color: #fff; cursor: pointer;
      transition: filter 0.15s;
    }
    .send-icon-btn:hover { filter: brightness(0.9); }
  </style>
</head>
<body>

<!-- Controls -->
<div class="ctrl-bar">
  <button class="icon-btn primary" id="play-btn" onclick="playDemo()" title="播放">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 2l9 5-9 5V2z"/></svg>
  </button>
  <button class="icon-btn" onclick="resetDemo()" title="重置">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 7a5 5 0 105-5H4M4 2L2 4l2 2"/>
    </svg>
  </button>
  <select class="speed-select" id="speed-select">
    <option value="1">1×</option>
    <option value="2" selected>2×</option>
    <option value="4">4×</option>
  </select>
  <span class="ctrl-sep"></span>
  <span class="ctrl-status" id="status-text"></span>
</div>

<!-- Workspace -->
<div class="workspace">
  <div class="chat-pane" id="chat-pane">
    <div class="chat-thread" id="chat-thread"></div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea rows="2" id="composer-input" placeholder="向 Meso 发送消息…" readonly></textarea>
        <div class="composer-toolbar">
          <button class="composer-tool-btn">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><rect x="1" y="1" width="11" height="11" rx="1.5"/><line x1="1" y1="4" x2="12" y2="4"/><line x1="4" y1="1" x2="4" y2="12"/></svg>
            知识库
          </button>
          <button class="composer-tool-btn">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l4.5 4L11 4"/></svg>
            Tools
          </button>
          <div class="composer-sep"></div>
          <button class="send-icon-btn" title="发送">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2L7 9M14 2L9.5 14 7 9 2 6.5 14 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="splitter" id="splitter" style="display:none"></div>
  <div class="artifact-pane" id="artifact-pane">
    <div class="artifact-tabs" id="artifact-tabs"></div>
    <div class="artifact-body"><pre class="artifact-code" id="artifact-code"></pre></div>
    <div class="artifact-footer">
      <button class="action-icon-btn" title="复制">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="4.5" width="8" height="8" rx="1"/><path d="M9.5 4.5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v5.5a1 1 0 001 1h1.5"/>
        </svg>
      </button>
      <button class="action-icon-btn" title="下载">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 2v7M4.5 7L7 9.5 9.5 7M2 12h10"/>
        </svg>
      </button>
      <button class="action-icon-btn" title="存入记忆">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 2h9a1 1 0 011 1v10l-5.5-3L2.5 13V3a1 1 0 011-1z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ── Scenarios ── */
const DEMOS = {
  basic: {
    userMsg: '用 Python 写一个快速排序函数',
    events: [
      { type:'text', delta:'好的，下面是快速排序的 Python 实现：\n\n' },
      { type:'text', delta:'快速排序的核心思路是**分治**：选取一个基准元素，' },
      { type:'text', delta:'将数组分为小于基准和大于基准两部分，' },
      { type:'text', delta:'然后递归地对两部分分别排序。\n\n' },
      { type:'text', delta:'时间复杂度平均为 `O(n log n)`，最坏情况 `O(n²)`（已排序数组 + 固定基准）。' },
      { type:'done' },
    ]
  },
  think: {
    userMsg: '为什么说流式对话是 Meso 的灵魂？',
    events: [
      { type:'think', delta:'用户问的是平台设计理念层面的问题。\n', done:false },
      { type:'think', delta:'需要从用户体验和架构两个角度来回答。\n', done:false },
      { type:'think', delta:'用户体验上：流式消除等待感，进度可见，思考过程透明。\n', done:false },
      { type:'think', delta:'架构上：记忆、知识、Artifact 都是流式事件的输入或输出，不是独立模块。\n', done:false },
      { type:'think', delta:'所以流式不是"功能之一"，而是所有能力的传递介质。', done:true },
      { type:'text', delta:'从两个维度来看：\n\n' },
      { type:'text', delta:'**用户体验层面**：传统 AI 让用户等待完整结果，' },
      { type:'text', delta:'Meso 让用户从第一个字节开始就看到系统在做什么——' },
      { type:'text', delta:'阶段进度、推理过程、Artifact 生成，全程可见，等待感消失。\n\n' },
      { type:'text', delta:'**架构层面**：记忆召回是流的前置输入，' },
      { type:'text', delta:'Artifact 是流的解析输出，阶段进度是流的中间事件。' },
      { type:'text', delta:'流式对话是所有能力的传递介质，而不是功能之一。' },
      { type:'done' },
    ]
  },
  artifact: {
    userMsg: '用 Python 实现快速排序，给出完整函数',
    events: [
      { type:'text', delta:'以下是快速排序实现，已生成到右侧面板：\n\n' },
      { type:'artifact', id:'a1', lang:'Python', delta:'def quicksort(arr):\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'    if len(arr) <= 1:\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'        return arr\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'    pivot = arr[len(arr) // 2]\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'    left  = [x for x in arr if x < pivot]\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'    mid   = [x for x in arr if x == pivot]\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'    right = [x for x in arr if x > pivot]\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'    return quicksort(left) + mid + quicksort(right)\n\n', done:false },
      { type:'artifact', id:'a1', lang:'Python', delta:'# 示例\nnums = [3, 6, 8, 10, 1, 2, 1]\nprint(quicksort(nums))  # [1, 1, 2, 3, 6, 8, 10]\n', done:true },
      { type:'text', delta:'时间复杂度平均 `O(n log n)`，通过随机选基准可避免最坏情况。' },
      { type:'done' },
    ]
  },
  full: {
    userMsg: '帮我分析上次讨论的数据库优化方案，给出具体实施步骤',
    events: [
      { type:'stage', name:'召回记忆',  state:'active' },
      { type:'stage', name:'召回记忆',  state:'done' },
      { type:'memory', snippets:[
        { cat:'上次讨论', text:'2026-05 讨论了 orders 表慢查询优化' },
        { cat:'项目背景', text:'PostgreSQL 15，数据量约 300 万行' },
        { cat:'用户偏好', text:'偏好简洁方案，附代码示例' },
      ]},
      { type:'stage', name:'检索知识',  state:'active' },
      { type:'stage', name:'检索知识',  state:'done' },
      { type:'stage', name:'生成回复',  state:'active' },
      { type:'think', delta:'用户的 orders 表有 300 万行，慢查询在 user_id + 时间范围过滤。\n', done:false },
      { type:'think', delta:'上次讨论决定用复合索引，暂缓分区表。需要给出 SQL + 回滚方案。', done:true },
      { type:'text', delta:'根据上次讨论记录，整理了以下实施步骤：\n\n' },
      { type:'text', delta:'**第一步：创建复合索引**（预计 2-5 分钟，CONCURRENTLY 不锁表）\n\n' },
      { type:'artifact', id:'sql1', lang:'SQL', delta:'-- 使用 CONCURRENTLY 避免锁表\n', done:false },
      { type:'artifact', id:'sql1', lang:'SQL', delta:'CREATE INDEX CONCURRENTLY idx_orders_user_time\n', done:false },
      { type:'artifact', id:'sql1', lang:'SQL', delta:'  ON orders (user_id, created_at DESC)\n', done:false },
      { type:'artifact', id:'sql1', lang:'SQL', delta:'  WHERE status != \'deleted\';\n\n', done:false },
      { type:'artifact', id:'sql1', lang:'SQL', delta:'-- 验证索引命中\nEXPLAIN ANALYZE\n  SELECT * FROM orders\n  WHERE user_id = $1\n    AND created_at > NOW() - INTERVAL \'30 days\';\n', done:true },
      { type:'text', delta:'\n**第二步**：观察慢查询日志，确认索引命中率 > 95%。\n\n' },
      { type:'text', delta:'**回滚**：`DROP INDEX CONCURRENTLY idx_orders_user_time;`\n\n' },
      { type:'text', delta:'当前数据量 300 万行，暂不需要考虑分区表方案。' },
      { type:'stage', name:'生成回复', state:'done' },
      { type:'done' },
    ]
  }
}

/* ── State ── */
let currentDemo = 'basic'
let playing = false
let timer = null
let stageBar, memoryChips, thinkBlock, thinkBody, aiContentEl, actionBar, cursorEl
let stageItems = [], artifactTabs = {}
let textBuffer = ''

/* ── Hash-based demo selection ── */
const hash = location.hash.replace('#','')
if (hash && DEMOS[hash]) currentDemo = hash

/* ── Reset ── */
function resetDemo() {
  if (timer) clearTimeout(timer)
  playing = false
  setPlayIcon(false)
  document.getElementById('status-text').textContent = ''
  document.getElementById('chat-thread').innerHTML = ''
  document.getElementById('artifact-pane').classList.remove('visible')
  document.getElementById('splitter').style.display = 'none'
  document.getElementById('artifact-tabs').innerHTML = ''
  document.getElementById('artifact-code').textContent = ''
  artifactTabs = {}; stageItems = []; textBuffer = ''
  stageBar = memoryChips = thinkBlock = thinkBody = aiContentEl = actionBar = cursorEl = null
  document.getElementById('composer-input').value = DEMOS[currentDemo].userMsg
}

/* ── Play ── */
function playDemo() {
  if (playing) { resetDemo(); return; }
  resetDemo()
  playing = true; setPlayIcon(true)
  document.getElementById('status-text').textContent = '流式输出中…'
  document.getElementById('composer-input').value = ''
  appendUserBubble(DEMOS[currentDemo].userMsg)
  appendAIBubble()
  const events = DEMOS[currentDemo].events
  const speed = parseInt(document.getElementById('speed-select').value)
  let i = 0
  function next() {
    if (!playing || i >= events.length) { document.getElementById('status-text').textContent = ''; return; }
    const ev = events[i++]
    processEvent(ev)
    timer = setTimeout(next, getDelay(ev, speed))
  }
  timer = setTimeout(next, 400 / speed)
}

function setPlayIcon(isPlaying) {
  const btn = document.getElementById('play-btn')
  btn.innerHTML = isPlaying
    ? '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4" y1="2" x2="4" y2="12"/><line x1="10" y1="2" x2="10" y2="12"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 2l9 5-9 5V2z"/></svg>'
}

function getDelay(ev, speed) {
  if (ev.type==='text')     return Math.max(20, ev.delta.length * 28 / speed)
  if (ev.type==='think')    return Math.max(25, ev.delta.length * 22 / speed)
  if (ev.type==='artifact') return Math.max(20, ev.delta.length * 18 / speed)
  if (ev.type==='stage' && ev.state==='active') return 300 / speed
  if (ev.type==='stage' && ev.state==='done')   return 200 / speed
  if (ev.type==='memory')   return 100 / speed
  return 200 / speed
}

/* ── DOM builders ── */
function appendUserBubble(text) {
  const row = document.createElement('div')
  row.className = 'message-row'
  row.innerHTML = `<div class="bubble-user"><div class="bubble-user-content">${esc(text)}</div></div>`
  document.getElementById('chat-thread').appendChild(row)
  scrollThread()
}

function appendAIBubble() {
  const row = document.createElement('div'); row.className = 'message-row'
  stageBar     = el('div','stage-bar')
  memoryChips  = el('div','memory-chips')
  thinkBlock   = el('div','think-block'); thinkBlock.style.display='none'
  thinkBlock.innerHTML = `<div class="think-header" onclick="toggleThink(this.parentElement)"><span class="think-chevron">▶</span> <span class="think-title">思考中…</span></div><div class="think-body"></div>`
  thinkBody    = thinkBlock.querySelector('.think-body')
  aiContentEl  = el('div','ai-content')
  cursorEl     = el('span','cursor')
  aiContentEl.appendChild(cursorEl)
  actionBar    = el('div','action-bar')
  actionBar.innerHTML = `
    <button class="action-icon-btn" title="复制">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="8" height="8" rx="1"/><path d="M9.5 4.5V3a1 1 0 00-1-1H3a1 1 0 00-1 1v5.5a1 1 0 001 1h1.5"/></svg>
    </button>
    <button class="action-icon-btn" title="点赞">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5L8 6H3v6h7.5l1.5-5.5-1-1H9.5V1.5z"/><rect x="1" y="6" width="2" height="6" rx=".5"/></svg>
    </button>
    <button class="action-icon-btn" title="踩">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5L6 8h5V2H3.5L2 7.5l1 1H4.5v4z"/><rect x="11" y="2" width="2" height="6" rx=".5"/></svg>
    </button>`
  const bubble = el('div','bubble-ai')
  bubble.append(stageBar, memoryChips, thinkBlock, aiContentEl, actionBar)
  row.appendChild(bubble)
  document.getElementById('chat-thread').appendChild(row)
  scrollThread()
}

/* ── Event processors ── */
function processEvent(ev) {
  ({ stage:handleStage, memory:handleMemory, think:handleThink,
     text:handleText, artifact:handleArtifact, done:handleDone })[ev.type]?.(ev)
}
function handleStage(ev) {
  if (ev.state==='active') {
    const item = el('div','stage-item active'); item.dataset.name = ev.name
    item.innerHTML = `<span class="stage-dot active"></span><span class="stage-label">${esc(ev.name)}</span>`
    stageBar.appendChild(item); stageItems.push(item)
  } else {
    const item = stageItems.find(i=>i.dataset.name===ev.name)
    if (item) {
      item.className='stage-item done'
      item.querySelector('.stage-dot').className='stage-dot done'
      item.querySelector('.stage-label').insertAdjacentHTML('beforeend',' <span style="color:var(--color-success)">✓</span>')
    }
  }
  scrollThread()
}
function handleMemory(ev) {
  ev.snippets.forEach(s=>{
    const chip = el('div','memory-chip')
    chip.innerHTML=`<span class="memory-chip-cat">${esc(s.cat)}</span>${esc(s.text)}`
    memoryChips.appendChild(chip)
  })
  scrollThread()
}
function handleThink(ev) {
  if (thinkBlock.style.display==='none') { thinkBlock.style.display=''; thinkBlock.classList.add('open') }
  if (!ev.done) { thinkBody.textContent += ev.delta; scrollThread() }
  else setTimeout(()=>{ thinkBlock.querySelector('.think-title').textContent='已思考（点击展开）'; thinkBlock.classList.remove('open'); thinkBlock.classList.add('done') }, 400)
}
function handleText(ev) {
  textBuffer += ev.delta
  if (cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl)
  aiContentEl.innerHTML = md(textBuffer)
  aiContentEl.appendChild(cursorEl)
  scrollThread()
}
function handleArtifact(ev) {
  const pane = document.getElementById('artifact-pane')
  if (!pane.classList.contains('visible')) { pane.classList.add('visible'); document.getElementById('splitter').style.display='' }
  const tabsEl = document.getElementById('artifact-tabs')
  if (!artifactTabs[ev.id]) {
    const tab = el('div','artifact-tab active'); tab.textContent = ev.lang
    tabsEl.querySelectorAll('.artifact-tab').forEach(t=>t.classList.remove('active'))
    tabsEl.appendChild(tab); artifactTabs[ev.id]={tab,content:''}
    document.getElementById('artifact-code').textContent=''
  }
  if (!ev.done) { artifactTabs[ev.id].content+=ev.delta; document.getElementById('artifact-code').textContent=artifactTabs[ev.id].content }
}
function handleDone() {
  playing=false; setPlayIcon(false)
  if (cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl)
  actionBar.classList.add('visible')
  setTimeout(()=>{ stageBar.classList.add('collapsed'); memoryChips.classList.add('collapsed') }, 1500)
  document.getElementById('status-text').textContent='✓ 完成'
}

/* ── Helpers ── */
function toggleThink(block) { block.classList.toggle('open') }
function scrollThread() { const t=document.getElementById('chat-thread'); t.scrollTop=t.scrollHeight }
function el(tag,cls) { const e=document.createElement(tag); e.className=cls; return e }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function md(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')
}

resetDemo()
</script>
