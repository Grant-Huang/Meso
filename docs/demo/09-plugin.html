<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>应用插件 — Meso Design System</title>
  <script>
    (function(){var t=localStorage.getItem('meso-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="stylesheet" href="../platform/meso-tokens.css">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      font-size:14px; line-height:1.6;
      background:var(--color-bg); color:var(--color-text);
      height:100vh; overflow-y:auto;
    }

    .page { padding:32px; max-width:960px; margin:0 auto; }
    .page-title { font-size:15px; font-weight:650; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
    .page-subtitle { font-size:12px; color:var(--color-text-secondary); margin-bottom:28px; }

    .section-header { display:flex; align-items:center; gap:10px; margin:28px 0 14px; }
    .section-line { flex:1; height:1px; background:var(--color-border); }
    .section-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--color-text-muted); white-space:nowrap; }

    /* ── App cards ── */
    .app-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .app-card {
      background:var(--color-bg-white); border:2px solid var(--color-border);
      border-radius:12px; padding:20px;
      cursor:pointer; transition:border-color .2s, box-shadow .2s, background .15s;
      user-select:none;
    }
    .app-card:hover { border-color:rgba(61,107,82,0.40); }
    .app-card.selected {
      border-color:var(--color-accent);
      background:rgba(61,107,82,0.04);
      box-shadow:0 0 0 3px rgba(61,107,82,0.13);
    }
    .app-icon {
      width:44px; height:44px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      margin-bottom:12px;
    }
    .app-name { font-size:14px; font-weight:600; color:var(--color-text); margin-bottom:4px; }
    .app-desc { font-size:12px; color:var(--color-text-secondary); line-height:1.5; }
    .app-selected-badge {
      display:none; float:right; margin-left:8px;
      font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px;
      background:rgba(61,107,82,0.16); color:var(--color-accent);
    }
    .app-card.selected .app-selected-badge { display:inline; }

    /* ── JSON manifest ── */
    .json-box {
      background:var(--color-code-bg); border-radius:10px;
      padding:20px 24px; font-family:"SF Mono","Fira Code",monospace;
      font-size:12px; line-height:1.85; overflow-x:auto;
    }
    .j-brace   { color:#9cb8a8; }
    .j-key     { color:#527c5e; font-weight:600; }
    .j-str     { color:#cdd8ca; }
    .j-bool    { color:#2f7d4a; font-weight:600; }
    .j-num     { color:#b8c9b4; }
    .j-arr     { color:#9cb8a8; }
    .j-comment { color:#6a8872; font-style:italic; }
    .j-hl      { background:rgba(61,107,82,0.19); border-radius:3px; padding:1px 3px; }

    /* ── Composer toolbar variants ── */
    .toolbar-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .toolbar-variant {
      background:var(--color-bg-white); border:1px solid var(--color-border);
      border-radius:10px; overflow:hidden;
    }
    .tv-header {
      padding:8px 14px; border-bottom:1px solid var(--color-border);
      font-size:11px; font-weight:600; color:var(--color-text-secondary);
      background:var(--color-bg-elevated);
    }
    .tv-body { padding:10px 12px; }
    .tv-input-area {
      border:1.5px solid var(--color-border); border-radius:8px;
      padding:8px 10px; background:var(--color-bg-elevated);
      font-size:12px; color:var(--color-text-muted); margin-bottom:8px;
      min-height:40px;
    }
    .tv-toolbar { display:flex; align-items:center; gap:6px; padding-top:6px; border-top:1px solid var(--color-border-light); }
    .tv-spacer { flex:1; }
    .tv-btn {
      display:inline-flex; align-items:center; gap:5px;
      padding:4px 10px; border-radius:6px; border:none; cursor:default;
      font-size:11px; font-weight:500; font-family:inherit;
      background:rgba(61,107,82,0.10); color:var(--color-accent);
    }
    .tv-btn-ghost {
      background:none; border:none; padding:5px; border-radius:6px;
      cursor:default; color:var(--color-text-muted);
      display:flex; align-items:center;
    }
    .tv-send {
      background:var(--color-accent); color:#fff; border:none;
      padding:5px 12px; border-radius:6px; font-size:11px; font-weight:500;
      cursor:default; display:flex; align-items:center; gap:4px;
    }
    .app-selected-indicator {
      font-size:10px; color:var(--color-accent); font-weight:600;
      background:rgba(61,107,82,0.10); border-radius:4px; padding:2px 8px;
      margin-left:auto;
    }
    .doc-btn { position:fixed; top:10px; right:12px; text-decoration:none; font-size:16px; opacity:.5; z-index:100; transition:opacity .15s; line-height:1; }
    .doc-btn:hover { opacity:1; }
  </style>
</head>
<body>
<a class="doc-btn" href="../help.html#plugin" target="_blank" title="查看文档">📖</a>
<div class="page">

  <div class="page-title">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="var(--color-accent)" stroke-width="1.5"/>
      <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="var(--color-accent)" stroke-width="1.5" opacity=".6"/>
      <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="var(--color-accent)" stroke-width="1.5" opacity=".6"/>
      <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="var(--color-accent)" stroke-width="1.5" opacity=".4"/>

    应用插件

  <div class="page-subtitle">App Manifest · 应用卡片 · Composer 工具栏变体</div>

  <!-- 1. App cards -->
  <div class="section-header">

      <div class="app-icon" style="background:rgba(61,107,82,0.13);">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 5h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7l-4 3V6a1 1 0 0 1 1-1z" stroke="var(--color-accent)" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 9h8M7 12h5" stroke="var(--color-accent)" stroke-width="1.4" stroke-linecap="round"/></svg>

      </div>
      <div class="app-name">文档审查</div>
      <div class="app-desc">专注文档结构、合规性检查，绑定内部规范知识库，支持焦点模式。</div>
    </div>
    <!-- 代码助手 -->
    <div class="app-card" data-app="codeassist" data-index="2">
      <span class="app-selected-badge">当前</span>
      <div class="app-icon" style="background:rgba(61,107,82,0.09);">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M7 8l-4 3 4 3M15 8l4 3-4 3M13 6l-4 10" stroke="var(--color-accent-dark)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="app-name">代码助手</div>
      <div class="app-desc">代码审查、重构建议，绑定项目代码知识库及工具集，最小化工具栏。</div>
    </div>
  </div>

  <!-- 2. App Manifest -->
  <div id="manifest" class="section-header">
    <div class="section-line"></div>
    <span class="section-label">2 · App Manifest JSON</span>
    <div class="section-line"></div>
  </div>

  <div class="json-box" id="json-box">
    <!-- content rendered by JS -->
  </div>

  <!-- 3. Composer toolbar variants -->
  <div id="composer" class="section-header">
    <div class="section-line"></div>
    <span class="section-label">3 · Composer 工具栏变体</span>
    <div class="section-line"></div>
  </div>

  <div class="toolbar-grid">
    <!-- General -->
    <div class="toolbar-variant">
      <div class="tv-header">通用对话</div>
      <div class="tv-body">
        <div class="tv-input-area">向 Meso 发送消息…</div>
        <div class="tv-toolbar">
          <button class="tv-btn-ghost">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 10V12.5C3 13.33 3.67 14 4.5 14H9.5C10.33 14 11 13.33 11 12.5V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7 2v8M4.5 4.5L7 2l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="tv-btn">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="1" y="1" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 5h5M3 7h3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
            知识库
          </span>
          <span class="tv-btn">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M7 1.5a3.5 3.5 0 0 1-3.5 5L1 9.5 2.5 11l3-2.5A3.5 3.5 0 1 1 7 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            工具
            <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M2 3l2 2 2-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div class="tv-spacer"></div>
          <button class="tv-send">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M10 1L1 4.5l4 1.5 1.5 4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>

    <!-- Doc review -->
    <div class="toolbar-variant">
      <div class="tv-header">文档审查</div>
      <div class="tv-body">
        <div class="tv-input-area">上传文档或输入审查要求…</div>
        <div class="tv-toolbar">
          <button class="tv-btn-ghost">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 10V12.5C3 13.33 3.67 14 4.5 14H9.5C10.33 14 11 13.33 11 12.5V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7 2v8M4.5 4.5L7 2l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="tv-btn">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="1" y="1" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 5h5M3 7h3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
            知识库
          </span>
          <span class="tv-btn" style="background:rgba(47,125,74,.1);color:var(--color-success);">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><circle cx="5.5" cy="5.5" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 3.5v2l1.5 1" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
            焦点
            <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M2 3l2 2 2-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="tv-btn">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M7 1.5a3.5 3.5 0 0 1-3.5 5L1 9.5 2.5 11l3-2.5A3.5 3.5 0 1 1 7 1.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            工具
            <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M2 3l2 2 2-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div class="tv-spacer"></div>
          <button class="tv-send">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M10 1L1 4.5l4 1.5 1.5 4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>

    <!-- Code assist (minimal) -->
    <div class="toolbar-variant">
      <div class="tv-header">代码助手 (简洁)</div>
      <div class="tv-body">
        <div class="tv-input-area">粘贴代码或描述问题…</div>
        <div class="tv-toolbar">
          <button class="tv-btn-ghost">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 10V12.5C3 13.33 3.67 14 4.5 14H9.5C10.33 14 11 13.33 11 12.5V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7 2v8M4.5 4.5L7 2l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="tv-spacer"></div>
          <button class="tv-send" style="background:var(--color-accent-dark);">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M10 1L1 4.5l4 1.5 1.5 4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const MANIFESTS = {
    general: {
      id: "general",
      name: "通用对话",
      version: "1.0.0",
      description: "全能助手，支持聊天、分析、写作",
      skill: null,
      knowledge: [],
      tools: ["web_search", "calculator"],
      memory: { recall: true, write: true }
    },
    docreview: {
      id: "doc-review",
      name: "文档审查",
      version: "2.1.0",
      description: "文档结构与合规性检查，绑定内部规范库",
      skill: "document_review",
      knowledge: ["compliance_kb", "style_guide_kb"],
      tools: ["doc_parser", "diff_viewer", "export"],
      memory: { recall: true, write: false }
    },
    codeassist: {
      id: "code-assist",
      name: "代码助手",
      version: "1.3.0",
      description: "代码审查、重构建议与文档生成",
      skill: "code_review",
      knowledge: ["project_codebase"],
      tools: ["code_runner", "linter", "git_diff"],
      memory: { recall: true, write: true }
    }
  };

  function renderJSON(manifest) {
    const box = document.getElementById('json-box');
    const j = JSON.stringify(manifest, null, 2);
    // Manual colorize
    let html = j
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"(\w[\w-]*)"\s*:/g, (m, k) => {
        const hl = ['id','name','skill','knowledge','tools','memory'].includes(k)
          ? ' j-hl' : '';
        return `<span class="j-key${hl}">"${k}"</span>:`;
      })
      .replace(/:\s*"([^"]*)"/g, (m, v) => `: <span class="j-str">"${v}"</span>`)
      .replace(/:\s*(true|false)/g, (m, v) => `: <span class="j-bool">${v}</span>`)
      .replace(/:\s*([\d.]+)/g, (m, v) => `: <span class="j-num">${v}</span>`)
      .replace(/:\s*null/g, `: <span class="j-bool">null</span>`)
      .replace(/[\[\]]/g, m => `<span class="j-arr">${m}</span>`)
      .replace(/[{}]/g, m => `<span class="j-brace">${m}</span>`);
    box.innerHTML = html;
  }

  // App card selection
  document.getElementById('app-grid').addEventListener('click', e => {
    const card = e.target.closest('.app-card');
    if (!card) return;
    document.querySelectorAll('.app-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    const app = card.dataset.app;
    renderJSON(MANIFESTS[app]);
  });

  // Initial render
  renderJSON(MANIFESTS['general']);

  const _h = location.hash.slice(1);
  if (_h) { const _el = document.getElementById(_h); if (_el) setTimeout(() => _el.scrollIntoView({behavior:'smooth'}), 100); }
  window.addEventListener('hashchange', () => { const _h2 = location.hash.slice(1); const _el2 = document.getElementById(_h2); if (_el2) _el2.scrollIntoView({behavior:'smooth'}); });
</script>
</body>
</html>
