<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文档生成器</title>
  <script>
    (function(){var t=localStorage.getItem('meso-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="stylesheet" href="../platform/meso-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.6;
      background: var(--color-bg); color: var(--color-text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Controls bar ── */
    .ctrl-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--color-bg-elevated);
      border-bottom: 1px solid var(--color-border); flex-shrink: 0;
    }
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 6px;
      border: 1px solid var(--color-border); background: var(--color-bg-white);
      cursor: pointer; color: var(--color-text-secondary);
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: rgba(61,107,82,0.09); color: var(--color-text); }
    .icon-btn.primary { background: var(--color-accent); border-color: transparent; color: #fff; }
    .icon-btn.primary:hover { filter: brightness(0.92); }
    .ctrl-label { font-size: 12px; color: var(--color-text-secondary); }
    .ctrl-sep { flex: 1; }
    .preset-select {
      padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--color-border); font-size: 12px;
      font-family: inherit; color: var(--color-text); background: var(--color-bg-white);
      cursor: pointer;
    }
    .step-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--color-text-muted);
      padding: 3px 8px; border-radius: 20px;
      background: var(--color-bg-elevated); border: 1px solid var(--color-border);
    }
    .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--color-border);
      transition: background 0.3s;
    }
    .step-dot.active { background: var(--color-accent); animation: pulse 0.8s ease-in-out infinite alternate; }
    .step-dot.done { background: var(--color-success, #22c55e); animation: none; }

    /* ── Workspace ── */
    .workspace { flex: 1; display: flex; overflow: hidden; }

    /* ── Left: chat pane ── */
    .chat-pane {
      display: flex; flex-direction: column;
      width: 420px; min-width: 320px; max-width: 520px;
      border-right: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .chat-thread { flex: 1; overflow-y: auto; padding: 20px 0; }
    .message-row { max-width: 100%; padding: 0 16px 14px; }

    /* User bubble */
    .bubble-user { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .bubble-user-content {
      max-width: 80%; background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: 14px 14px 4px 14px;
      padding: 9px 13px; font-size: 14px; line-height: 1.6;
    }

    /* AI reply container */
    .bubble-ai { display: flex; flex-direction: column; gap: 8px; }

    /* Stage bar */
    .stage-bar { display: flex; flex-direction: column; gap: 2px; }
    .stage-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 2px 0; }
    .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stage-dot.done    { background: var(--color-success, #22c55e); }
    .stage-dot.active  { background: var(--color-accent); animation: pulse 0.8s ease-in-out infinite alternate; }
    .stage-dot.pending { background: transparent; border: 1.5px solid var(--color-border); }
    @keyframes pulse { from { opacity:1; transform:scale(1); } to { opacity:.4; transform:scale(.75); } }
    .stage-item.done   .stage-label { color: var(--color-text-muted); }
    .stage-item.active .stage-label { color: var(--color-accent-dark, #3d6b52); font-weight: 600; }
    .stage-item.pending .stage-label { color: var(--color-text-muted); }

    /* Think block */
    .think-block {
      background: var(--color-bg-elevated); border-radius: 8px;
      border: 1px solid var(--color-border); overflow: hidden;
    }
    .think-header {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; cursor: pointer; font-size: 12px;
      color: var(--color-text-secondary); user-select: none;
    }
    .think-header:hover { color: var(--color-text); }
    .think-chevron { transition: transform 0.2s; font-size: 10px; color: var(--color-text-muted); }
    .think-block.collapsed .think-chevron { transform: rotate(-90deg); }
    .think-body {
      padding: 0 12px 10px;
      font-size: 12px; color: var(--color-text-secondary);
      line-height: 1.7; font-style: italic;
      white-space: pre-wrap;
      border-top: 1px solid var(--color-border-light, var(--color-border));
      max-height: 200px; overflow-y: auto;
    }
    .think-block.collapsed .think-body { display: none; }

    /* Artifact card */
    .artifact-card {
      border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden;
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .artifact-card.visible { opacity: 1; transform: none; }
    .artifact-header {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; background: var(--color-bg-elevated);
      border-bottom: 1px solid var(--color-border);
      font-size: 12px; color: var(--color-text-secondary);
    }
    .artifact-lang {
      font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: var(--badge-bg, rgba(82,124,94,0.1)); color: var(--color-accent);
      font-weight: 600; font-family: monospace; text-transform: uppercase;
    }
    .artifact-body {
      font-family: "SF Mono", "Fira Code", monospace; font-size: 12px;
      line-height: 1.6; padding: 12px 14px;
      background: var(--color-bg); color: var(--color-text);
      overflow-x: auto; max-height: 200px; overflow-y: auto;
      white-space: pre;
    }

    /* Text output */
    .text-content {
      font-size: 14px; color: var(--color-text);
      line-height: 1.7; padding: 2px 0;
    }

    /* Cursor */
    .cursor {
      display: inline-block; width: 2px; height: 1em;
      background: var(--color-accent); margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 0.8s steps(2) infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Right: preview pane ── */
    .preview-pane {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .preview-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--color-bg-elevated);
      border-bottom: 1px solid var(--color-border);
      font-size: 12px; color: var(--color-text-secondary); flex-shrink: 0;
    }
    .preview-header-title { font-weight: 600; color: var(--color-text); }
    .preview-placeholder {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--color-text-muted); gap: 10px; padding: 40px;
      text-align: center;
    }
    .preview-placeholder svg { opacity: 0.3; }
    .preview-frame { flex: 1; border: none; background: #fff; display: none; }

    /* Download button */
    .dl-btn {
      margin-left: auto; padding: 4px 10px; border-radius: 5px;
      border: 1px solid var(--color-border); background: var(--color-bg-white);
      font-size: 12px; color: var(--color-text-secondary);
      cursor: pointer; display: none;
      transition: background 0.12s, color 0.12s;
    }
    .dl-btn:hover { background: rgba(61,107,82,0.09); color: var(--color-accent); }
    .dl-btn.visible { display: flex; align-items: center; gap: 5px; }

    /* Composer */
    .composer {
      padding: 10px 12px; border-top: 1px solid var(--color-border);
      background: var(--color-bg); flex-shrink: 0;
      display: flex; gap: 8px; align-items: flex-end;
    }
    .composer-input {
      flex: 1; resize: none; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--color-border);
      background: var(--color-bg-white); font-family: inherit;
      font-size: 13px; line-height: 1.5; color: var(--color-text);
      outline: none; min-height: 38px; max-height: 100px;
      transition: border-color 0.15s;
    }
    .composer-input:focus { border-color: var(--color-accent); }
    .send-btn {
      flex-shrink: 0; width: 36px; height: 36px;
      border-radius: 8px; border: none;
      background: var(--color-accent); color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: filter 0.12s;
    }
    .send-btn:hover { filter: brightness(0.9); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  </style>
</head>

// ── Renderer (client-side Jinja2 interpreter — simplified) ───────────────────

  let out = template
  // {% for item in list %} ... {% endfor %}
  out = out.replace(/\{%[-\s]*for\s+(\w+)\s+in\s+([\w.]+)\s*[-\s]*%\}([\s\S]*?)\{%[-\s]*endfor\s*[-\s]*%\}/g,
    (_, varName, listPath, body) => {
      const list = resolvePath(data, listPath) || []
      return list.map(item => {
        const ctx = { ...data, [varName]: item }
        return renderTemplate(body, ctx)
      }).join('')
    })
  // {% if expr %} ... {% endif %} (simple truthy check)
  out = out.replace(/\{%[-\s]*if\s+([\w.]+)\s*[-\s]*%\}([\s\S]*?)\{%[-\s]*endif\s*[-\s]*%\}/g,
    (_, expr, body) => resolvePath(data, expr) ? renderTemplate(body, data) : '')
  // {{ var }}
  out = out.replace(/\{\{[-\s]*([\w.]+)\s*[-\s]*\}\}/g,
    (_, path) => { const v = resolvePath(data, path); return v !== undefined ? String(v) : '' })
  return out
}

function resolvePath(obj, path) {
  return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), obj)
}

function buildHtml(content) {
  const body = renderTemplate(MOCK_TEMPLATE, content)
  return `<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<style>
:root{--color-text:#1a1a1a;--color-text-secondary:#4b5563;--color-text-muted:#9ca3af;--color-bg:#fff;--color-border:#e5e7eb;--color-accent:#527c5e;--color-accent-dark:#3d6b52;--color-accent-light:#f0f4f1;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.7;color:var(--color-text);background:#fff;padding:36px 44px;max-width:860px;margin:0 auto;}
.doc-header{border-bottom:2px solid var(--color-accent);padding-bottom:18px;margin-bottom:24px;}
.doc-title{font-size:24px;font-weight:700;color:var(--color-accent-dark);margin-bottom:5px;line-height:1.3;}
.doc-subtitle{font-size:14px;color:var(--color-text-secondary);margin-bottom:9px;}
.doc-meta{display:flex;gap:18px;font-size:12px;color:var(--color-text-muted);}
.doc-summary{background:var(--color-accent-light);border-left:3px solid var(--color-accent);padding:12px 16px;border-radius:0 6px 6px 0;margin-bottom:28px;font-size:13px;color:var(--color-text-secondary);}
.section{margin-bottom:28px;}
.section-heading{font-size:15px;font-weight:650;color:var(--color-text);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--color-border);}
.section-content{font-size:13px;color:var(--color-text-secondary);margin-bottom:10px;}
.metrics-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.metric-card{flex:1;min-width:120px;background:#f9fafb;border:1px solid var(--color-border);border-radius:8px;padding:12px 14px;border-top:2px solid var(--color-border);}
.metric-card.up{border-top-color:#22c55e;}.metric-card.down{border-top-color:#ef4444;}
.metric-name{font-size:11px;color:var(--color-text-muted);margin-bottom:5px;}
.metric-value{font-size:20px;font-weight:700;color:var(--color-text);}
.metric-card.up .metric-value{color:#16a34a;}.metric-card.down .metric-value{color:#dc2626;}
ul.item-list{padding-left:16px;margin-top:8px;}
ul.item-list li{margin-bottom:5px;color:var(--color-text-secondary);font-size:13px;}
table.kv-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
table.kv-table td{padding:8px 11px;border:1px solid var(--color-border);}
table.kv-table td:first-child{font-weight:600;width:30%;background:#f9fafb;color:var(--color-text);}
table.kv-table td:last-child{color:var(--color-text-secondary);}
.subsection{margin-top:16px;}
.subsection .section-heading{font-size:13px;font-weight:600;color:var(--color-text-secondary);}
.doc-footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--color-border);font-size:11px;color:var(--color-text-muted);text-align:center;}
</style></head><body>${body}</body></html>`
}

// ── State ─────────────────────────────────────────────────────────────────────

let running = false
let finalHtml = ''
let currentPreset = 'report'

function applyPreset(key) {
  currentPreset = key
  const p = PRESETS[key]
  if (p) document.getElementById('composer-input').value = p.input
}

// ── DOM helpers ───────────────────────────────────────────────────────────────

function thread() { return document.getElementById('chat-thread') }

function appendUserBubble(text) {
  const row = document.createElement('div')
  row.className = 'message-row'
  row.innerHTML = `<div class="bubble-user"><div class="bubble-user-content">${esc(text)}</div></div>`
  thread().appendChild(row)
  scrollBottom()
}

function createAiRow() {
  const row = document.createElement('div')
  row.className = 'message-row'
  const inner = document.createElement('div')
  inner.className = 'bubble-ai'
  row.appendChild(inner)
  thread().appendChild(row)
  return inner
}

function appendStages(container, stages) {
  const bar = document.createElement('div')
  bar.className = 'stage-bar'
  stages.forEach(s => {
    const item = document.createElement('div')
    item.className = `stage-item ${s.state}`
    item.id = `stage-${s.name}`
    item.innerHTML = `<div class="stage-dot ${s.state}"></div><span class="stage-label">${s.name}</span>`
    bar.appendChild(item)
  })
  container.appendChild(bar)
  return bar
}

function setStageState(name, state) {
  const el = document.getElementById(`stage-${name}`)
  if (!el) return
  el.className = `stage-item ${state}`
  const dot = el.querySelector('.stage-dot')
  if (dot) dot.className = `stage-dot ${state}`
}

function appendThink(container, text) {
  const block = document.createElement('div')
  block.className = 'think-block'
  block.innerHTML = `
    <div class="think-header" onclick="this.parentElement.classList.toggle('collapsed')">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M1 9a5 5 0 1 0 0-6M1 3v3h3"/>
      </svg>
      <span>推理过程</span>
      <span class="think-chevron">▾</span>
    </div>
    <div class="think-body">${esc(text)}</div>`
  container.appendChild(block)
  scrollBottom()
  return block
}

function appendArtifact(container, lang, content, label) {
  const card = document.createElement('div')
  card.className = 'artifact-card'
  card.innerHTML = `
    <div class="artifact-header">
      <span class="artifact-lang">${lang}</span>
      <span>${label}</span>
    </div>
    <div class="artifact-body">${esc(content)}</div>`
  container.appendChild(card)
  scrollBottom()
  requestAnimationFrame(() => card.classList.add('visible'))
  return card
}

function appendText(container, text) {
  const div = document.createElement('div')
  div.className = 'text-content'
  div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
  container.appendChild(div)
  scrollBottom()
}

function scrollBottom() {
  const t = thread()
  t.scrollTop = t.scrollHeight
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function setStepDot(n, state) {
  const dot = document.getElementById(`dot-${n}`)
  if (!dot) return
  dot.className = `step-dot ${state}`
}

// ── Demo runner ───────────────────────────────────────────────────────────────

async function runDemo() {
  if (running) return
  running = true
  finalHtml = ''

  const input = document.getElementById('composer-input').value.trim()
  if (!input) { running = false; return }

  document.getElementById('send-btn').disabled = true
  document.getElementById('run-btn').disabled = true
  document.getElementById('dl-btn').classList.remove('visible')
  document.getElementById('preview-frame').style.display = 'none'
  document.getElementById('preview-placeholder').style.display = 'flex'

  setStepDot(1, '')
  setStepDot(2, '')
  setStepDot(3, '')

  // User message
  appendUserBubble(input)

  const preset = PRESETS[currentPreset] || PRESETS.report
  const content = preset.content
  const ai = createAiRow()

  await delay(300)

  // ── Stage 1: Analyze ──────────────────────────────────────────────────────
  setStepDot(1, 'active')
  appendStages(ai, [
    { name: '分析需求', state: 'active' },
    { name: '生成模板', state: 'pending' },
    { name: '渲染文档', state: 'pending' },
  ])
  await delay(200)

  const think1Text = `正在理解文档需求，提取关键信息并映射到结构化 Schema…\n识别到文档类型：${content.doc_type}，包含 ${content.sections.length} 个章节：${content.sections.map(s => s.heading).join('、')}。`
  const thinkBlock = appendThink(ai, think1Text)

  await delay(1200)

  setStageState('分析需求', 'done')
  setStepDot(1, 'done')
  thinkBlock.classList.add('collapsed')

  // JSON artifact
  const jsonStr = JSON.stringify(content, null, 2)
  appendArtifact(ai, 'json', jsonStr.slice(0, 800) + (jsonStr.length > 800 ? '\n  …' : ''), '结构化内容')
  await delay(400)

  // ── Stage 2: Generate template ────────────────────────────────────────────
  setStageState('生成模板', 'active')
  setStepDot(2, 'active')
  await delay(200)

  const think2Text = '根据 JSON Schema 结构生成 Jinja2 渲染模板…\nJinja2 模板生成完成。'
  appendThink(ai, think2Text).classList.add('collapsed')

  await delay(1000)

  setStageState('生成模板', 'done')
  setStepDot(2, 'done')

  const tplPreview = MOCK_TEMPLATE.slice(0, 500) + '\n  …（更多模板内容）'
  appendArtifact(ai, 'jinja2', tplPreview, 'Jinja2 渲染模板')
  await delay(400)

  // ── Stage 3: Render ───────────────────────────────────────────────────────
  setStageState('渲染文档', 'active')
  setStepDot(3, 'active')
  await delay(600)

  finalHtml = buildHtml(content)
  setStageState('渲染文档', 'done')
  setStepDot(3, 'done')

  // Show preview
  const frame = document.getElementById('preview-frame')
  const placeholder = document.getElementById('preview-placeholder')
  frame.srcdoc = finalHtml
  frame.style.display = 'block'
  placeholder.style.display = 'none'
  document.getElementById('dl-btn').classList.add('visible')

  // Final text
  await delay(200)
  appendText(ai, `文档《**${content.title}**》已生成完成，共 ${content.sections.length} 个章节。`)
  scrollBottom()

  document.getElementById('send-btn').disabled = false
  document.getElementById('run-btn').disabled = false
  running = false
}

function resetDemo() {
  if (running) return
  document.getElementById('chat-thread').innerHTML = ''
  document.getElementById('preview-frame').style.display = 'none'
  document.getElementById('preview-placeholder').style.display = 'flex'
  document.getElementById('dl-btn').classList.remove('visible')
  finalHtml = ''
  setStepDot(1, '')
  setStepDot(2, '')
  setStepDot(3, '')
}

function downloadDoc() {
  if (!finalHtml) return
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([finalHtml], { type: 'text/html' }))
  a.download = 'document.html'
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 60000)
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)) }
</script>
</body>
</html>
