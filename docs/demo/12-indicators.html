<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>身份指示器 — Meso Design System</title>
  <script>
    (function(){var t=localStorage.getItem('meso-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="stylesheet" href="../platform/meso-tokens.css">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      font-size:14px; line-height:1.6;
      background:var(--color-bg); color:var(--color-text);
      height:100vh; overflow-y:auto;
    }
    .page { padding:32px; max-width:760px; margin:0 auto; }
    .page-title { font-size:15px; font-weight:650; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
    .page-subtitle { font-size:12px; color:var(--color-text-secondary); margin-bottom:28px; }
    .section-header { display:flex; align-items:center; gap:10px; margin:24px 0 16px; }
    .section-line { flex:1; height:1px; background:var(--color-border); }
    .section-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--color-text-muted); white-space:nowrap; }
    .demo-card {
      background:var(--color-bg-white); border:1px solid var(--color-border);
      border-radius:10px; padding:24px; margin-bottom:16px;
    }
    .doc-btn { position:fixed; top:10px; right:12px; text-decoration:none; font-size:16px; opacity:.5; z-index:100; transition:opacity .15s; line-height:1; }
    .doc-btn:hover { opacity:1; }

    /* SoulIndicator chips */
    .soul-chips { display:flex; flex-direction:column; gap:12px; }

    .soul-chip {
      display:inline-flex; align-items:center; gap:10px;
      padding:8px 14px 8px 8px;
      border-radius:24px; border:1px solid var(--color-border);
      background:var(--color-bg-elevated);
      width:fit-content; max-width:100%;
    }

    .soul-avatar {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:13px; font-weight:700; color:#fff;
    }
    .soul-avatar.aria { background:linear-gradient(135deg,#3d6b52,#2d5a40); }
    .soul-avatar.dev  { background:linear-gradient(135deg,#2563a8,#1a4a80); }
    .soul-avatar.gen  { background:linear-gradient(135deg,#6b48a0,#4a3070); }

    .soul-info { display:flex; flex-direction:column; gap:3px; }
    .soul-name-row { display:flex; align-items:center; gap:6px; }
    .soul-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--color-text-muted); }
    .soul-name  { font-size:13px; font-weight:600; color:var(--color-text); }

    .soul-traits { display:flex; gap:5px; flex-wrap:wrap; }
    .soul-trait {
      display:inline-flex; padding:1px 8px; border-radius:10px;
      font-size:11px; font-weight:500;
      background:rgba(61,107,82,.1); color:var(--color-accent-dark);
      border:1px solid rgba(61,107,82,.15);
    }
    .soul-chip.dev-chip .soul-trait {
      background:rgba(37,99,168,.1); color:#1d4ed8;
      border-color:rgba(37,99,168,.15);
    }
    .soul-chip.gen-chip .soul-trait {
      background:rgba(107,72,160,.1); color:#5b21b6;
      border-color:rgba(107,72,160,.15);
    }
    .soul-no-traits { font-size:11px; color:var(--color-text-muted); font-style:italic; }

    /* SkillIndicator badges */
    .skill-badges { display:flex; flex-direction:column; gap:10px; }

    .skill-badge {
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 13px; border-radius:8px; width:fit-content;
      border:1px solid var(--color-border);
    }
    .skill-badge.completeness { background:rgba(22,101,52,.06); border-color:rgba(22,101,52,.2); }
    .skill-badge.security     { background:rgba(153,27,27,.05); border-color:rgba(153,27,27,.2); }
    .skill-badge.performance  { background:rgba(146,64,14,.05); border-color:rgba(146,64,14,.2); }

    .skill-icon {
      width:24px; height:24px; border-radius:6px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
    }
    .skill-badge.completeness .skill-icon { background:rgba(22,101,52,.12); }
    .skill-badge.security     .skill-icon { background:rgba(153,27,27,.10); }
    .skill-badge.performance  .skill-icon { background:rgba(146,64,14,.10); }

    .skill-info { display:flex; flex-direction:column; gap:1px; }
    .skill-name { font-size:12px; font-weight:600; }
    .skill-badge.completeness .skill-name { color:#166534; }
    .skill-badge.security     .skill-name { color:#991b1b; }
    .skill-badge.performance  .skill-name { color:#92400e; }

    .skill-focus-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--color-text-muted); }
    .skill-focus-value { font-size:11px; color:var(--color-text-secondary); }

    /* Active indicator dot */
    .skill-active-dot {
      width:7px; height:7px; border-radius:50%; flex-shrink:0;
      animation:sk-pulse 1.6s ease-in-out infinite;
    }
    .skill-badge.completeness .skill-active-dot { background:#16a34a; }
    .skill-badge.security     .skill-active-dot { background:#dc2626; }
    .skill-badge.performance  .skill-active-dot { background:#d97706; }

    @keyframes sk-pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.75); }
    }

    /* Combination section */
    .combo-row {
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      padding:14px 16px; border-radius:8px;
      background:var(--color-bg-elevated); border:1px solid var(--color-border);
      margin-bottom:12px;
    }
    .combo-row:last-child { margin-bottom:0; }
    .combo-sep {
      width:1px; height:36px; background:var(--color-border); flex-shrink:0;
    }
    .combo-label {
      font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
      color:var(--color-text-muted); white-space:nowrap;
    }
    .combo-streaming-badge {
      display:inline-flex; align-items:center; gap:5px;
      padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;
      background:rgba(37,99,168,.1); color:#1d4ed8; border:1px solid rgba(37,99,168,.18);
      margin-left:auto;
    }

    /* Inline soul chip (compact for combination row) */
    .soul-chip-sm {
      display:inline-flex; align-items:center; gap:7px;
      padding:5px 11px 5px 5px;
      border-radius:20px; border:1px solid rgba(61,107,82,.2);
      background:rgba(61,107,82,.06); width:fit-content;
    }
    .soul-avatar-sm {
      width:24px; height:24px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; color:#fff;
    }
    .soul-avatar-sm.aria { background:linear-gradient(135deg,#3d6b52,#2d5a40); }
    .soul-avatar-sm.dev  { background:linear-gradient(135deg,#2563a8,#1a4a80); }
    .soul-name-sm { font-size:12px; font-weight:600; color:var(--color-accent-dark); }

    .skill-badge-sm {
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 10px; border-radius:7px;
    }
    .skill-badge-sm.security {
      background:rgba(153,27,27,.07); border:1px solid rgba(153,27,27,.18);
    }
    .skill-badge-sm.completeness {
      background:rgba(22,101,52,.07); border:1px solid rgba(22,101,52,.18);
    }
    .skill-active-dot-sm {
      width:6px; height:6px; border-radius:50%;
      animation:sk-pulse 1.6s ease-in-out infinite;
    }
    .skill-badge-sm.security .skill-active-dot-sm { background:#dc2626; }
    .skill-badge-sm.completeness .skill-active-dot-sm { background:#16a34a; }
    .skill-name-sm { font-size:12px; font-weight:600; }
    .skill-badge-sm.security .skill-name-sm { color:#991b1b; }
    .skill-badge-sm.completeness .skill-name-sm { color:#166534; }
  </style>
</head>
<body>
<a class="doc-btn" href="../help.html#components" target="_blank" title="查看文档">📖</a>
<div class="page">

  <div class="page-title">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="6" cy="5" r="3" stroke="var(--color-accent)" stroke-width="1.4" fill="none" opacity=".7"/>
      <path d="M1 14c0-2.8 2.2-5 5-5" stroke="var(--color-accent)" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
      <rect x="10" y="7" width="5" height="5" rx="1.5" fill="var(--color-accent)" opacity=".85"/>
      <path d="M11 9.5h3M11 11h2" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
    </svg>
    身份指示器
  </div>
  <div class="page-subtitle">SoulIndicator · SkillIndicator · 角色特征 · 技能标签</div>

  <!-- Section 1: SoulIndicator -->
  <div id="soul" class="section-header">
    <div class="section-label">Soul 指示器</div>
    <div class="section-line"></div>
  </div>

  <div class="demo-card">
    <div class="soul-chips">

      <!-- Aria -->
      <div class="soul-chip">
        <div class="soul-avatar aria">A</div>
        <div class="soul-info">
          <div class="soul-name-row">
            <span class="soul-label">Soul</span>
            <span class="soul-name">文档专家 · Aria</span>
          </div>
          <div class="soul-traits">
            <span class="soul-trait">严谨</span>
            <span class="soul-trait">细致</span>
            <span class="soul-trait">客观</span>
          </div>
        </div>
      </div>

      <!-- Dev -->
      <div class="soul-chip dev-chip">
        <div class="soul-avatar dev">D</div>
        <div class="soul-info">
          <div class="soul-name-row">
            <span class="soul-label">Soul</span>
            <span class="soul-name">代码助手 · Dev</span>
          </div>
          <div class="soul-traits">
            <span class="soul-trait">精准</span>
            <span class="soul-trait">高效</span>
          </div>
        </div>
      </div>

      <!-- General -->
      <div class="soul-chip gen-chip">
        <div class="soul-avatar gen">G</div>
        <div class="soul-info">
          <div class="soul-name-row">
            <span class="soul-label">Soul</span>
            <span class="soul-name">通用助手</span>
          </div>
          <div class="soul-traits">
            <span class="soul-no-traits">无特征标签</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Section 2: SkillIndicator -->
  <div id="skill" class="section-header">
    <div class="section-label">Skill 指示器</div>
    <div class="section-line"></div>
  </div>

  <div class="demo-card">
    <div class="skill-badges">

      <!-- completeness -->
      <div class="skill-badge completeness">
        <div class="skill-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3 3 7-7" stroke="#166534" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="skill-info">
          <span class="skill-name">完整性检查</span>
          <span class="skill-focus-value">
            <span class="skill-focus-label">专注: </span>completeness
          </span>
        </div>
        <div class="skill-active-dot"></div>
      </div>

      <!-- security -->
      <div class="skill-badge security">
        <div class="skill-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5l4.5 2v4c0 2.5-2 4.5-4.5 5.5C4.5 12 2.5 10 2.5 7.5v-4L7 1.5z" stroke="#991b1b" stroke-width="1.3" fill="none"/><path d="M5 7l1.5 1.5 3-3" stroke="#991b1b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="skill-info">
          <span class="skill-name">安全审查</span>
          <span class="skill-focus-value">
            <span class="skill-focus-label">专注: </span>security
          </span>
        </div>
        <div class="skill-active-dot"></div>
      </div>

      <!-- performance -->
      <div class="skill-badge performance">
        <div class="skill-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 10l3-5 3 3 2-4 2 2" stroke="#92400e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="11" cy="4" r="1.5" fill="#d97706"/></svg>
        </div>
        <div class="skill-info">
          <span class="skill-name">性能分析</span>
          <span class="skill-focus-value">
            <span class="skill-focus-label">专注: </span>performance
          </span>
        </div>
        <div class="skill-active-dot"></div>
      </div>

    </div>
  </div>

  <!-- Section 3: Combination -->
  <div id="combo" class="section-header">
    <div class="section-label">组合展示</div>
    <div class="section-line"></div>
  </div>

  <div class="demo-card">

    <!-- Row 1: Aria + 安全审查 -->
    <div class="combo-row">
      <span class="combo-label">会话上下文</span>
      <div class="combo-sep"></div>
      <div class="soul-chip-sm">
        <div class="soul-avatar-sm aria">A</div>
        <span class="soul-name-sm">Aria</span>
      </div>
      <span style="font-size:11px;color:var(--color-text-muted);">+</span>
      <div class="skill-badge-sm security">
        <div class="skill-active-dot-sm"></div>
        <span class="skill-name-sm">安全审查</span>
      </div>
      <span class="combo-streaming-badge">
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none" style="animation:sk-pulse 1.6s ease-in-out infinite;"><circle cx="4.5" cy="4.5" r="3.5" fill="#1d4ed8"/></svg>
        流式输出中
      </span>
    </div>

    <!-- Row 2: Dev + 完整性检查 -->
    <div class="combo-row">
      <span class="combo-label">会话上下文</span>
      <div class="combo-sep"></div>
      <div class="soul-chip-sm" style="border-color:rgba(37,99,168,.2);background:rgba(37,99,168,.06);">
        <div class="soul-avatar-sm dev">D</div>
        <span class="soul-name-sm" style="color:#1d4ed8;">Dev</span>
      </div>
      <span style="font-size:11px;color:var(--color-text-muted);">+</span>
      <div class="skill-badge-sm completeness">
        <div class="skill-active-dot-sm"></div>
        <span class="skill-name-sm">完整性检查</span>
      </div>
      <span class="combo-streaming-badge" style="background:rgba(22,101,52,.08);border-color:rgba(22,101,52,.18);color:#166534;">
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none" style="animation:sk-pulse 1.6s ease-in-out infinite;"><circle cx="4.5" cy="4.5" r="3.5" fill="#16a34a"/></svg>
        流式输出中
      </span>
    </div>

    <!-- Row 3: General soul, no skill -->
    <div class="combo-row">
      <span class="combo-label">会话上下文</span>
      <div class="combo-sep"></div>
      <div class="soul-chip-sm" style="border-color:rgba(107,72,160,.2);background:rgba(107,72,160,.06);">
        <div class="soul-avatar-sm gen">G</div>
        <span class="soul-name-sm" style="color:#5b21b6;">通用助手</span>
      </div>
      <span style="font-size:11px;color:var(--color-text-muted);">·</span>
      <span style="font-size:12px;color:var(--color-text-muted);font-style:italic;">无激活技能</span>
      <span class="combo-streaming-badge" style="background:rgba(107,72,160,.08);border-color:rgba(107,72,160,.18);color:#5b21b6;">
        <svg width="9" height="9" viewBox="0 0 9 9" fill="none" style="animation:sk-pulse 1.6s ease-in-out infinite;"><circle cx="4.5" cy="4.5" r="3.5" fill="#7c3aed"/></svg>
        流式输出中
      </span>
    </div>

  </div>

</div>
<script>
  const _h = location.hash.slice(1);
  if (_h) { const _el = document.getElementById(_h); if (_el) setTimeout(() => _el.scrollIntoView({behavior:'smooth'}), 100); }
  window.addEventListener('hashchange', () => { const _h2 = location.hash.slice(1); const _el2 = document.getElementById(_h2); if (_el2) _el2.scrollIntoView({behavior:'smooth'}); });
</script>
</body>
</html>
