<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    (function(){var t=localStorage.getItem('meso-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="stylesheet" href="../platform/meso-tokens.css">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      text-align: center;
      padding: 48px 32px;
      background: var(--color-bg-white);
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }
    .icon { width: 44px; height: 44px; margin: 0 auto 12px; color: var(--color-accent); }
    h2 { font-size: 16px; font-weight: 650; margin-bottom: 6px; }
    p { font-size: 13px; color: var(--color-text-muted); }
    .dot { color: var(--color-accent); }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
    <h2>演示页面建设中<span class="dot">…</span></h2>
    <p>此 Demo 即将上线，请先体验"流式会话"演示</p>
  </div>
</body>
</html>
