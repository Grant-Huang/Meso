<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    (function(){var t=localStorage.getItem('meso-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    :root {
      --color-bg:             #dde2db;
      --color-bg-elevated:    #e8ece6;
      --color-bg-white:       #eef0ec;
      --color-bg-sidebar:     #d5dad2;
      --color-text:           #1c2620;
      --color-text-secondary: rgba(28,38,32,0.65);
      --color-text-muted:     rgba(28,38,32,0.42);
      --color-accent:         #3d6b52;
      --color-accent-dark:    #2a5240;
      --color-border:         #b0baa8;
      --color-border-light:   rgba(28,38,32,0.10);
      --color-code-bg:        #1a201c;
      --color-code-text:      #c8d5cb;
      --color-error:          #b83232;
      --color-success:        #2a7a4f;
    }
    [data-theme="dark"] {
      --color-bg:             #1a1e1b;
      --color-bg-elevated:    #20271f;
      --color-bg-white:       #252e26;
      --color-bg-sidebar:     #151918;
      --color-text:           #c8d5cb;
      --color-text-secondary: rgba(200,213,203,0.65);
      --color-text-muted:     rgba(200,213,203,0.42);
      --color-accent:         #5a9e70;
      --color-accent-dark:    #74ba8a;
      --color-border:         #2c3830;
      --color-border-light:   rgba(200,213,203,0.10);
      --color-code-bg:        #0e1210;
      --color-code-text:      #d5e0d8;
      --color-error:          #e06060;
      --color-success:        #5fbe85;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      text-align: center;
      padding: 48px 32px;
      background: var(--color-bg-white);
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }
    .icon { font-size: 36px; margin-bottom: 12px; }
    h2 { font-size: 16px; font-weight: 650; margin-bottom: 6px; }
    p { font-size: 13px; color: var(--color-text-muted); }
    .dot { color: var(--color-accent); }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🚧</div>
    <h2>演示页面建设中<span class="dot">…</span></h2>
    <p>此 Demo 即将上线，请先体验"流式会话"演示</p>
  </div>
</body>
</html>
