<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meso · 平台特性演示</title>
  <style>
    :root {
      --color-bg:             #ecefe9;
      --color-bg-elevated:    #f4f6f2;
      --color-bg-white:       #ffffff;
      --color-bg-sidebar:     #f7f7f3;
      --color-text:           #2f3a32;
      --color-text-secondary: rgba(47,58,50,0.6);
      --color-text-muted:     rgba(47,58,50,0.4);
      --color-accent:         #527c5e;
      --color-accent-dark:    #2f7d4a;
      --color-border:         #d9dfd7;
      --color-border-light:   rgba(47,58,50,0.1);
      --color-error:          #c0392b;
      --color-warning:        #b45309;
      --color-success:        #2f7d4a;
      --sidebar-w:            126px;
      --sidebar-w-collapsed:  48px;
      --session-col-w:        260px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ─── Left sidebar (AppSidebar) ─── */
    #app-sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--color-bg);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, min-width 0.2s ease;
      overflow: hidden;
      z-index: 10;
    }
    #app-sidebar.collapsed {
      width: var(--sidebar-w-collapsed);
      min-width: var(--sidebar-w-collapsed);
    }

    .sidebar-header {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--color-border-light);
      gap: 8px;
      flex-shrink: 0;
    }
    .sidebar-logo {
      width: 24px; height: 24px;
      background: var(--color-accent);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 700;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      color: var(--color-text);
    }
    #app-sidebar.collapsed .sidebar-title { opacity: 0; }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      border-radius: 6px;
      margin: 1px 6px;
      transition: background 0.12s;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }
    .nav-item:hover { background: rgba(82,124,94,0.08); }
    .nav-item.active {
      background: rgba(82,124,94,0.14);
      color: var(--color-accent-dark);
      font-weight: 600;
    }
    .nav-icon {
      font-size: 16px;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }
    .nav-label {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #app-sidebar.collapsed .nav-label { opacity: 0; }
    #app-sidebar.collapsed .nav-item { justify-content: center; padding: 9px 0; margin: 1px 4px; }

    .sidebar-footer {
      padding: 10px 8px;
      border-top: 1px solid var(--color-border-light);
    }
    .collapse-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 12px;
      color: var(--color-text-muted);
      transition: background 0.12s;
      white-space: nowrap;
      overflow: hidden;
    }
    .collapse-btn:hover { background: rgba(82,124,94,0.08); color: var(--color-text-secondary); }
    #app-sidebar.collapsed .collapse-btn { justify-content: center; }
    #app-sidebar.collapsed .collapse-btn span { opacity: 0; }

    /* ─── Middle column (SessionColumn) ─── */
    #session-col {
      width: var(--session-col-w);
      min-width: var(--session-col-w);
      background: var(--color-bg-sidebar);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .session-col-header {
      height: 52px;
      display: flex; align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--color-border-light);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
      flex-shrink: 0;
    }

    .session-search {
      margin: 8px 10px;
      padding: 7px 10px;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: var(--color-text);
      outline: none;
      width: calc(100% - 20px);
      transition: border-color 0.15s;
    }
    .session-search:focus { border-color: var(--color-accent); }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 6px 12px;
    }
    .session-group-label {
      font-size: 11px;
      color: var(--color-text-muted);
      padding: 10px 8px 4px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .session-item {
      padding: 9px 10px;
      cursor: pointer;
      border-radius: 6px;
      border-left: 2px solid transparent;
      font-size: 13px;
      color: var(--color-text);
      transition: background 0.1s;
      position: relative;
    }
    .session-item:hover { background: rgba(82,124,94,0.06); }
    .session-item.active {
      border-left-color: var(--color-accent);
      background: rgba(82,124,94,0.12);
      font-weight: 600;
      color: var(--color-accent-dark);
    }
    .session-item-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-item-time {
      font-size: 11px;
      color: var(--color-text-muted);
      margin-top: 1px;
      display: block;
    }

    /* ─── Right main area (AppMain) ─── */
    #app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--color-bg);
    }

    .main-header {
      height: 52px;
      display: flex; align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--color-border-light);
      flex-shrink: 0;
      gap: 10px;
    }
    .main-header-title {
      font-size: 15px;
      font-weight: 650;
      color: var(--color-text);
    }
    .main-header-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(82,124,94,0.12);
      color: var(--color-accent);
      border-radius: 20px;
      font-weight: 500;
    }

    .main-content {
      flex: 1;
      overflow: hidden;
      display: flex;
    }

    #demo-frame {
      flex: 1;
      border: none;
      background: var(--color-bg);
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════
     左栏 AppSidebar
════════════════════════════════════ -->
<div id="app-sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">M</div>
    <span class="sidebar-title">Meso Demo</span>
  </div>

  <nav class="sidebar-nav" id="app-nav">
    <!-- 流式会话第一 -->
    <div class="nav-item active" data-app="streaming" onclick="switchApp(this)">
      <span class="nav-icon">💬</span>
      <span class="nav-label">流式会话</span>
    </div>
    <div class="nav-item" data-app="layout" onclick="switchApp(this)">
      <span class="nav-icon">⬜</span>
      <span class="nav-label">布局规范</span>
    </div>
    <div class="nav-item" data-app="colors" onclick="switchApp(this)">
      <span class="nav-icon">🎨</span>
      <span class="nav-label">配色系统</span>
    </div>
    <div class="nav-item" data-app="typography" onclick="switchApp(this)">
      <span class="nav-icon">✏️</span>
      <span class="nav-label">字体规范</span>
    </div>
    <div class="nav-item" data-app="components" onclick="switchApp(this)">
      <span class="nav-icon">🧩</span>
      <span class="nav-label">基础组件</span>
    </div>
    <div class="nav-item" data-app="artifact" onclick="switchApp(this)">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Artifact 面板</span>
    </div>
    <div class="nav-item" data-app="stage" onclick="switchApp(this)">
      <span class="nav-icon">⏱</span>
      <span class="nav-label">阶段进度</span>
    </div>
    <div class="nav-item" data-app="memory" onclick="switchApp(this)">
      <span class="nav-icon">🧠</span>
      <span class="nav-label">记忆系统</span>
    </div>
    <div class="nav-item" data-app="plugin" onclick="switchApp(this)">
      <span class="nav-icon">🔌</span>
      <span class="nav-label">应用插件</span>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="collapse-btn" onclick="toggleSidebar()">
      <span style="font-size:14px;flex-shrink:0" id="collapse-icon">◀</span>
      <span>收起侧栏</span>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════
     中栏 SessionColumn
════════════════════════════════════ -->
<div id="session-col">
  <div class="session-col-header" id="session-col-title">流式会话</div>
  <input class="session-search" type="text" placeholder="搜索演示…" id="session-search" oninput="filterSessions(this.value)" />
  <div class="session-list" id="session-list"></div>
</div>

<!-- ════════════════════════════════════
     右栏 AppMain
════════════════════════════════════ -->
<div id="app-main">
  <div class="main-header">
    <span class="main-header-title" id="main-title">基础流式输出</span>
    <span class="main-header-badge" id="main-badge">流式会话</span>
  </div>
  <div class="main-content">
    <iframe id="demo-frame" src="01-streaming.html" title="Demo"></iframe>
  </div>
</div>

<script>
  /* ── App / Session data ── */
  const APPS = {
    streaming: {
      label: '流式会话',
      sessions: [
        { id: 's1', title: '基础流式输出',        time: '刚刚',  file: '01-streaming.html',   desc: '逐字打印 · 光标动画' },
        { id: 's2', title: 'Think Block 折叠',    time: '刚刚',  file: '01-streaming.html#think',   desc: '推理过程 · 自动折叠' },
        { id: 's3', title: 'Artifact 边流边渲染', time: '刚刚',  file: '01-streaming.html#artifact', desc: '代码 · HTML · Mermaid' },
        { id: 's4', title: '完整一次对话',         time: '刚刚',  file: '01-streaming.html#full',    desc: '阶段 + Think + Artifact' },
      ]
    },
    layout: {
      label: '布局规范',
      sessions: [
        { id: 'l1', title: '三栏结构',     time: '今天', file: 'coming-soon.html', desc: '126px / 260px / flex:1' },
        { id: 'l2', title: '侧栏折叠',     time: '今天', file: 'coming-soon.html', desc: '48px ↔ 126px 动画' },
        { id: 'l3', title: '分隔条拖拽',   time: '今天', file: 'coming-soon.html', desc: '60% / 40% 分屏' },
      ]
    },
    colors: {
      label: '配色系统',
      sessions: [
        { id: 'c1', title: '主色板',   time: '今天', file: '../color-palette.html', desc: 'bg / accent / text / border' },
        { id: 'c2', title: '状态色',   time: '今天', file: '../color-palette.html#status', desc: 'error / warning / success' },
        { id: 'c3', title: 'AI-KA 对比', time: '今天', file: '../color-palette.html#aika', desc: '#4f7f67 vs #527c5e' },
      ]
    },
    typography: {
      label: '字体规范',
      sessions: [
        { id: 't1', title: '字号层级',     time: '今天', file: 'coming-soon.html', desc: '11px → 24px' },
        { id: 't2', title: 'Markdown 渲染', time: '今天', file: 'coming-soon.html', desc: '正文 / 代码 / 标题' },
      ]
    },
    components: {
      label: '基础组件',
      sessions: [
        { id: 'co1', title: '按钮 & 标签',  time: '今天', file: 'coming-soon.html', desc: 'primary / ghost / status' },
        { id: 'co2', title: '输入框',       time: '今天', file: 'coming-soon.html', desc: 'focus / error 状态' },
        { id: 'co3', title: '圆角规范',     time: '今天', file: 'coming-soon.html', desc: '8px / 10px / 14px' },
      ]
    },
    artifact: {
      label: 'Artifact 面板',
      sessions: [
        { id: 'a1', title: '代码高亮',     time: '今天', file: 'coming-soon.html', desc: 'highlight.js' },
        { id: 'a2', title: 'HTML 预览',    time: '今天', file: 'coming-soon.html', desc: 'sandbox iframe' },
        { id: 'a3', title: 'Mermaid 图',   time: '今天', file: 'coming-soon.html', desc: 'SVG 渲染' },
      ]
    },
    stage: {
      label: '阶段进度',
      sessions: [
        { id: 'st1', title: '进度时序动画', time: '今天', file: 'coming-soon.html', desc: 'done → active → pending' },
        { id: 'st2', title: '自动折叠',    time: '今天', file: 'coming-soon.html', desc: '1500ms 后收起' },
      ]
    },
    memory: {
      label: '记忆系统',
      sessions: [
        { id: 'm1', title: '记忆召回展示',   time: '今天', file: 'coming-soon.html', desc: 'memory chips' },
        { id: 'm2', title: '短期 / 长期记忆', time: '今天', file: 'coming-soon.html', desc: '.md + Obsidian' },
      ]
    },
    plugin: {
      label: '应用插件',
      sessions: [
        { id: 'p1', title: 'App Manifest',  time: '今天', file: 'coming-soon.html', desc: 'manifest.json 结构' },
        { id: 'p2', title: '应用切换',      time: '今天', file: 'coming-soon.html', desc: 'Composer 工具栏联动' },
      ]
    },
  }

  let currentApp = 'streaming'
  let currentSession = 's1'
  let sidebarCollapsed = false

  function renderSessions(appId, filter = '') {
    const app = APPS[appId]
    const list = document.getElementById('session-list')
    const sessions = app.sessions.filter(s =>
      !filter || s.title.includes(filter) || s.desc.includes(filter)
    )
    list.innerHTML = sessions.map(s => `
      <div class="session-item ${s.id === currentSession ? 'active' : ''}"
           data-id="${s.id}" data-file="${s.file}" data-title="${s.title}"
           onclick="switchSession(this)">
        <span class="session-item-title">${s.title}</span>
        <span class="session-item-time">${s.desc}</span>
      </div>
    `).join('')
  }

  function switchApp(el) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
    el.classList.add('active')
    const appId = el.dataset.app
    currentApp = appId
    const app = APPS[appId]
    document.getElementById('session-col-title').textContent = app.label
    currentSession = app.sessions[0].id
    document.getElementById('session-search').value = ''
    renderSessions(appId)
    // load first session
    const first = app.sessions[0]
    loadDemo(first.file, first.title, app.label)
  }

  function switchSession(el) {
    document.querySelectorAll('.session-item').forEach(n => n.classList.remove('active'))
    el.classList.add('active')
    currentSession = el.dataset.id
    loadDemo(el.dataset.file, el.dataset.title, APPS[currentApp].label)
  }

  function loadDemo(file, title, badge) {
    document.getElementById('demo-frame').src = file
    document.getElementById('main-title').textContent = title
    document.getElementById('main-badge').textContent = badge
  }

  function filterSessions(val) {
    renderSessions(currentApp, val)
  }

  function toggleSidebar() {
    const sb = document.getElementById('app-sidebar')
    sidebarCollapsed = !sidebarCollapsed
    sb.classList.toggle('collapsed', sidebarCollapsed)
    document.getElementById('collapse-icon').textContent = sidebarCollapsed ? '▶' : '◀'
  }

  // Init
  renderSessions('streaming')
</script>
</body>
</html>
