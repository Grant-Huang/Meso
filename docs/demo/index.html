<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meso · 平台特性演示</title>
  <script>
    (function(){var t=localStorage.getItem('meso-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="stylesheet" href="../platform/meso-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.6;
      background: var(--color-bg); color: var(--color-text);
      height: 100vh; overflow: hidden; display: flex;
    }

    /* ── Left sidebar ── */
    #app-sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--color-bg);
      border-right: 1px solid var(--color-border);
      display: flex; flex-direction: column;
      transition: width 0.2s ease, min-width 0.2s ease;
      overflow: hidden; z-index: 10;
    }
    #app-sidebar.collapsed {
      width: var(--sidebar-w-collapsed);
      min-width: var(--sidebar-w-collapsed);
    }

    .sidebar-header {
      height: 52px;
      display: flex; align-items: center;
      padding: 0 10px 0 12px;
      border-bottom: 1px solid var(--color-border-light);
      gap: 8px; flex-shrink: 0;
    }
    .sidebar-logo {
      width: 26px; height: 26px; flex-shrink: 0;
      background: var(--color-accent); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 700;
      transition: opacity 0.15s ease, width 0.2s ease, margin 0.2s ease;
    }
    .sidebar-title {
      flex: 1; font-size: 14px; font-weight: 650;
      white-space: nowrap; overflow: hidden;
      color: var(--color-text);
      opacity: 1; transition: opacity 0.15s ease;
    }
    #app-sidebar.collapsed .sidebar-title { opacity: 0; }
    #app-sidebar.collapsed .sidebar-logo  { opacity: 0; width: 0; margin: 0; }
    #app-sidebar.collapsed .sidebar-header { justify-content: center; padding: 0; }

    /* Collapse toggle button — lives in header, right-aligned */
    .collapse-toggle {
      flex-shrink: 0; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; cursor: pointer;
      color: var(--color-text-muted);
      transition: background 0.12s, color 0.12s;
      border: none; background: transparent;
    }
    .collapse-toggle:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    /* Collapsed: make the toggle button a larger tap target */
    #app-sidebar.collapsed .collapse-toggle { width: 40px; height: 40px; }

    /* Nav */
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; cursor: pointer;
      border-radius: 6px; margin: 1px 6px;
      transition: background 0.12s;
      white-space: nowrap; overflow: hidden;
      color: var(--color-text-secondary);
    }
    .nav-item:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .nav-item.active { background: var(--nav-active-bg); color: var(--color-accent-dark); }
    .nav-icon { flex-shrink: 0; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .nav-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.15s ease; }
    #app-sidebar.collapsed .nav-label { opacity: 0; }
    #app-sidebar.collapsed .nav-item { justify-content: center; padding: 8px 0; margin: 1px 4px; }

    /* ── Middle column ── */
    #session-col {
      width: var(--session-col-w); min-width: var(--session-col-w);
      background: var(--color-bg-sidebar);
      border-right: 1px solid var(--color-border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .session-search {
      margin: 8px 10px; padding: 6px 10px;
      background: var(--color-bg-white); border: 1px solid var(--color-border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      color: var(--color-text); outline: none; width: calc(100% - 20px);
      transition: border-color 0.15s;
    }
    .session-search:focus { border-color: var(--color-accent); }
    /* Session column header with + button */
    .session-col-header {
      height: 52px; display: flex; align-items: center;
      padding: 0 8px 0 14px; border-bottom: 1px solid var(--color-border-light);
      font-size: 14px; font-weight: 600; flex-shrink: 0; gap: 6px;
    }
    .session-col-header span { flex: 1; }
    .new-session-btn {
      flex-shrink: 0; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; cursor: pointer;
      color: var(--color-text-muted);
      border: none; background: transparent;
      transition: background 0.12s, color 0.12s;
    }
    .new-session-btn:hover { background: var(--nav-hover-bg); color: var(--color-accent); }

    .session-list { flex: 1; overflow-y: auto; padding: 4px 6px 0; }
    .session-empty {
      padding: 24px 12px; text-align: center;
      font-size: 12px; color: var(--color-text-muted);
    }
    .session-group-label {
      font-size: 11px; color: var(--color-text-muted);
      padding: 10px 8px 4px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .session-item {
      padding: 9px 10px; cursor: pointer; border-radius: 6px;
      border-left: 2px solid transparent; font-size: 13px;
      transition: background 0.1s;
    }
    .session-item:hover { background: var(--session-hover-bg); }
    .session-item.active {
      border-left-color: var(--color-accent);
      background: var(--session-active-bg);
      color: var(--color-accent-dark); font-weight: 600;
    }
    .session-item-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-item-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; display: block; }
    /* "所有会话" row — immediately follows list */
    .all-sessions-row {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; margin: 2px 6px 8px;
      border-radius: 6px; cursor: pointer; font-size: 12px;
      color: var(--color-text-muted);
      transition: background 0.12s, color 0.12s;
    }
    .all-sessions-row:hover { background: var(--session-hover-bg); color: var(--color-text); }

    /* ── Sidebar user footer ── */
    .sidebar-footer {
      flex-shrink: 0; border-top: 1px solid var(--color-border-light);
      padding: 6px 6px; position: relative;
    }
    .user-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 8px; cursor: pointer;
      width: 100%; border: none; background: transparent;
      color: var(--color-text-secondary);
      transition: background 0.12s, color 0.12s;
      white-space: nowrap; overflow: hidden;
    }
    .user-btn:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .user-avatar {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
      background: var(--color-accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
    }
    .user-name { font-size: 13px; flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
    #app-sidebar.collapsed .user-name { opacity: 0; }
    #app-sidebar.collapsed .user-btn { justify-content: center; padding: 6px 0; }

    /* Upward popup menu */
    .user-menu {
      position: absolute; bottom: calc(100% + 4px); left: 6px; right: 6px;
      background: var(--color-bg-white); border: 1px solid var(--color-border);
      border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      overflow: hidden; display: none; z-index: 100;
    }
    .user-menu.open { display: block; }
    .user-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer; font-size: 13px;
      color: var(--color-text-secondary);
      transition: background 0.1s;
    }
    .user-menu-item:hover { background: var(--session-hover-bg); color: var(--color-text); }
    .user-menu-item svg { flex-shrink: 0; color: var(--color-text-muted); }
    .user-menu-sep { height: 1px; background: var(--color-border-light); margin: 3px 0; }

    /* ── Right main area ── */
    #app-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .main-header {
      height: 52px; display: flex; align-items: center;
      padding: 0 20px; border-bottom: 1px solid var(--color-border-light);
      flex-shrink: 0; gap: 10px;
    }
    .main-header-title { font-size: 15px; font-weight: 650; }
    .main-header-badge {
      font-size: 11px; padding: 2px 8px;
      background: var(--badge-bg); color: var(--color-accent);
      border-radius: 20px; font-weight: 500;
    }
    /* ── Theme toggle ── */
    .theme-toggle {
      margin-left: auto; flex-shrink: 0;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; cursor: pointer;
      color: var(--color-text-muted);
      border: none; background: transparent;
      transition: background 0.12s, color 0.12s;
    }
    .theme-toggle:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: block; }
    .main-content { flex: 1; overflow: hidden; }
    #demo-frame { width: 100%; height: 100%; border: none; background: var(--color-bg); }

    /* ── Sidebar footer / user menu ── */
    .sidebar-footer {
      position: relative; flex-shrink: 0;
      border-top: 1px solid var(--color-border-light);
      padding: 6px;
    }
    .user-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 6px 8px; border: none; background: none;
      border-radius: 6px; cursor: pointer; color: var(--color-text);
      transition: background 0.12s;
    }
    .user-btn:hover { background: rgba(82,124,94,0.08); }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--color-accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; transition: opacity 0.15s; }
    #app-sidebar.collapsed .user-name { opacity: 0; }
    #app-sidebar.collapsed .user-btn { justify-content: center; padding: 6px 0; }

    .user-menu {
      position: absolute; bottom: calc(100% + 4px); left: 6px; right: 6px;
      background: var(--color-bg-white, #fff);
      border: 1px solid var(--color-border);
      border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      padding: 4px; display: none; flex-direction: column; gap: 1px;
      z-index: 100;
    }
    .user-menu.open { display: flex; }
    .user-menu-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 5px; cursor: pointer;
      font-size: 13px; color: var(--color-text);
      transition: background 0.1s;
    }
    .user-menu-item:hover { background: rgba(82,124,94,0.08); }
    .user-menu-sep { height: 1px; background: var(--color-border); margin: 3px 0; }
  </style>
</head>
<body>

<!-- ── Left sidebar ── -->
<div id="app-sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">M</div>
    <span class="sidebar-title">Meso Demo</span>
    <button class="collapse-toggle" onclick="toggleSidebar()" title="展开/收起侧栏">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="2" y1="4"  x2="14" y2="4"/>
        <line x1="2" y1="8"  x2="14" y2="8"/>
        <line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-item active" data-app="streaming" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4h12a1 1 0 011 1v7a1 1 0 01-1 1H6.5L4 15V13H3a1 1 0 01-1-1V5a1 1 0 011-1z"/>
          <line x1="5.5" y1="8" x2="12.5" y2="8"/><line x1="5.5" y1="10.5" x2="9" y2="10.5"/>
        </svg>
      </span>
      <span class="nav-label">流式会话</span>
    </div>
    <div class="nav-item" data-app="layout" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <rect x="1.5" y="1.5" width="15" height="15" rx="1.5"/>
          <line x1="5.5" y1="1.5" x2="5.5" y2="16.5"/>
          <line x1="11" y1="1.5" x2="11" y2="16.5"/>
          <line x1="11" y1="7.5" x2="16.5" y2="7.5"/>
        </svg>
      </span>
      <span class="nav-label">布局规范</span>
    </div>
    <div class="nav-item" data-app="colors" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="9" r="7"/>
          <circle cx="6.5" cy="7.5" r="1.8" fill="currentColor" stroke="none"/>
          <circle cx="11.5" cy="7.5" r="1.8" fill="currentColor" stroke="none"/>
          <circle cx="9" cy="12" r="1.8" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="nav-label">配色系统</span>
    </div>
    <div class="nav-item" data-app="typography" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M2 4.5h14M9 4.5V15M6 15h6"/>
        </svg>
      </span>
      <span class="nav-label">字体规范</span>
    </div>
    <div class="nav-item" data-app="components" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="6" height="6" rx="1.2"/>
          <rect x="10" y="2" width="6" height="6" rx="1.2"/>
          <rect x="2" y="10" width="6" height="6" rx="1.2"/>
          <rect x="10" y="10" width="6" height="6" rx="1.2"/>
        </svg>
      </span>
      <span class="nav-label">基础组件</span>
    </div>
    <div class="nav-item" data-app="artifact" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5.5,6.5 2,9 5.5,11.5"/>
          <polyline points="12.5,6.5 16,9 12.5,11.5"/>
          <line x1="10.5" y1="4" x2="7.5" y2="14"/>
        </svg>
      </span>
      <span class="nav-label">Artifact 面板</span>
    </div>
    <div class="nav-item" data-app="stage" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="4.5" cy="5" r="1.5" fill="currentColor" stroke="none"/>
          <line x1="7.5" y1="5" x2="16" y2="5"/>
          <circle cx="4.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/>
          <line x1="7.5" y1="9.5" x2="16" y2="9.5"/>
          <circle cx="4.5" cy="14" r="1.5"/>
          <line x1="7.5" y1="14" x2="16" y2="14"/>
          <line x1="4.5" y1="6.5" x2="4.5" y2="8"/>
          <line x1="4.5" y1="11" x2="4.5" y2="12.5"/>
        </svg>
      </span>
      <span class="nav-label">阶段进度</span>
    </div>
    <div class="nav-item" data-app="memory" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <ellipse cx="9" cy="5" rx="6.5" ry="2.5"/>
          <path d="M2.5 5v3c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5V5"/>
          <path d="M2.5 8v3c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5V8"/>
          <path d="M2.5 11v2c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5v-2"/>
        </svg>
      </span>
      <span class="nav-label">记忆系统</span>
    </div>
    <div class="nav-item" data-app="plugin" onclick="switchApp(this)">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="8.5" width="14" height="7.5" rx="1.5"/>
          <path d="M6 8.5V6a3 3 0 016 0v2.5"/>
          <circle cx="9" cy="12" r="1.5"/>
        </svg>
      </span>
      <span class="nav-label">应用插件</span>
    </div>
  </nav>

  <!-- User footer -->
  <div class="sidebar-footer">
    <div class="user-menu" id="user-menu">
      <div class="user-menu-item" onclick="openSettings()">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7.5" cy="7.5" r="2.2"/>
          <path d="M7.5 1v1.5M7.5 12v1.5M1 7.5h1.5M12 7.5h1.5M3.2 3.2l1 1M10.8 10.8l1 1M10.8 3.2l-1 1M3.2 10.8l1-1"/>
        </svg>
        设置
      </div>
      <div class="user-menu-item" onclick="openHelp()">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="7.5" cy="7.5" r="6.5"/>
          <path d="M5.5 5.8a2 2 0 013.8.7c0 1.4-1.8 1.8-1.8 3"/>
          <circle cx="7.5" cy="11.5" r="0.6" fill="currentColor" stroke="none"/>
        </svg>
        帮助
      </div>
      <div class="user-menu-sep"></div>
      <div class="user-menu-item" onclick="closeUserMenu()">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <circle cx="7.5" cy="7.5" r="5.5"/>
          <line x1="7.5" y1="5" x2="7.5" y2="7.5"/><circle cx="7.5" cy="10" r="0.6" fill="currentColor" stroke="none"/>
        </svg>
        关于 Meso
      </div>
      <div class="user-menu-item" onclick="closeUserMenu()">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2H3a1 1 0 00-1 1v9a1 1 0 001 1h3"/>
          <polyline points="10,10 13,7.5 10,5"/><line x1="5" y1="7.5" x2="13" y2="7.5"/>
        </svg>
        退出登录
      </div>
    </div>
    <button class="user-btn" onclick="toggleUserMenu(event)">
      <div class="user-avatar">G</div>
      <span class="user-name">Grant</span>
    </button>
  </div>
</div>

<!-- ── Middle column ── -->
<div id="session-col">
  <div class="session-col-header">
    <span id="session-col-title">流式会话</span>
    <button class="new-session-btn" onclick="newSession()" title="新建会话">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
      </svg>
    </button>
  </div>
  <input class="session-search" type="text" placeholder="搜索演示…" oninput="filterSessions(this.value)" />
  <div class="session-list" id="session-list"></div>
  <div class="all-sessions-row" onclick="showAllSessions()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="1" y1="3" x2="13" y2="3"/><line x1="1" y1="7" x2="13" y2="7"/><line x1="1" y1="11" x2="13" y2="11"/>
    </svg>
    所有会话
  </div>
</div>

<!-- ── Right main area ── -->
<div id="app-main">
  <div class="main-header">
    <span class="main-header-title" id="main-title">基础流式输出</span>
    <span class="main-header-badge" id="main-badge">流式会话</span>
    <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗主题">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M13.5 10A5.5 5.5 0 017.5 3.5c0-.28.02-.56.07-.84A6.5 6.5 0 1013.84 10c-.11-.01-.22-.01-.34 0z"/>
      </svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="8" cy="8" r="3"/>
        <line x1="8" y1="1" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="15"/>

<script>
const APPS = {

    ]

  layout: {

    ]
  },
  typography: {

    sessions: [

    sessions: [
      { id: 'a1', title: '代码高亮',    sub: 'Python 语法着色',      file: '06-artifact.html' },

  memory: {

    sessions: [

      { id: 'm2', title: '召回模拟',        sub: '关键词 + 语义混合检索',    file: '08-memory.html#recall' },

  plugin: {

    sessions: [
      { id: 'p1', title: 'App 切换',      sub: '通用对话 / 文档审查 / 代码', file: '09-plugin.html' },
      { id: 'p2', title: 'App Manifest',  sub: 'manifest.json 结构',         file: '09-plugin.html#manifest' },
      { id: 'p3', title: 'Composer 联动', sub: '工具栏随 App 变化',           file: '09-plugin.html#composer' },
    ]
  },
}

let currentApp = 'streaming'
let currentSession = 's1'
let collapsed = false

function renderSessions(appId, filter = '') {
  const app = APPS[appId]
  const list = document.getElementById('session-list')
  const items = app.sessions.filter(s =>
    !filter || s.title.includes(filter) || s.sub.includes(filter)
  )
  if (items.length === 0) {
    list.innerHTML = '<div class="session-empty">暂无历史会话</div>'
    return
  }
  list.innerHTML = items.map(s => `
    <div class="session-item ${s.id === currentSession ? 'active' : ''}"
         data-id="${s.id}" data-file="${s.file}" data-title="${s.title}"
         onclick="switchSession(this)">
      <span class="session-item-title">${s.title}</span>
      <span class="session-item-sub">${s.sub}</span>
    </div>`).join('')
}

function newSession() { /* demo stub — shows empty state */ }
function showAllSessions() { /* demo stub */ }

function toggleUserMenu(e) {
  e.stopPropagation()
  document.getElementById('user-menu').classList.toggle('open')
}
function closeUserMenu() {
  document.getElementById('user-menu').classList.remove('open')
}
function openHelp() {
  closeUserMenu()
  window.open('../help.html', '_blank', 'noopener')
}
function openSettings() {
  closeUserMenu()
  window.open('../settings.html', '_blank', 'noopener')
}
document.addEventListener('click', closeUserMenu)

function switchApp(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  el.classList.add('active')
  currentApp = el.dataset.app
  const app = APPS[currentApp]
  document.getElementById('session-col-title').textContent = app.label
  currentSession = app.sessions[0].id
  document.querySelector('.session-search').value = ''
  renderSessions(currentApp)
  const first = app.sessions[0]
  loadDemo(first.file, first.title, app.label)
}

function switchSession(el) {
  document.querySelectorAll('.session-item').forEach(n => n.classList.remove('active'))
  el.classList.add('active')
  currentSession = el.dataset.id
  loadDemo(el.dataset.file, el.dataset.title, APPS[currentApp].label)
}

function loadDemo(file, title, badge) {
  const frame = document.getElementById('demo-frame')
  frame.src = file
  document.getElementById('main-title').textContent = title
  document.getElementById('main-badge').textContent = badge
  frame.onload = () => {
    const theme = localStorage.getItem('meso-theme') || 'light'
    try { frame.contentDocument.documentElement.setAttribute('data-theme', theme) } catch(e) {}
  }
}

function filterSessions(val) { renderSessions(currentApp, val) }

function toggleSidebar() {
  collapsed = !collapsed
  document.getElementById('app-sidebar').classList.toggle('collapsed', collapsed)
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme)
  const frame = document.getElementById('demo-frame')
  try { frame.contentDocument.documentElement.setAttribute('data-theme', theme) } catch(e) {}
}

function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
  localStorage.setItem('meso-theme', next)
  applyTheme(next)
}

renderSessions('streaming')
</script>
</body>
</html>
