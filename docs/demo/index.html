<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meso · 平台特性演示</title>
  <style>
    :root {
      --color-bg:             #ecefe9;
      --color-bg-elevated:    #f4f6f2;
      --color-bg-white:       #ffffff;
      --color-bg-sidebar:     #f7f7f3;
      --color-text:           #2f3a32;
      --color-text-secondary: rgba(47,58,50,0.6);
      --color-text-muted:     rgba(47,58,50,0.4);
      --color-accent:         #527c5e;
      --color-accent-dark:    #2f7d4a;
      --color-border:         #d9dfd7;
      --color-border-light:   rgba(47,58,50,0.1);
      --sidebar-w:            145px;
      --sidebar-w-collapsed:  52px;
      --session-col-w:        260px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.6;
      background: var(--color-bg); color: var(--color-text);
      height: 100vh; overflow: hidden; display: flex;
    }

    /* ── Left sidebar ── */
    #app-sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--color-bg);
      border-right: 1px solid var(--color-border);
      display: flex; flex-direction: column;
      transition: width 0.2s ease, min-width 0.2s ease;
      overflow: hidden; z-index: 10;
    }
    #app-sidebar.collapsed {
      width: var(--sidebar-w-collapsed);
      min-width: var(--sidebar-w-collapsed);
    }

    .sidebar-header {
      height: 52px;
      display: flex; align-items: center;
      padding: 0 10px 0 12px;
      border-bottom: 1px solid var(--color-border-light);
      gap: 8px; flex-shrink: 0;
    }
    .sidebar-logo {
      width: 26px; height: 26px; flex-shrink: 0;
      background: var(--color-accent); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 700;
    }
    .sidebar-title {
      flex: 1; font-size: 14px; font-weight: 650;
      white-space: nowrap; overflow: hidden;
      color: var(--color-text);
      opacity: 1; transition: opacity 0.15s ease;
    }
    #app-sidebar.collapsed .sidebar-title { opacity: 0; }

    /* Collapse toggle button — lives in header, right-aligned */
    .collapse-toggle {
      flex-shrink: 0; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; cursor: pointer;
      color: var(--color-text-muted);
      transition: background 0.12s, color 0.12s;
      border: none; background: transparent;
    }
    .collapse-toggle:hover { background: rgba(82,124,94,0.1); color: var(--color-text); }
    .collapse-toggle svg { transition: transform 0.2s ease; }
    #app-sidebar.collapsed .collapse-toggle svg { transform: rotate(180deg); }

    /* Nav */
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 6px 0; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; cursor: pointer;
      border-radius: 6px; margin: 1px 6px;
      transition: background 0.12s;
      white-space: nowrap; overflow: hidden;
      color: var(--color-text-secondary);
    }
    .nav-item:hover { background: rgba(82,124,94,0.08); color: var(--color-text); }
    .nav-item.active { background: rgba(82,124,94,0.14); color: var(--color-accent-dark); }
    .nav-icon { flex-shrink: 0; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .nav-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.15s ease; }
    #app-sidebar.collapsed .nav-label { opacity: 0; }
    #app-sidebar.collapsed .nav-item { justify-content: center; padding: 8px 0; margin: 1px 4px; }

    /* ── Middle column ── */
    #session-col {
      width: var(--session-col-w); min-width: var(--session-col-w);
      background: var(--color-bg-sidebar);
      border-right: 1px solid var(--color-border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .session-col-header {
      height: 52px; display: flex; align-items: center;
      padding: 0 14px; border-bottom: 1px solid var(--color-border-light);
      font-size: 14px; font-weight: 600; flex-shrink: 0;
    }
    .session-search {
      margin: 8px 10px; padding: 6px 10px;
      background: var(--color-bg-white); border: 1px solid var(--color-border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      color: var(--color-text); outline: none; width: calc(100% - 20px);
      transition: border-color 0.15s;
    }
    .session-search:focus { border-color: var(--color-accent); }
    .session-list { flex: 1; overflow-y: auto; padding: 4px 6px 12px; }
    .session-group-label {
      font-size: 11px; color: var(--color-text-muted);
      padding: 10px 8px 4px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .session-item {
      padding: 9px 10px; cursor: pointer; border-radius: 6px;
      border-left: 2px solid transparent; font-size: 13px;
      transition: background 0.1s;
    }
    .session-item:hover { background: rgba(82,124,94,0.06); }
    .session-item.active {
      border-left-color: var(--color-accent);
      background: rgba(82,124,94,0.12);
      color: var(--color-accent-dark); font-weight: 600;
    }
    .session-item-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-item-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; display: block; }

    /* ── Right main area ── */
    #app-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .main-header {
      height: 52px; display: flex; align-items: center;
      padding: 0 20px; border-bottom: 1px solid var(--color-border-light);
      flex-shrink: 0; gap: 10px;
    }
    .main-header-title { font-size: 15px; font-weight: 650; }
    .main-header-badge {
      font-size: 11px; padding: 2px 8px;
      background: rgba(82,124,94,0.12); color: var(--color-accent);
      border-radius: 20px; font-weight: 500;
    }
    .main-content { flex: 1; overflow: hidden; }
    #demo-frame { width: 100%; height: 100%; border: none; background: var(--color-bg); }

    /* ── Sidebar footer / user menu ── */
    .sidebar-footer {
      position: relative; flex-shrink: 0;
      border-top: 1px solid var(--color-border-light);
      padding: 6px;
    }
    .user-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 6px 8px; border: none; background: none;
      border-radius: 6px; cursor: pointer; color: var(--color-text);
      transition: background 0.12s;
    }
    .user-btn:hover { background: rgba(82,124,94,0.08); }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--color-accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; transition: opacity 0.15s; }
    #app-sidebar.collapsed .user-name { opacity: 0; }
    #app-sidebar.collapsed .user-btn { justify-content: center; padding: 6px 0; }

    .user-menu {
      position: absolute; bottom: calc(100% + 4px); left: 6px; right: 6px;
      background: var(--color-bg-white, #fff);
      border: 1px solid var(--color-border);
      border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      padding: 4px; display: none; flex-direction: column; gap: 1px;
      z-index: 100;
    }
    .user-menu.open { display: flex; }
    .user-menu-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 5px; cursor: pointer;
      font-size: 13px; color: var(--color-text);
      transition: background 0.1s;
    }
    .user-menu-item:hover { background: rgba(82,124,94,0.08); }
    .user-menu-sep { height: 1px; background: var(--color-border); margin: 3px 0; }
  </style>
</head>

let currentApp = 'streaming'
let currentSession = 's1'
let collapsed = false

function renderSessions(appId, filter = '') {
  const app = APPS[appId]
  const list = document.getElementById('session-list')
  const items = app.sessions.filter(s =>
    !filter || s.title.includes(filter) || s.sub.includes(filter)
  )
  list.innerHTML = items.map(s => `
    <div class="session-item ${s.id === currentSession ? 'active' : ''}"
         data-id="${s.id}" data-file="${s.file}" data-title="${s.title}"
         onclick="switchSession(this)">
      <span class="session-item-title">${s.title}</span>
      <span class="session-item-sub">${s.sub}</span>
    </div>`).join('')
}

function newSession() { /* demo stub — shows empty state */ }
function showAllSessions() { /* demo stub */ }

function toggleUserMenu(e) {
  e.stopPropagation()
  document.getElementById('user-menu').classList.toggle('open')
}
function closeUserMenu() {
  document.getElementById('user-menu').classList.remove('open')
}
function openHelp() {
  closeUserMenu()
  window.open('../help.html', '_blank', 'noopener')
}
function openSettings() {
  closeUserMenu()
  window.open('../settings.html', '_blank', 'noopener')
}
document.addEventListener('click', closeUserMenu)

function switchApp(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'))
  el.classList.add('active')
  currentApp = el.dataset.app
  const app = APPS[currentApp]
  document.getElementById('session-col-title').textContent = app.label
  currentSession = app.sessions[0].id
  document.querySelector('.session-search').value = ''
  renderSessions(currentApp)
  const first = app.sessions[0]
  loadDemo(first.file, first.title, app.label)
}

function switchSession(el) {
  document.querySelectorAll('.session-item').forEach(n => n.classList.remove('active'))
  el.classList.add('active')
  currentSession = el.dataset.id
  loadDemo(el.dataset.file, el.dataset.title, APPS[currentApp].label)
}

function loadDemo(file, title, badge) {
  document.getElementById('demo-frame').src = file
  document.getElementById('main-title').textContent = title
  document.getElementById('main-badge').textContent = badge
}

function filterSessions(val) { renderSessions(currentApp, val) }

function toggleSidebar() {
  collapsed = !collapsed
  document.getElementById('app-sidebar').classList.toggle('collapsed', collapsed)
}

renderSessions('streaming')
</script>
</body>
</html>
