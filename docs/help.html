    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Top bar ── */
    .help-topbar {
      height: 52px; flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-sidebar);
      z-index: 20;
    }
    .help-topbar-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--color-text-secondary);
      text-decoration: none; padding: 4px 10px;
      border-radius: 6px; transition: background 0.12s, color 0.12s;
    }
    .help-topbar-back:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .help-topbar-sep { width: 1px; height: 18px; background: var(--color-border); }
    .help-topbar-title { font-size: 14px; font-weight: 650; color: var(--color-text); }
    .help-topbar-spacer { flex: 1; }

      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; cursor: pointer;
      color: var(--color-text-muted);
      border: none; background: transparent;
      transition: background 0.12s, color 0.12s;

    .theme-toggle:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: block; }

    /* ── Body shell ── */
    .help-shell { flex: 1; display: flex; overflow: hidden; }

    .help-nav {
      width: 220px; min-width: 220px;
      background: var(--color-bg-sidebar);
      border-right: 1px solid var(--color-border);

      overflow: hidden;

    .help-search-wrap { padding: 10px 10px 6px; flex-shrink: 0; }
    .help-search {
      width: 100%; padding: 6px 10px;

      border: 1px solid var(--color-border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      color: var(--color-text); outline: none;

    .help-search:focus { border-color: var(--color-accent); }
    .help-search::placeholder { color: var(--color-text-muted); }
    .help-nav-list { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
    .help-nav-group {
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--color-text-muted);
      padding: 12px 14px 4px;

    .help-nav-item {

      padding: 7px 12px; cursor: pointer;
      border-radius: 6px; margin: 1px 6px;
      transition: background 0.12s, color 0.12s;
      color: var(--color-text-secondary);
      border: none; background: transparent;
      width: calc(100% - 12px); text-align: left;
      font-family: inherit; font-size: 13px;

// ──────────────────────────────────────────────────────────────────────────────
// Minimal Markdown renderer
// ──────────────────────────────────────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inline(t) {
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,'<em>$1</em>');
  t = t.replace(/~~(.+?)~~/g,'<del>$1</del>');
  t = t.replace(/`([^`]+)`/g, (_,c) => '<code class="hinline">'+esc(c)+'</code>');
  t = t.replace(/\[([^\]]+)\]\(demo:([^)]+)\)/g, (_,l,f) =>
    '<a class="hdemo-btn" href="demo/'+f+'" target="_blank">&#9654; '+l+'</a>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,l,u) =>
    '<a class="hlink" href="'+u+'" target="_blank" rel="noopener">'+l+'</a>');
  return t;
}
function slug(t) {
  return t.replace(/<[^>]+>/g,'').toLowerCase().replace(/[^\w一-鿿]+/g,'-').replace(/^-|-$/g,'');
}

function renderMd(src) {
  const lines = src.split('\n');
  const blocks = []; const ph = [];
  let inFence=false, fLang='', fLines=[];

  for (const line of lines) {
    if (!inFence) {
      const m = line.match(/^```(\S*)\s*$/);
      if (m) { inFence=true; fLang=m[1]; fLines=[]; }
      else ph.push(line);
    } else {
      if (line.match(/^```\s*$/)) {
        const idx=blocks.length;
        blocks.push({lang:fLang,code:fLines.join('\n')});
        ph.push('\x00B'+idx+'\x00'); inFence=false;
      } else fLines.push(line);
    }
  }

  const out=[]; let i=0;
  while (i<ph.length) {
    const line=ph[i];
    const bm=line.match(/^\x00B(\d+)\x00$/);
    if (bm) {
      const {lang,code}=blocks[+bm[1]];
      out.push('<pre><code'+(lang?' class="lang-'+lang+'"':'')+'>'+esc(code)+'</code></pre>');
      i++; continue;
    }
    if (line.match(/^####\s/)) { const t=inline(esc(line.slice(5))); out.push('<h4 id="'+slug(line.slice(5))+'">'+t+'</h4>'); i++; continue; }
    if (line.match(/^###\s/))  { const t=inline(esc(line.slice(4))); out.push('<h3 id="'+slug(line.slice(4))+'">'+t+'</h3>'); i++; continue; }
    if (line.match(/^##\s/))   { const t=inline(esc(line.slice(3))); out.push('<h2 id="'+slug(line.slice(3))+'">'+t+'</h2>'); i++; continue; }
    if (line.match(/^#\s/))    { const t=inline(esc(line.slice(2))); out.push('<h1 id="'+slug(line.slice(2))+'">'+t+'</h1>'); i++; continue; }
    if (line.match(/^---+\s*$/)) { out.push('<hr>'); i++; continue; }
    if (line.match(/^>\s/)) {
      const bq=[]; while(i<ph.length&&ph[i].match(/^>\s?/)){bq.push(inline(esc(ph[i].replace(/^>\s?/,''))));i++;}
      out.push('<blockquote><p>'+bq.join('<br>')+'</p></blockquote>'); continue;
    }
    if (line.match(/^[-*]\s+/)) {
      const li=[]; while(i<ph.length&&ph[i].match(/^[-*]\s+/)){li.push('<li>'+inline(esc(ph[i].replace(/^[-*]\s+/,'')))+'</li>');i++;}
      out.push('<ul>'+li.join('')+'</ul>'); continue;
    }
    if (line.match(/^\d+\.\s+/)) {
      const li=[]; while(i<ph.length&&ph[i].match(/^\d+\.\s+/)){li.push('<li>'+inline(esc(ph[i].replace(/^\d+\.\s+/,'')))+'</li>');i++;}
      out.push('<ol>'+li.join('')+'</ol>'); continue;
    }
    if (line.match(/^\|/)) {
      const tl=[]; while(i<ph.length&&ph[i].match(/^\|/)){tl.push(ph[i]);i++;}
      if (tl.length>=2) {
        const pr=r=>r.split('|').slice(1,-1).map(c=>c.trim());
        const hd=pr(tl[0]); const rows=tl.slice(2).map(pr);
        let h='<table><thead><tr>'+hd.map(c=>'<th>'+inline(esc(c))+'</th>').join('')+'</tr></thead><tbody>';
        rows.forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+inline(esc(c))+'</td>').join('')+'</tr>';});
        out.push(h+'</tbody></table>');
      }
      continue;
    }
    if (line.trim()==='') { i++; continue; }
    const para=[];
    while(i<ph.length){
      const pl=ph[i];
      if(pl.trim()===''||pl.match(/^\x00B\d+\x00$/)||pl.match(/^#{1,4}\s/)||
         pl.match(/^---+\s*$/)||pl.match(/^>\s/)||pl.match(/^[-*]\s+/)||
         pl.match(/^\d+\.\s+/)||pl.match(/^\|/)) break;
      para.push(inline(esc(pl))); i++;
    }
    if(para.length) out.push('<p>'+para.join(' ')+'</p>');
  }
  return out.join('\n');
}

const CONTENT = {

intro: `# Meso — 流式 LLM 对话 UI 平台

Meso 是一个**前端平台层**，专为构建流式 LLM 对话应用而设计。它提供三件事：

- **SSE 事件协议 v1.0**：版本化、可机器验证的流式通信契约
- **\`@meso/ui\` React 组件库**：开箱即用的流式对话 UI
- **\`@meso/types\` 纯运行时**：状态机 / 解析器，无 React 依赖

平台**不包含**：业务后端、鉴权、会话持久化、Tools 执行、知识库检索。这些由你的应用实现。

---

## 平台边界

\`\`\`
你的应用          后端 API / 业务逻辑 / 鉴权 / 数据库
    ↕ SSE 协议 v1.0（streaming-protocol.md 定义）
@meso/ui          ThreeColumnLayout / MessageList / ArtifactPanel / …
@meso/types       parseSSELine / applyEvent / createInitialStreamState
meso-tokens.css   CSS 变量（亮色 / 暗色双主题）
\`\`\`

---

## 一个完整对话轮次的流程

用户发送一条消息，后端 SSE 流返回以下事件序列，平台实时渲染：

\`\`\`
→ stage   {"name":"召回记忆","state":"active"}    → StageTimeline 出现旋转动画
→ stage   {"name":"召回记忆","state":"done"}      → 对号打上
→ memory  {"snippets":[{"category":"pref","content":"偏好 TypeScript"}]}
                                                   → Memory 芯片出现
→ stage   {"name":"生成回复","state":"active"}
→ think   {"delta":"用户想要…","done":false}      → ThinkBlock 展开，逐字流入
→ think   {"delta":"","done":true}                → 自动折叠
→ text    {"delta":"以下是"}                       → ChatBubble 出现光标
→ text    {"delta":"代码示例："}
→ artifact{"id":"a1","lang":"python","delta":"def hello():","done":false}
                                                   → ArtifactPanel 从右侧滑入
→ artifact{"id":"a1","lang":"python","delta":"","done":true}
→ done    {}                                       → 光标消失，状态变 done
\`\`\`

每条事件对应 UI 中具体的动画和状态变化，"等待"被彻底消除。

---

## 包结构

| 包 / 路径 | 用途 | React 依赖 |
|-----------|------|-----------|
| \`@meso/ui\` | 全部 React 组件 + Hook + 类型 | ✅ 需要 |
| \`@meso/ui/runtime\` | 同 @meso/types，便捷路径 | ❌ 无需 |
| \`@meso/types\` | 协议类型 + 纯运行时函数 | ❌ 无需 |
| \`@meso/ui/tokens.css\` | CSS 设计 token | — |

\`@meso/types\` 可在 Node.js、测试环境、边缘函数中使用，用于验证后端 SSE 输出是否合规。

---

## 验收标准（自测清单）

接入完成后，你的应用应当满足：

- [ ] 发送消息后 **立即** 出现 StageTimeline（不是等 LLM 回复后才出现）
- [ ] ThinkBlock 在推理时展开，收到 \`done:true\` 后 1.5s 自动折叠
- [ ] 正文逐字流入，末尾显示闪烁光标 ▋
- [ ] Artifact 面板在首个 artifact 事件到达时从右侧滑入
- [ ] 收到 \`done\` 事件后光标消失，状态回到可再次发送
- [ ] 窄屏（≤900px）会话列隐藏，极窄屏（≤600px）侧栏自动折叠
- [ ] 明/暗主题切换无 FOUC 闪烁
- [ ] 第三方扩展事件通过 \`renderExtension\` 渲染，无需改平台代码`,

// ──────────────────────────────────────────────────────────────────────────────
quickstart: `# 快速接入

从安装到跑通首轮流式对话，预计 **1–2 天**。

## 步骤一：安装

\`\`\`bash
npm install @meso/ui
# 或
yarn add @meso/ui
\`\`\`

peerDependencies：\`react >= 18\`，\`react-dom >= 18\`

---

## 步骤二：引入 CSS token + FOUC 防护

**在 \`index.html\` 的 \`<head>\` 最顶部**，顺序很重要：

\`\`\`html
<head>
  <!-- 1. FOUC 防护脚本：读取上次主题，避免页面闪白/闪黑 -->
  <script>
    (function(){
      var t = localStorage.getItem('meso-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  <\/script>

  <!-- 2. 设计 token（必须在 FOUC 脚本之后） -->
  <link rel="stylesheet" href="node_modules/@meso/ui/dist/tokens.css" />
<\/head>
\`\`\`

**Vite 项目** 改在 \`main.tsx\` 中 import（FOUC 脚本仍需留在 HTML）：

\`\`\`tsx
// main.tsx
import '@meso/ui/tokens.css'
import React from 'react'
import ReactDOM from 'react-dom/client'
import App from './App'

ReactDOM.createRoot(document.getElementById('root')!).render(<App />)
\`\`\`

---

## 步骤三：三栏布局

\`\`\`tsx
// App.tsx
import { ThreeColumnLayout, useTheme } from '@meso/ui'

const navItems = [
  {
    id: 'chat',
    label: '对话',
    icon: <ChatIcon />,
    onClick: () => setPage('chat'),
    active: page === 'chat',
  },
]

export function App() {
  const { theme, toggle } = useTheme()

  return (
    <ThreeColumnLayout
      appName="My App"
      navItems={navItems}
      sessionColumn={<SessionList />}  {/* 可选 */}
    >
      <ChatPage />
    </ThreeColumnLayout>
  )
}
\`\`\`

---

## 步骤四：接入 SSE 流

\`\`\`tsx
// ChatPage.tsx
import { useSSEStream, MessageList } from '@meso/ui'
import { useState, useEffect } from 'react'

export function ChatPage() {
  const { state, start, abort, reset } = useSSEStream('https://your-backend/stream')
  const [messages, setMessages] = useState([])
  const [input, setInput]       = useState('')

  const handleSend = () => {
    if (!input.trim() || state.status === 'streaming') return
    // 将用户消息加入历史
    setMessages(prev => [...prev, { id: Date.now().toString(), role: 'user', content: input }])
    // 发起 SSE 请求
    start({
      method: 'POST',
      body: { message: input, session_id: currentSessionId },
      headers: { Authorization: \`Bearer \${token}\` },
    })
    setInput('')
  }

  // 流结束后将 AI 回复追加到历史
  useEffect(() => {
    if (state.status === 'done' && state.textContent) {
      setMessages(prev => [
        ...prev,
        { id: Date.now().toString(), role: 'assistant', content: state.textContent },
      ])
      reset()
    }
  }, [state.status])

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <MessageList
        messages={messages}
        streaming={state}
        emptyState={<p style={{ textAlign: 'center', color: 'var(--color-text-muted)' }}>发送消息开始对话</p>}
      />

      {/* Composer — 由应用自行实现 */}
      <div style={{ padding: '12px 16px', borderTop: '1px solid var(--color-border)' }}>
        <textarea
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }}}
          placeholder="输入消息… (Enter 发送)"
          style={{
            width: '100%', resize: 'none', border: '1px solid var(--color-border)',
            borderRadius: 8, padding: '8px 12px', background: 'var(--color-bg-white)',
            color: 'var(--color-text)', fontFamily: 'inherit', fontSize: 14,
          }}
        />
        <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
          <button
            onClick={handleSend}
            disabled={state.status === 'streaming'}
            style={{ background: 'var(--color-accent)', color: '#fff', border: 'none', borderRadius: 6, padding: '6px 16px', cursor: 'pointer' }}
          >
            {state.status === 'streaming' ? '生成中…' : '发送'}
          </button>
          {state.status === 'streaming' && (
            <button onClick={abort} style={{ border: '1px solid var(--color-border)', borderRadius: 6, padding: '6px 12px', cursor: 'pointer', background: 'transparent', color: 'var(--color-text)' }}>
              停止
            </button>
          )}
        </div>
      </div>
    </div>
  )
}
\`\`\`

---

## 步骤五：后端发送 SSE（示例）

你的后端用任何语言实现，只需遵守协议格式：

\`\`\`python
# Python / FastAPI 示例（non-normative）
from fastapi import FastAPI
from fastapi.responses import StreamingResponse
import json

app = FastAPI()

@app.post("/stream")
async def stream(body: dict):
    async def generate():
        # 1. 阶段进度
        yield sse({"type":"stage","schema_version":"1.0",
                   "payload":{"name":"分析中","state":"active"}})
        # 2. 推理过程
        yield sse({"type":"think","schema_version":"1.0",
                   "payload":{"delta":"用户问的是…","done":False}})
        yield sse({"type":"think","schema_version":"1.0",
                   "payload":{"delta":"","done":True}})
        # 3. 正文流式输出
        for chunk in llm_stream(body["message"]):
            yield sse({"type":"text","schema_version":"1.0",
                       "payload":{"delta":chunk}})
        # 4. 完成
        yield sse({"type":"stage","schema_version":"1.0",
                   "payload":{"name":"分析中","state":"done"}})
        yield sse({"type":"done","schema_version":"1.0","payload":{}})

    return StreamingResponse(generate(), media_type="text/event-stream")

def sse(obj): return f"data: {json.dumps(obj, ensure_ascii=False)}\\n\\n"
\`\`\`

---

protocol: `# SSE 协议 v1.0

所有流式事件遵循统一信封格式。这是平台与后端之间的唯一契约。

## 信封格式

\`\`\`
data: {"type":"<event_type>","schema_version":"1.0","payload":{…}}\n\n
\`\`\`

每条 SSE 消息是一行 \`data:\` 开头的 JSON，后跟一个空行。

| 字段 | 类型 | 必填 | 说明 |
|------|------|------|------|
| \`type\` | string | ✅ | 事件类型（见下表）|
| \`schema_version\` | \`"1.0"\` | ✅ | 协议版本，用于破坏性变更路由 |
| \`payload\` | object | ✅ | 事件数据，不可为 null |

> 解析器对缺失 \`schema_version\` 宽容处理，视为 \`"1.0"\`，支持渐进迁移。

---

## 标准事件

### \`stage\` — 流水线阶段进度

\`\`\`json
{"type":"stage","schema_version":"1.0","payload":{"name":"召回记忆","state":"active"}}
{"type":"stage","schema_version":"1.0","payload":{"name":"召回记忆","state":"done"}}
\`\`\`

| payload 字段 | 类型 | 说明 |
|-------------|------|------|
| \`name\` | string | 阶段标签，如"召回记忆"、"检索知识"、"生成回复" |
| \`state\` | \`"active"\|"done"\|"error"\` | 同一 name 的后发事件覆盖前一个 |

**去重规则**：同名 stage 后发覆盖，保留最新状态，渲染时顺序按首次出现。

---

### \`memory\` — 记忆召回结果

\`\`\`json
{"type":"memory","schema_version":"1.0","payload":{
  "snippets":[
    {"category":"preference","content":"偏好 TypeScript，arrow functions"},
    {"category":"project","content":"当前项目使用 React 18 + Vite"}
  ]
}}
\`\`\`

整体替换，非增量。通常在生成正文前发送一次。

---

### \`think\` — 推理过程（增量）

\`\`\`json
{"type":"think","schema_version":"1.0","payload":{"delta":"用户想要一个","done":false}}
{"type":"think","schema_version":"1.0","payload":{"delta":"文件上传组件，","done":false}}
{"type":"think","schema_version":"1.0","payload":{"delta":"","done":true}}
\`\`\`

\`delta\` 追加到 \`thinkContent\`。\`done:true\` 触发 ThinkBlock 自动折叠（1.5s 后）。

---

### \`text\` — 正文（增量）

\`\`\`json
{"type":"text","schema_version":"1.0","payload":{"delta":"以下是代码示例："}}
\`\`\`

\`delta\` 追加到 \`textContent\`，同时触发末尾光标闪烁。

---

### \`artifact\` — 代码/图表/HTML（增量，多 Artifact）

\`\`\`json
{"type":"artifact","schema_version":"1.0","payload":{"id":"a1","lang":"python","delta":"def hello():\n","done":false}}
{"type":"artifact","schema_version":"1.0","payload":{"id":"a1","lang":"python","delta":"    print('hi')\n","done":true}}
\`\`\`

| payload 字段 | 说明 |
|-------------|------|
| \`id\` | 唯一标识，同一 id 的 delta 追加。一次回复可有多个不同 id 的 artifact |
| \`lang\` | 语言/类型。内置识别：\`"html preview"\`（iframe 渲染）、\`"mermaid"\`（图表）、其余视为代码 |
| \`done\` | \`true\` 时触发最终语法高亮 / 图表渲染 |

---

### \`done\` — 流正常结束

\`\`\`json
{"type":"done","schema_version":"1.0","payload":{}}
\`\`\`

与 \`error\` 互斥。收到后 parser 停止处理后续行。

---

### \`error\` — 错误

\`\`\`json
{"type":"error","schema_version":"1.0","payload":{"message":"上游服务超时","code":"UPSTREAM_TIMEOUT"}}
\`\`\`

与 \`done\` 互斥。\`code\` 为机器可读错误码，可选。

---

### \`extension\` — 第三方扩展事件

\`\`\`json
{"type":"extension","schema_version":"1.0","payload":{
  "name":"tool_progress",
  "version":"1.0",
  "data":{"tool":"web_search","status":"running","query":"Meso platform"}
}}
\`\`\`

详见 [扩展事件](#extension) 章节。

---

## 完整序列示例

\`\`\`
data: {"type":"stage","schema_version":"1.0","payload":{"name":"召回记忆","state":"active"}}

data: {"type":"stage","schema_version":"1.0","payload":{"name":"召回记忆","state":"done"}}

data: {"type":"memory","schema_version":"1.0","payload":{"snippets":[{"category":"preference","content":"偏好简洁"}]}}

data: {"type":"stage","schema_version":"1.0","payload":{"name":"生成回复","state":"active"}}

data: {"type":"think","schema_version":"1.0","payload":{"delta":"用户问的是…","done":false}}

data: {"type":"think","schema_version":"1.0","payload":{"delta":"","done":true}}

data: {"type":"text","schema_version":"1.0","payload":{"delta":"根据你的需求，"}}

data: {"type":"text","schema_version":"1.0","payload":{"delta":"以下是代码："}}

data: {"type":"artifact","schema_version":"1.0","payload":{"id":"a1","lang":"python","delta":"def hello():\n    print('hi')\n","done":true}}

data: {"type":"stage","schema_version":"1.0","payload":{"name":"生成回复","state":"done"}}

data: {"type":"done","schema_version":"1.0","payload":{}}
\`\`\`

---

## parseSSELine 行为规范

\`@meso/ui/runtime\` 导出的 \`parseSSELine(line)\` 函数处理以下情况：

| 输入 | 返回 | 说明 |
|------|------|------|
| \`"data: {...}"\` | \`SSEEvent\` | 正常解析 |
| \`"data: [DONE]"\` | \`DoneEvent\` | OpenAI 兼容 sentinel |
| \`""\`（空行）| \`null\` | SSE 分隔符，跳过 |
| \`": comment"\` | \`null\` | SSE 注释，跳过 |
| \`"data: {invalid"\` | \`null\` | 非法 JSON，跳过 |
| 缺少 \`payload\` 字段 | \`null\` | 结构不合规，跳过 |
| 缺少 \`schema_version\` | \`SSEEvent\`（补充为 1.0）| 宽容迁移 |

---

## 用 @meso/types 验证你的后端

无需浏览器和 React，在 Node.js 中直接验证 SSE 输出：

\`\`\`typescript
import { parseSSELine, applyEvent, createInitialStreamState } from '@meso/types'

const sseOutput = \`
data: {"type":"text","schema_version":"1.0","payload":{"delta":"hello"}}

data: {"type":"done","schema_version":"1.0","payload":{}}
\`.trim()

const finalState = sseOutput.split('\\n').reduce((state, line) => {
  const event = parseSSELine(line)
  return event ? applyEvent(state, event) : state
}, { ...createInitialStreamState(), status: 'streaming' })

console.log(finalState.textContent)  // "hello"
console.log(finalState.status)       // "done"
\`\`\`

也可以用平台提供的 [契约 fixture 文件](../packages/meso-types/src/__fixtures__/) 跑完整测试。`,

// ──────────────────────────────────────────────────────────────────────────────
streaming: `# 流式 UI

平台组件如何响应 SSE 事件并呈现流式交互体验。

## MessageList：一站式流式渲染

\`MessageList\` 是最核心的组件，同时接受已完成的历史消息和实时流式状态：

\`\`\`tsx
import { useSSEStream, MessageList } from '@meso/ui'

function ChatArea() {
  const { state, start, abort, reset } = useSSEStream('/api/stream')
  const [messages, setMessages] = useState([])

  return (
    <MessageList
      messages={messages}            // 历史完成轮次
      streaming={state}             // 当前流式状态（idle 时传 undefined）
      emptyState={<EmptyPrompt />}  // 无消息时的占位
      renderExtension={(event) => { // 可选：渲染第三方扩展事件
        if (event.payload.name === 'tool_progress') {
          return <ToolCard data={event.payload.data} />
        }
      }}
    />
  )
}
\`\`\`

MessageList 在 \`streaming.status !== 'idle'\` 时自动在底部渲染实时区域，包含：
- **StageTimeline**（有未完成 stage 时）
- **Memory 芯片**（收到 memory 事件时）
- **扩展事件区域**（有 extensionLog 且提供了 renderExtension 时）
- **ThinkBlock**（有 thinkContent 时）
- **ChatBubble**（AI 正文，含流式光标）
- **ArtifactPanel**（有 artifact 时，按 artifactOrder 顺序）

---

## ThinkBlock — 推理折叠块

\`\`\`tsx
import { ThinkBlock } from '@meso/ui'

<ThinkBlock
  content={state.thinkContent}          // 当前推理文本
  streaming={!state.thinkDone}          // true = 仍在流式输出
  autoCollapseDelay={1500}              // 默认 1500ms，done 后自动折叠
/>
\`\`\`

**生命周期：**

\`\`\`
think delta 到达 → ThinkBlock 展开，逐字追加，显示光标
think done:true  → streaming=false，等待 autoCollapseDelay ms
折叠动画触发     → max-height 0 → content height，300ms ease
用户点击标题     → 随时切换展开/折叠，优先级高于自动折叠
\`\`\`

---

## ArtifactPanel — 代码/图表/HTML 面板

\`\`\`tsx
import { ArtifactPanel } from '@meso/ui'

// 单个 artifact（从 streaming.artifacts 和 artifactOrder 取）
{streaming.artifactOrder.map(id => {
  const art = streaming.artifacts[id]
  return (
    <ArtifactPanel
      key={id}
      type={langToType(art.lang)}   // 'code' | 'html' | 'mermaid'
      content={art.content}
      language={art.lang}           // 代码语言（type='code' 时）
      streaming={!art.done}         // 仍在接收 delta
      onCopy={text => navigator.clipboard.writeText(text)}
      onDownload={text => triggerDownload(text, art.lang)}
    />
  )
})}
\`\`\`

\`lang\` 到 \`type\` 的映射规则：

| \`lang\` 值 | \`type\` | 渲染方式 |
|------------|---------|---------|
| \`"html preview"\` | \`"html"\` | sandbox iframe |
| \`"mermaid"\` | \`"mermaid"\` | SVG 流程图 |
| 其他（python、tsx…）| \`"code"\` | 代码高亮 |

---

## StageTimeline — 阶段进度

\`\`\`tsx
import { StageTimeline } from '@meso/ui'

<StageTimeline
  stages={streaming.stages.map(s => ({
    id: s.name,
    label: s.name,
    status: s.state === 'done' ? 'done' : 'active',
  }))}
  compact={false}   // true = 单行紧凑显示
/>
\`\`\`

全部 stage 变为 done 后，1.5s 自动折叠（\`MessageList\` 内置处理）。

---

## StreamState 字段速查

\`useSSEStream\` 返回的 \`state\` 对象完整字段：

\`\`\`typescript
interface StreamState {
  status:       'idle' | 'streaming' | 'done' | 'error'
  stages:       Array<{ name: string; state: 'active'|'done'|'error' }>
  memorySnippets: Array<{ category: string; content: string }>
  thinkContent: string    // 累积推理文本
  thinkDone:    boolean   // 收到 think done:true
  textContent:  string    // 累积正文
  artifacts:    Record<string, { id:string; lang:string; content:string; done:boolean }>
  artifactOrder: string[] // artifact id 按首次出现顺序
  extensions:   Record<string, ExtensionEvent[]>  // 按 name 分桶
  extensionLog: ExtensionEvent[]                  // 按到达顺序
  errorMessage: string | null
}
\`\`\`

---

## 完整示例：手动组合组件

如果不用 \`MessageList\`，可以手动组合各组件：

\`\`\`tsx
const { state, start, abort } = useSSEStream('/api/stream')

return (
  <div>
    {/* 已完成轮次 */}
    {messages.map(m => <ChatBubble key={m.id} role={m.role} content={m.content} />)}

    {/* 流式实时区域 */}
    {state.status !== 'idle' && (
      <div>
        {state.stages.length > 0 && (
          <StageTimeline
            stages={state.stages.map(s => ({ id: s.name, label: s.name, status: s.state === 'done' ? 'done' : 'active' }))}
          />
        )}

        {state.memorySnippets.length > 0 && (
          <div className="memory-chips">
            {state.memorySnippets.map((s, i) => (
              <span key={i} className="chip">[{s.category}] {s.content}</span>
            ))}
          </div>
        )}

        {state.thinkContent && (
          <ThinkBlock content={state.thinkContent} streaming={!state.thinkDone} />
        )}

        <ChatBubble
          role="assistant"
          content={state.textContent}
          streaming={state.status === 'streaming'}
        />

        {state.artifactOrder.map(id => {
          const art = state.artifacts[id]
          const type = art.lang === 'html preview' ? 'html' : art.lang === 'mermaid' ? 'mermaid' : 'code'
          return <ArtifactPanel key={id} type={type} content={art.content} language={art.lang} streaming={!art.done} />
        })}

        {state.status === 'error' && (
          <p style={{color:'var(--color-error)'}}>错误：{state.errorMessage}</p>
        )}
      </div>
    )}

    {/* 控制按钮 */}
    <button onClick={() => start({ method:'POST', body:{ message: input } })}
            disabled={state.status === 'streaming'}>发送</button>
    {state.status === 'streaming' && <button onClick={abort}>停止</button>}
  </div>
)
\`\`\``,

extension: `# 扩展事件

第三方后端通过扩展事件传递业务语义，无需修改平台源码。

## 为什么需要扩展事件

平台内置 7 个标准事件，但业务场景几乎必然有更多需求：

| 业务需求 | 扩展事件名建议 |
|----------|---------------|
| 工具调用进度（搜索、代码执行…）| \`tool_progress\` |
| 需要用户确认才能继续 | \`confirm_gate\` |
| 引用业务实体（文档、工单…）| \`entity_reference\` |
| 更新会话标题/标签 | \`session_meta\` |

---

## 后端发送扩展事件

\`\`\`python
# 工具调用开始
yield sse({"type":"extension","schema_version":"1.0","payload":{
    "name": "tool_progress",
    "version": "1.0",
    "data": {"tool": "web_search", "status": "running", "query": "Meso platform"}
}})

# 工具调用完成
yield sse({"type":"extension","schema_version":"1.0","payload":{
    "name": "tool_progress",
    "version": "1.0",
    "data": {"tool": "web_search", "status": "done", "results": 5}
}})

# 继续正文
yield sse({"type":"text","schema_version":"1.0","payload":{"delta":"搜索到以下结果…"}})
\`\`\`

---

## 前端渲染扩展事件

通过 \`MessageList\` 的 \`renderExtension\` prop，按到达顺序渲染：

\`\`\`tsx
import type { ExtensionEvent } from '@meso/ui'

<MessageList
  messages={messages}
  streaming={state}
  renderExtension={(event: ExtensionEvent) => {
    const { name, data } = event.payload

    if (name === 'tool_progress') {
      const d = data as { tool: string; status: string; query?: string }
      return (
        <div style={{
          padding: '8px 12px', margin: '4px 0',
          background: 'var(--color-bg-elevated)',
          borderRadius: 8, border: '1px solid var(--color-border)',
          fontSize: 13, color: 'var(--color-text-secondary)'
        }}>
          🔍 {d.status === 'running' ? \`正在搜索：\${d.query}\` : \`搜索完成（\${(d as any).results} 条结果）\`}
        </div>
      )
    }

    if (name === 'confirm_gate') {
      const d = data as { prompt: string; action: string }
      return (
        <div style={{ padding: 12, background: 'rgba(180,83,9,0.08)', borderRadius: 8, border: '1px solid var(--color-warning)' }}>
          <p style={{ marginBottom: 8, color: 'var(--color-text)' }}>{d.prompt}</p>
          <button
            onClick={() => confirmAction(d.action)}
            style={{ background: 'var(--color-accent)', color: '#fff', border: 'none', borderRadius: 6, padding: '6px 14px', cursor: 'pointer' }}
          >
            确认执行
          </button>
        </div>
      )
    }

    return null  // 未知扩展静默忽略
  }}
/>
\`\`\`

---

## 时序：extensionLog vs extensions

StreamState 同时维护两种视图：

\`\`\`typescript
// 按到达顺序（用于渲染）
state.extensionLog
// → [tool_progress(running), tool_progress(done), entity_ref(...)]

// 按名称分桶（用于查询）
state.extensions['tool_progress']
// → [event(running), event(done)]

state.extensions['tool_progress'].at(-1)?.payload.data
// → { status: 'done', results: 5 }   ← 最新状态
\`\`\`

**选择哪个：**

- **渲染时** → 用 \`extensionLog\`，保证事件按时间顺序展示（\`renderExtension\` 内部已用这个）
- **查询状态** → 用 \`extensions[name]\`，取最后一个即为当前状态

---

## 历史消息中的扩展 UI

> **平台约定（normative）**：扩展事件仅在当前流式轮次展示。平台不持久化扩展事件，不负责在历史轮次中重现扩展 UI。

**推荐模式 A：落库时折叠为 metadata**

\`\`\`typescript
// 流结束后，应用自行存储需要保留的扩展信息
useEffect(() => {
  if (state.status === 'done') {
    const msg = {
      id: uuid(),
      role: 'assistant',
      content: state.textContent,
      metadata: {
        toolCalls: state.extensions['tool_progress']?.map(e => e.payload.data) ?? [],
      }
    }
    setMessages(prev => [...prev, msg])
    reset()
  }
}, [state.status])

// 渲染历史时，在气泡下方显示工具调用摘要
{messages.map(m => (
  <div key={m.id}>
    <ChatBubble role={m.role} content={m.content} />
    {m.metadata?.toolCalls?.length > 0 && (
      <ToolCallSummary calls={m.metadata.toolCalls} />
    )}
  </div>
))}
\`\`\`

**推荐模式 B：一次性 UI（不保留）**

对于确认门禁等单次操作，流结束后 UI 随 StreamState 重置自然消失，无需特殊处理。

---

## 在 Node.js 中验证扩展事件

\`\`\`typescript
import { parseSSELine, applyEvent, createInitialStreamState } from '@meso/types'

const lines = [
  'data: {"type":"extension","schema_version":"1.0","payload":{"name":"tool_progress","data":{"status":"running"}}}',
  'data: {"type":"extension","schema_version":"1.0","payload":{"name":"tool_progress","data":{"status":"done","results":3}}}',
  'data: {"type":"done","schema_version":"1.0","payload":{}}',
]

const state = lines.reduce((s, line) => {
  const event = parseSSELine(line)
  return event ? applyEvent(s, event) : s
}, { ...createInitialStreamState(), status: 'streaming' })

console.log(state.extensionLog.length)           // 2
console.log(state.extensions['tool_progress'])   // [event1, event2]
console.log(state.status)                        // 'done'
\`\`\``,

components: `# 组件 API

\`@meso/ui\` 导出以下组件和 Hook，所有组件支持明/暗主题。

## ThreeColumnLayout

三栏应用壳，仅提供槽位，不内置任何业务导航项。

\`\`\`tsx
import { ThreeColumnLayout } from '@meso/ui'

<ThreeColumnLayout
  appName="My App"
  navItems={[
    { id: 'chat', label: '对话', icon: <ChatIcon />, onClick: () => {}, active: true },
    { id: 'docs', label: '文档', icon: <DocsIcon />, onClick: () => {} },
  ]}
  sessionColumn={<SessionList />}   // 中栏，可选
  defaultCollapsed={false}          // 侧栏初始状态
>
  <MainContent />                   // 右栏主内容
</ThreeColumnLayout>
\`\`\`

### ThreeColumnLayoutProps

| Prop | 类型 | 默认 | 说明 |
|------|------|------|------|
| \`navItems\` | \`NavItem[]\` | \`[]\` | 左侧导航项，完全由应用提供 |
| \`sessionColumn\` | \`ReactNode\` | — | 中间会话列表区 |
| \`children\` | \`ReactNode\` | 必填 | 主内容区 |
| \`appName\` | \`string\` | \`'Meso'\` | 侧栏顶部品牌名 |
| \`logo\` | \`ReactNode\` | — | 自定义 Logo |
| \`footerSlot\` | \`ReactNode\` | — | 侧栏底部（用户头像、设置等）|
| \`defaultCollapsed\` | \`boolean\` | \`false\` | 侧栏初始折叠状态 |

### NavItem 接口

\`\`\`typescript
interface NavItem {
  id:       string
  label:    string
  icon:     React.ReactNode   // 建议 16×16 SVG stroke 图标
  onClick?: () => void
  active?:  boolean
  tooltip?: string            // 折叠状态下的悬停提示
}
\`\`\`

---

## MessageList

多轮对话渲染组件，合并历史消息与实时流式状态。

\`\`\`tsx
import { MessageList } from '@meso/ui'
import type { Message } from '@meso/ui'

const messages: Message[] = [
  { id: '1', role: 'user',      content: '帮我写一个排序算法' },
  { id: '2', role: 'assistant', content: '好的，以下是快速排序…' },
]

<MessageList
  messages={messages}
  streaming={state}           // 来自 useSSEStream，idle 时省略
  emptyState={<Prompt />}
  renderExtension={handler}   // 可选，渲染扩展事件
  onArtifactCopy={text => {}} // 可选
  onArtifactDownload={text=>{}} // 可选
/>
\`\`\`

### MessageListProps

| Prop | 类型 | 说明 |
|------|------|------|
| \`messages\` | \`Message[]\` | 完成的历史轮次 |
| \`streaming\` | \`StreamState\` | 实时流式状态；idle 时不传 |
| \`emptyState\` | \`ReactNode\` | 无内容时的占位 |
| \`renderExtension\` | \`(e: ExtensionEvent) => ReactNode\` | 扩展事件渲染插槽 |
| \`onArtifactCopy\` | \`(content: string) => void\` | Artifact 复制回调 |
| \`onArtifactDownload\` | \`(content: string) => void\` | Artifact 下载回调 |

---

## ChatBubble

单条消息气泡，支持 Markdown 渲染和流式光标。

\`\`\`tsx
// 用户消息
<ChatBubble role="user" content="帮我写一个排序算法" />

// AI 流式回复（含光标）
<ChatBubble role="assistant" content={state.textContent} streaming={state.status === 'streaming'} />

// 已完成的 AI 回复
<ChatBubble role="assistant" content="以下是快速排序…" timestamp="10:32" />
\`\`\`

| Prop | 类型 | 默认 | 说明 |
|------|------|------|------|
| \`role\` | \`'user'\|'assistant'\` | 必填 | 决定气泡方向和颜色 |
| \`content\` | \`string\` | 必填 | 消息文本（支持 Markdown）|
| \`streaming\` | \`boolean\` | \`false\` | \`true\` 时在末尾显示闪烁光标 |
| \`timestamp\` | \`string\` | — | 消息时间，显示在气泡下方 |

---

## ThinkBlock

可折叠推理过程块。

\`\`\`tsx
<ThinkBlock
  content={state.thinkContent}      // 当前推理文本
  streaming={!state.thinkDone}      // 仍在流式输出时为 true
  autoCollapseDelay={1500}          // done 后多久自动折叠（ms）
/>
\`\`\`

| Prop | 类型 | 默认 | 说明 |
|------|------|------|------|
| \`content\` | \`string\` | 必填 | 推理文本 |
| \`streaming\` | \`boolean\` | \`false\` | \`true\` 时显示光标，禁止折叠动画 |
| \`autoCollapseDelay\` | \`number\` | \`1500\` | 流式结束后自动折叠等待时间（ms）|

---

## StageTimeline

流水线阶段进度时间轴。

\`\`\`tsx
<StageTimeline
  stages={state.stages.map(s => ({
    id: s.name,
    label: s.name,
    status: s.state === 'done' ? 'done' : 'active',
  }))}
  compact={false}
/>
\`\`\`

| Stage.status | 显示 |
|-------------|------|
| \`'pending'\` | 灰色空心点 |
| \`'active'\` | 旋转动画点 + accent 色文字 |
| \`'done'\` | 绿色对号点 + 次要色文字 |

---

## ArtifactPanel

代码/HTML 预览/Mermaid 图表面板，含复制和下载按钮。

\`\`\`tsx
<ArtifactPanel
  type="code"
  content={art.content}
  language="python"
  streaming={!art.done}
  onCopy={text => navigator.clipboard.writeText(text)}
/>
\`\`\`

| Prop | 类型 | 说明 |
|------|------|------|
| \`type\` | \`'code'\|'html'\|'mermaid'\` | 渲染方式 |
| \`content\` | \`string\` | 内容文本 |
| \`language\` | \`string\` | 代码语言（type=code 时用于高亮）|
| \`streaming\` | \`boolean\` | \`true\` 时显示"生成中"标识 |
| \`onCopy\` | \`(content: string) => void\` | 复制按钮回调 |
| \`onDownload\` | \`(content: string) => void\` | 自定义下载逻辑 |

---

## useSSEStream

核心流式请求 Hook。

\`\`\`typescript
const { state, start, abort, reset } = useSSEStream(url: string)
\`\`\`

| 返回值 | 类型 | 说明 |
|--------|------|------|
| \`state\` | \`StreamState\` | 当前流式状态（见流式 UI 章节）|
| \`start(options?)\` | \`(options?: StreamOptions) => void\` | 发起请求 |
| \`abort()\` | \`() => void\` | 中止当前流，状态变 idle |
| \`reset()\` | \`() => void\` | 重置所有状态到 idle 初始值 |

### StreamOptions

\`\`\`typescript
interface StreamOptions {
  method?:  'GET' | 'POST'               // 默认：有 body 时 POST，否则 GET
  headers?: Record<string, string>       // 自定义请求头（Authorization 等）
  body?:    Record<string, unknown>      // POST body，自动序列化为 JSON
}
\`\`\`

---

## useTheme

主题管理 Hook。

\`\`\`typescript
const { theme, toggle } = useTheme()
// theme: 'light' | 'dark'
// toggle(): 切换主题并写入 localStorage（key: 'meso-theme'）
\`\`\`

---

## StreamingCursor

独立光标组件（MessageList 内部已使用，一般不需要单独使用）。

\`\`\`tsx
<StreamingCursor active={state.status === 'streaming'} />
\`\`\``,

layout: `# 布局规范

Meso 采用固定的三栏结构，所有尺寸通过 CSS 变量控制。

## 三栏尺寸

| 区域 | 默认值 | CSS 变量 | 折叠/隐藏 |
|------|--------|----------|-----------|
| 左侧导航栏 | 145px | \`--sidebar-w\` | 52px（\`--sidebar-w-collapsed\`）|
| 会话列表栏 | 260px | \`--session-col-w\` | ≤900px 自动隐藏 |
| 主内容区 | flex: 1 | — | — |
| 顶栏高度 | 52px | — | — |

---

## 响应式断点

| 屏宽 | 行为 |
|------|------|
| > 900px | 三栏全显 |
| ≤ 900px | 会话列表栏隐藏 |
| ≤ 600px | 侧栏自动折叠到 52px |

---

## 侧栏折叠动画

\`\`\`css
.meso-layout__sidebar {
  width: var(--sidebar-w);
  transition: width 0.2s ease, min-width 0.2s ease;
  overflow: hidden;
}
.meso-layout__sidebar--collapsed {
  width: var(--sidebar-w-collapsed);
  min-width: var(--sidebar-w-collapsed);
}
\`\`\`

折叠时：导航文字 \`opacity: 0\`，图标居中，tooltip 提供悬停说明。

---

## 各栏内部结构（参考）

\`\`\`
┌──────────────────────────────────────────────────────┐
│ 52px topbar（应用侧自定义，或留空）                    │
├──────────┬────────────────┬───────────────────────────┤
│ 145px    │ 260px          │ flex:1                    │
│          │                │                           │
│ 应用图标 │ 会话列表        │  主内容区                  │
│ 导航项   │  搜索           │  （聊天区 / Artifact 面板）│
│          │  会话 item      │                           │
│          │  ...            │                           │
│          │                │                           │
│ 用户区   │                │                           │
└──────────┴────────────────┴───────────────────────────┘
\`\`\`

---

## 圆角规范

| 元素 | 圆角 |
|------|------|
| 导航项、会话项 | 6px |
| 输入框、搜索框 | 8px |
| 消息气泡、卡片 | 10px |
| Artifact 面板 | 12px |
| Tooltip | 6px |

---

## Composer（输入区）

> **平台约定**：Meso 不提供 Composer 组件，输入区由应用自行实现。

原因：工具栏按钮（附件、知识库、工具开关）因应用而异，固定实现反而成为障碍。平台提供 CSS token 让自定义 Composer 与整体视觉一致。

\`\`\`tsx
// 应用自实现 Composer 示例
function Composer({ onSend, disabled }) {
  const [text, setText] = useState('')
  return (
    <div style={{
      padding: '12px 16px',
      borderTop: '1px solid var(--color-border)',
      background: 'var(--color-bg)',
    }}>
      <textarea
        value={text}
        onChange={e => setText(e.target.value)}
        style={{
          width: '100%', resize: 'none',
          border: '1px solid var(--color-border)',
          borderRadius: 8, padding: '8px 12px',
          background: 'var(--color-bg-white)',
          color: 'var(--color-text)',
        }}
      />
      <button
        onClick={() => { onSend(text); setText('') }}
        disabled={disabled}
        style={{ background: 'var(--color-accent)', color: '#fff', border: 'none', borderRadius: 6, padding: '6px 16px' }}
      >
        发送
      </button>
    </div>
  )
}
\`\`\`

[布局演示](demo:02-layout.html)`,

tokens: `# 设计系统

所有视觉 token 来自 \`@meso/ui/tokens.css\`，双主题通过 \`data-theme\` 属性切换。

## 引入方式

\`\`\`html
<!-- HTML -->
<link rel="stylesheet" href="node_modules/@meso/ui/dist/tokens.css" />
\`\`\`

\`\`\`tsx
// main.tsx（Vite / Next.js）
import '@meso/ui/tokens.css'
\`\`\`

---

## FOUC 防护（必须）

在 \`tokens.css\` 加载 **之前** 放置此脚本，防止主题切换时的闪烁：

\`\`\`html
<script>
  (function(){
    var t = localStorage.getItem('meso-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
<\/script>
\`\`\`

---

## 主题切换

\`\`\`typescript
// 手动切换（如果不用 useTheme Hook）
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark'
    ? 'light' : 'dark'
  document.documentElement.setAttribute('data-theme', next)
  localStorage.setItem('meso-theme', next)
}

// 使用 useTheme Hook（推荐）
const { theme, toggle } = useTheme()
// theme: 'light' | 'dark'
// toggle(): 自动处理 DOM 和 localStorage
\`\`\`

memory: `# 记忆系统

Meso 的记忆系统分两层，在每次对话前自动召回相关内容注入系统提示。

> **注意**：记忆系统是平台参考实现，不属于 \`@meso/ui\` 的 API 契约。第三方可使用任意存储方案，只需后端在 SSE 流中发送 \`memory\` 事件即可。

---

## 架构

\`\`\`
用户发送消息
     ↓
[ 短期记忆召回 ]  ~/.llm-platform/sessions/<id>.json
[ 长期记忆召回 ]  ~/.llm-platform/memory/*.md
     ↓ 混合排序（BM25 + 向量相似度）
Top-K 片段注入 system prompt
     ↓
memory 事件 → UI 显示 Memory 芯片
     ↓
LLM 生成 → 流式输出
\`\`\`

---

## 短期记忆

- **存储**：\`~/.llm-platform/sessions/<session-id>.json\`
- **内容**：完整消息历史 + 当前会话摘要
- **自动摘要**：超过 20 轮时旧消息压缩为摘要节省 token
- **生命周期**：关闭会话后保留 30 天

\`\`\`json
{
  "id": "sess_abc123",
  "appId": "doc-review",
  "createdAt": "2024-01-15T10:00:00Z",
  "summary": "用户在审查一份劳动合同，重点关注第5条保密条款…",
  "messages": [
    {"role": "user",      "content": "帮我看看第5条有没有问题"},
    {"role": "assistant", "content": "第5条保密义务范围较宽…"}
  ]
}
\`\`\`

---

## 长期记忆

- **存储**：\`~/.llm-platform/memory/\`（可配置为 Obsidian Vault 路径）
- **格式**：Markdown 文件，YAML frontmatter 元数据

\`\`\`markdown
---
category: preference
created: 2024-01-15
source: session_abc123
---

# 用户偏好 · 代码风格

用户偏好 TypeScript，使用 arrow functions，不喜欢 class 语法。
缩进 2 个空格，文件使用 kebab-case 命名。
\`\`\`

## 召回与注入

召回时并行执行两路检索，合并排序取 Top-K：

| 方式 | 算法 | 默认权重 |
|------|------|---------|
| 关键词匹配 | BM25 | 40% |
| 语义相似度 | 向量余弦相似度 | 60% |

注入到 system prompt 末尾：

\`\`\`
--- 相关记忆 ---
[preference] 偏好 TypeScript，arrow functions，2空格缩进
[project]    AI-KA 项目，处理法律合同，PostgreSQL 数据库
---
\`\`\`

## Memory Chips UI

后端发送 \`memory\` 事件后，平台在流式区域顶部显示记忆芯片：

\`\`\`json
{"type":"memory","schema_version":"1.0","payload":{
  "snippets":[
    {"category":"preference","content":"偏好 TypeScript"},
    {"category":"project","content":"使用 PostgreSQL 15"}
  ]
}}
\`\`\`

渲染结果：

\`\`\`
[preference] 偏好 TypeScript    [project] 使用 PostgreSQL 15
\`\`\`

平台展示 \`[category] content\` 格式，hover 可展开完整内容。

## App Manifest 记忆配置

\`\`\`json
{
  "memory": {
    "recallTopK": 5,
    "autoExtract": true,
    "recallCategories": ["preference", "project", "fact"],
    "autoSaveCategory": "fact",
    "extractPrompt": "从对话中提取值得长期记住的用户偏好或项目事实，一句话描述。"
  }
}
\`\`\`

| 字段 | 说明 |
|------|------|
| \`recallTopK\` | 每次召回最多返回多少条（默认 5）|
| \`autoExtract\` | 对话结束后是否自动提取新记忆（默认 false）|
| \`recallCategories\` | 只召回指定分类的记忆 |
| \`autoSaveCategory\` | 自动提取的记忆归入此分类 |

Meso 通过 App Manifest 支持多应用模式，每个应用有独立的系统提示、工具集、知识库配置。

> **平台边界**：Manifest 描述展示相关字段，Tools 的执行逻辑由第三方后端实现。平台 UI 不执行任何业务逻辑。

---

## 什么是"应用"

一个应用（App）= 一种对话模式：

| 应用 | 系统提示方向 | 工具 | 知识库 |
|------|-------------|------|--------|
| 通用对话 | 通用 AI 助手 | — | — |
| 文档审查 | 专业文档分析 | search_knowledge | legal-templates |
| 代码助手 | 资深工程师 | run_code | engineering-guidelines |
| 数据分析 | 数据科学家 | query_database | — |

用户点击左侧导航图标切换应用，平台重新加载对应 Manifest。

---

## App Manifest 结构

\`\`\`json
{
  "schema_version": "1.0",
  "id": "doc-review",
  "name": "文档审查",
  "icon": "file-search",
  "ui": {
    "composer_placeholder": "上传文档或输入审查要求…",
    "split_mode_default": true,
    "session_col_visible": true
  },
  "skill": {
    "system_prompt": "你是一个专业的合同审查助手，关注法律风险和合规性。",
    "focus_points": [
      {"id": "liability", "name": "责任条款", "prompt": "重点审查责任限制和赔偿条款"}
    ]
  },
  "tools": ["search_knowledge", "extract_entities"],
  "knowledge": {
    "enabled": true,
    "index_dirs": ["legal-templates", "company-policies"],
    "chunk_strategy": "structured"
  },
  "memory": {
    "recall_categories": ["preference", "project"],
    "auto_save_category": "fact",
    "recall_top_k": 5
  }
}
\`\`\`

---

## Manifest 字段说明

### 基础字段

| 字段 | 类型 | 说明 |
|------|------|------|
| \`schema_version\` | \`"1.0"\` | Manifest 版本（与 SSE 协议版本独立）|
| \`id\` | string | URL-safe 唯一标识符 |
| \`name\` | string | 显示名称 |
| \`icon\` | string | 图标名（内置图标集 ID）|

### \`ui\` — 展示相关（平台消费）

| 字段 | 说明 |
|------|------|
| \`composer_placeholder\` | Composer 输入框占位文字 |
| \`split_mode_default\` | 是否默认开启分屏（聊天区 + Artifact 区）|
| \`session_col_visible\` | 是否默认显示会话列表 |

### \`tools\` — 工具声明（后端执行）

只需在 Manifest 中声明工具 ID，平台 UI 展示工具名称，执行逻辑由后端实现：

\`\`\`json
"tools": ["search_knowledge", "extract_entities", "my_custom_tool"]
\`\`\`

工具执行结果通过扩展事件（\`tool_progress\`）推送到前端。

---

## 应用切换流程

\`\`\`
用户点击导航图标
  → 平台加载 manifest.json
  → 重置/恢复会话上下文
  → 更新系统提示（skill.system_prompt）
  → 更新 Composer 配置（ui.composer_placeholder）
  → 重新索引关联知识库
  → UI 头部标题更新为 app.name
\`\`\`

// ──────────────────────────────────────────────────────────────────────────────
// Build nav
// ──────────────────────────────────────────────────────────────────────────────
function buildNav() {
  const list = document.getElementById('help-nav-list');
  list.innerHTML = NAV.map(item => {
    if (item.group) {
      return `<div class="help-nav-group">${item.group}</div>`;
    }
    return `<button class="help-nav-item" data-id="${item.id}" onclick="showSection('${item.id}')">
      <span class="help-nav-icon">${item.icon}</span>
      ${item.label}
    </button>`;
  }).join('');
}

// ──────────────────────────────────────────────────────────────────────────────
// Show section
// ──────────────────────────────────────────────────────────────────────────────
function showSection(id) {
  const content = CONTENT[id];
  if (!content) return;

  document.querySelectorAll('.help-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  document.getElementById('help-content').innerHTML = renderMd(content);
  history.replaceState(null, '', '#' + id);
  document.getElementById('help-main').scrollTop = 0;
}

// ──────────────────────────────────────────────────────────────────────────────
// Search
// ──────────────────────────────────────────────────────────────────────────────
function filterNav(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.help-nav-item[data-id]').forEach(el => {
    const id = el.dataset.id;
    const label = el.textContent.toLowerCase();
    const inContent = CONTENT[id] ? CONTENT[id].toLowerCase().includes(q) : false;
    el.hidden = q !== '' && !label.includes(q) && !inContent;
  });
}

// ──────────────────────────────────────────────────────────────────────────────
// Theme
// ──────────────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('meso-theme', next);
  document.documentElement.setAttribute('data-theme', next);
}

// ──────────────────────────────────────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  const hash = location.hash.replace('#', '');
  const id = CONTENT[hash] ? hash : 'intro';
  showSection(id);
});

window.addEventListener('hashchange', () => {
  const hash = location.hash.replace('#', '');
  if (CONTENT[hash]) showSection(hash);
});
</script>
