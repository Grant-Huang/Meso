<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meso · 帮助文档</title>
  <script>
    (function(){var t=localStorage.getItem('meso-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="stylesheet" href="platform/meso-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.6;
      background: var(--color-bg); color: var(--color-text);
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    /* ── Top bar ── */
    .help-topbar {
      height: 52px; flex-shrink: 0;
      display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-sidebar);
      z-index: 20;
    }
    .help-topbar-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--color-text-secondary);
      text-decoration: none; padding: 4px 10px;
      border-radius: 6px; transition: background 0.12s, color 0.12s;
    }
    .help-topbar-back:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .help-topbar-sep { width: 1px; height: 18px; background: var(--color-border); }
    .help-topbar-title { font-size: 14px; font-weight: 650; color: var(--color-text); }
    .help-topbar-spacer { flex: 1; }
    .theme-toggle {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px; cursor: pointer;
      color: var(--color-text-muted);
      border: none; background: transparent;
      transition: background 0.12s, color 0.12s;
    }
    .theme-toggle:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: block; }

    /* ── Body shell ── */
    .help-shell { flex: 1; display: flex; overflow: hidden; }

    /* ── Left nav ── */
    .help-nav {
      width: 220px; min-width: 220px;
      background: var(--color-bg-sidebar);
      border-right: 1px solid var(--color-border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .help-search-wrap { padding: 10px 10px 6px; flex-shrink: 0; }
    .help-search {
      width: 100%; padding: 6px 10px;
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: 8px; font-size: 13px; font-family: inherit;
      color: var(--color-text); outline: none;
      transition: border-color 0.15s;
    }
    .help-search:focus { border-color: var(--color-accent); }
    .help-search::placeholder { color: var(--color-text-muted); }
    .help-nav-list { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
    .help-nav-group {
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--color-text-muted);
      padding: 12px 14px 4px;
    }
    .help-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; cursor: pointer;
      border-radius: 6px; margin: 1px 6px;
      transition: background 0.12s, color 0.12s;
      color: var(--color-text-secondary);
      border: none; background: transparent;
      width: calc(100% - 12px); text-align: left;
      font-family: inherit; font-size: 13px;
    }
    .help-nav-item:hover { background: var(--nav-hover-bg); color: var(--color-text); }
    .help-nav-item.active { background: var(--nav-active-bg); color: var(--color-accent-dark); font-weight: 600; }
    .help-nav-icon { flex-shrink: 0; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
    .help-nav-item[hidden] { display: none; }
    a.help-nav-item { text-decoration: none; }

    /* ── Main content ── */
    .help-main { flex: 1; overflow-y: auto; background: var(--color-bg); }
    .help-content { max-width: 860px; padding: 40px 52px; margin: 0 auto; }

    /* ── Typography ── */
    .help-content h1 {
      font-size: 26px; font-weight: 700; margin-bottom: 6px; color: var(--color-text);
      border-bottom: 1px solid var(--color-border); padding-bottom: 14px;
    }
    .help-content .page-subtitle {
      color: var(--color-text-secondary); font-size: 14px; margin-bottom: 28px; margin-top: 6px;
    }
    .help-content h2 { font-size: 18px; font-weight: 650; margin: 32px 0 10px; color: var(--color-text); }
    .help-content h3 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; color: var(--color-text); }
    .help-content h4 { font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
    .help-content p { margin-bottom: 12px; line-height: 1.78; }
    .help-content ul, .help-content ol { margin-bottom: 12px; padding-left: 24px; }
    .help-content li { margin-bottom: 5px; line-height: 1.75; }
    .help-content hr { border: none; border-top: 1px solid var(--color-border); margin: 28px 0; }

    /* Code */
    .help-content pre {
      background: var(--color-code-bg); color: var(--color-code-text);
      border-radius: 10px; padding: 18px 22px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12.5px; overflow-x: auto; margin-bottom: 16px; line-height: 1.65;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .help-content pre code { background: none; color: inherit; padding: 0; border-radius: 0; font-size: inherit; }
    .hinline {
      background: var(--color-code-bg); color: var(--color-accent);
      border-radius: 4px; padding: 1px 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
    }

    /* Callouts */
    .callout {
      border-left: 3px solid var(--color-accent);
      background: var(--nav-hover-bg);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px; margin-bottom: 16px;
    }
    .callout p { margin-bottom: 0; color: var(--color-text); }
    .callout-warn { border-left-color: var(--color-warning); background: rgba(180,83,9,0.07); }
    .callout-info { border-left-color: var(--color-info); }
    .help-content blockquote {
      border-left: 3px solid var(--color-accent);
      padding: 4px 0 4px 16px; margin-bottom: 14px;
      color: var(--color-text-secondary);
    }
    .help-content blockquote p { color: var(--color-text-secondary); margin-bottom: 0; font-style: italic; }

    /* Tables */
    .help-content table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 13px; }
    .help-content th {
      text-align: left; padding: 8px 12px;
      border-bottom: 2px solid var(--color-border);
      color: var(--color-text); font-weight: 600; font-size: 11.5px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .help-content td { padding: 7px 12px; border-bottom: 1px solid var(--color-border-light); vertical-align: top; }
    .help-content tr:nth-child(even) td { background: rgba(61,107,82,0.04); }
    [data-theme="dark"] .help-content tr:nth-child(even) td { background: rgba(90,158,112,0.06); }

    /* Badges and links */
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 1px 7px; border-radius: 20px; margin-left: 6px;
      vertical-align: middle;
    }
    .badge-new    { background: rgba(42,122,79,0.15);  color: var(--color-success); }
    .badge-break  { background: rgba(184,50,50,0.12);  color: var(--color-error); }
    .badge-stable { background: rgba(61,107,82,0.12);  color: var(--color-accent); }
    .hdemo-btn {
      background: var(--nav-hover-bg); border: 1px solid var(--color-border);
      color: var(--color-accent); border-radius: 6px; padding: 3px 10px;
      font-size: 12px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
      transition: background 0.12s; font-family: inherit; cursor: pointer;
    }
    .hdemo-btn:hover { background: var(--nav-active-bg); }
    .hlink { color: var(--color-accent); text-decoration: underline; text-decoration-color: rgba(61,107,82,0.4); }
    .hlink:hover { text-decoration-color: var(--color-accent); }

    /* Step list */
    .step-list { counter-reset: step; list-style: none; padding: 0; margin-bottom: 16px; }
    .step-list li {
      counter-increment: step;
      display: flex; gap: 14px; align-items: flex-start;
      margin-bottom: 18px;
    }
    .step-list li::before {
      content: counter(step);
      flex-shrink: 0; width: 26px; height: 26px;
      background: var(--color-accent); color: #fff;
      border-radius: 50%; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
    }

    /* Example box */
    .example-box {
      border: 1px solid var(--color-border);
      border-radius: 10px; margin-bottom: 20px; overflow: hidden;
    }
    .example-box-header {
      background: var(--color-bg-elevated); border-bottom: 1px solid var(--color-border);
      padding: 8px 16px; font-size: 12px; font-weight: 600;
      color: var(--color-text-secondary); display: flex; align-items: center; gap: 8px;
    }
    .example-box-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); }
    .example-box pre { border-radius: 0; margin: 0; border: none; }

    /* Loading / error state */
    .help-loading {
      padding: 60px 52px; color: var(--color-text-muted); font-size: 14px;
    }
    .help-load-error {
      padding: 60px 52px; color: var(--color-error); font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .help-nav { width: 180px; min-width: 180px; }
      .help-content { padding: 20px 18px; }
    }
  </style>
</head>

<div class="help-topbar">

<script>
// ──────────────────────────────────────────────────────────────────────────────
// Minimal Markdown renderer
// ──────────────────────────────────────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inline(t) {
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,'<em>$1</em>');
  t = t.replace(/~~(.+?)~~/g,'<del>$1</del>');
  t = t.replace(/`([^`]+)`/g, (_,c) => '<code class="hinline">'+esc(c)+'</code>');
  t = t.replace(/\[([^\]]+)\]\(demo:([^)]+)\)/g, (_,l,f) =>
    '<a class="hdemo-btn" href="demo/'+f+'" target="_blank">&#9654; '+l+'</a>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,l,u) => {
    // Internal nav links (#section-id)
    if (u.startsWith('#')) return '<a class="hlink" href="javascript:void(0)" onclick="showSection(\''+u.slice(1)+'\')">'+l+'</a>';
    return '<a class="hlink" href="'+u+'" target="_blank" rel="noopener">'+l+'</a>';
  });
  return t;
}
function slug(t) {
  return t.replace(/<[^>]+>/g,'').toLowerCase().replace(/[^\w一-鿿]+/g,'-').replace(/^-|-$/g,'');
}

function renderMd(src) {
  const lines = src.split('\n');
  const blocks = []; const ph = [];
  let inFence=false, fLang='', fLines=[];

  for (const line of lines) {
    if (!inFence) {
      const m = line.match(/^```(\S*)\s*$/);
      if (m) { inFence=true; fLang=m[1]; fLines=[]; }
      else ph.push(line);
    } else {
      if (line.match(/^```\s*$/)) {
        const idx=blocks.length;
        blocks.push({lang:fLang,code:fLines.join('\n')});
        ph.push('\x00B'+idx+'\x00'); inFence=false;
      } else fLines.push(line);
    }
  }

  const out=[]; let i=0;
  while (i<ph.length) {
    const line=ph[i];
    const bm=line.match(/^\x00B(\d+)\x00$/);
    if (bm) {
      const {lang,code}=blocks[+bm[1]];
      out.push('<pre><code'+(lang?' class="lang-'+lang+'"':'')+'>'+esc(code)+'</code></pre>');
      i++; continue;
    }
    if (line.match(/^####\s/)) { const t=inline(esc(line.slice(5))); out.push('<h4 id="'+slug(line.slice(5))+'">'+t+'</h4>'); i++; continue; }
    if (line.match(/^###\s/))  { const t=inline(esc(line.slice(4))); out.push('<h3 id="'+slug(line.slice(4))+'">'+t+'</h3>'); i++; continue; }
    if (line.match(/^##\s/))   { const t=inline(esc(line.slice(3))); out.push('<h2 id="'+slug(line.slice(3))+'">'+t+'</h2>'); i++; continue; }
    if (line.match(/^#\s/))    { const t=inline(esc(line.slice(2))); out.push('<h1 id="'+slug(line.slice(2))+'">'+t+'</h1>'); i++; continue; }
    if (line.match(/^---+\s*$/)) { out.push('<hr>'); i++; continue; }
    if (line.match(/^>\s/)) {
      const bq=[]; while(i<ph.length&&ph[i].match(/^>\s?/)){bq.push(inline(esc(ph[i].replace(/^>\s?/,''))));i++;}
      out.push('<blockquote><p>'+bq.join('<br>')+'</p></blockquote>'); continue;
    }
    if (line.match(/^[-*]\s+/)) {
      const li=[]; while(i<ph.length&&ph[i].match(/^[-*]\s+/)){li.push('<li>'+inline(esc(ph[i].replace(/^[-*]\s+/,'')))+'</li>');i++;}
      out.push('<ul>'+li.join('')+'</ul>'); continue;
    }
    if (line.match(/^\d+\.\s+/)) {
      const li=[]; while(i<ph.length&&ph[i].match(/^\d+\.\s+/)){li.push('<li>'+inline(esc(ph[i].replace(/^\d+\.\s+/,'')))+'</li>');i++;}
      out.push('<ol>'+li.join('')+'</ol>'); continue;
    }
    if (line.match(/^\|/)) {
      const tl=[]; while(i<ph.length&&ph[i].match(/^\|/)){tl.push(ph[i]);i++;}
      if (tl.length>=2) {
        const pr=r=>r.split('|').slice(1,-1).map(c=>c.trim());
        const hd=pr(tl[0]); const rows=tl.slice(2).map(pr);
        let h='<table><thead><tr>'+hd.map(c=>'<th>'+inline(esc(c))+'</th>').join('')+'</tr></thead><tbody>';
        rows.forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+inline(esc(c))+'</td>').join('')+'</tr>';});
        out.push(h+'</tbody></table>');
      }
      continue;
    }
    if (line.trim()==='') { i++; continue; }
    const para=[];
    while(i<ph.length){
      const pl=ph[i];
      if(pl.trim()===''||pl.match(/^\x00B\d+\x00$/)||pl.match(/^#{1,4}\s/)||
         pl.match(/^---+\s*$/)||pl.match(/^>\s/)||pl.match(/^[-*]\s+/)||
         pl.match(/^\d+\.\s+/)||pl.match(/^\|/)) break;
      para.push(inline(esc(pl))); i++;
    }
    if(para.length) out.push('<p>'+para.join(' ')+'</p>');
  }
  return out.join('\n');
}

// IDs that have a content file
const CONTENT_IDS = new Set([
  'intro','quickstart','protocol','streaming','extension','error-handling',
  'components','layout','tokens','memory','plugin','workflow','testing','migration',
]);

// ──────────────────────────────────────────────────────────────────────────────
// Build nav
// ──────────────────────────────────────────────────────────────────────────────
function buildNav() {
  const list = document.getElementById('help-nav-list');
  list.innerHTML = NAV.map(item => {
    if (item.group) {
      return `<div class="help-nav-group">${item.group}</div>`;
    }
    if (item.href) {
      return `<a class="help-nav-item" data-id="${item.id}" href="${item.href}" target="_blank" rel="noopener">
        <span class="help-nav-icon">${item.icon}</span>
        ${item.label}
      </a>`;
    }
    return `<button class="help-nav-item" data-id="${item.id}" onclick="showSection('${item.id}')">
      <span class="help-nav-icon">${item.icon}</span>
      ${item.label}
    </button>`;
  }).join('');
}

// ──────────────────────────────────────────────────────────────────────────────
// Content cache + fetch loader
// ──────────────────────────────────────────────────────────────────────────────
const CACHE = {};

async function showSection(id) {
  if (!CONTENT_IDS.has(id)) return;

  // Update active nav state immediately
  document.querySelectorAll('.help-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  const contentEl = document.getElementById('help-content');

  // Serve from cache if available
  if (CACHE[id]) {
    contentEl.innerHTML = CACHE[id];
    history.replaceState(null, '', '#' + id);
    document.getElementById('help-main').scrollTop = 0;
    return;
  }

  // Show loading state
  contentEl.innerHTML = '<div class="help-loading">加载中…</div>';

  try {
    const res = await fetch('help/' + id + '.md');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    const html = renderMd(md);
    CACHE[id] = html;
    contentEl.innerHTML = html;
    history.replaceState(null, '', '#' + id);
    document.getElementById('help-main').scrollTop = 0;
  } catch (e) {
    contentEl.innerHTML = `<div class="help-load-error">加载失败（${e.message}）。请确认文件 <code class="hinline">docs/help/${id}.md</code> 存在，并通过 HTTP 服务器访问此页面。</div>`;
  }
}

// ──────────────────────────────────────────────────────────────────────────────
// Search — filters by label; content search available after section is loaded
// ──────────────────────────────────────────────────────────────────────────────
function filterNav(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.help-nav-item[data-id]').forEach(el => {
    const id = el.dataset.id;
    const label = el.textContent.toLowerCase();
    const inContent = CACHE[id] ? CACHE[id].toLowerCase().includes(q) : false;
    el.hidden = q !== '' && !label.includes(q) && !inContent;
  });
}

// ──────────────────────────────────────────────────────────────────────────────
// Theme
// ──────────────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('meso-theme', next);
  document.documentElement.setAttribute('data-theme', next);
}

// ──────────────────────────────────────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  const hash = location.hash.replace('#', '');
  const id = CONTENT_IDS.has(hash) ? hash : 'intro';
  showSection(id);
});
</script>
